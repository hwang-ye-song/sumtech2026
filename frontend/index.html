<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TwoPills — 약과 영양제를 한자리에</title>
<meta name="description" content="약과 영양제를 함께 먹을 때 해로운 조합을 출처와 함께 알려 주는 서비스 프로토타입">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
@font-face{font-family:'KofihJongwook';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2210-2@1.0/KOFIHDrLEEJWTTF-L.woff2') format('woff2');font-weight:300;font-display:swap}
@font-face{font-family:'KofihJongwook';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2210-2@1.0/KOFIHDrLEEJWTTF-B.woff2') format('woff2');font-weight:700;font-display:swap}
/* ───────── 토큰 (DESIGN.md) ───────── */
:root{
  --bg:#ffffff; --bg-2:#f1eefb; --bg-3:#e7e2f6;
  --line:#ddd7ee; --line-2:#c4bde0;
  --lav-edge:#b3a6e0; --lav-mid:#ddd5f5; --lav-light:#f4f1fc;
  --ink:#111318; --ink-2:#3f3a4c; --ink-3:#5f5870;
  --brand:#5b2457; --brand-ink:#431a40; --brand-bg:#f1e6ef;
  --black:#111318;
  --warn:#a63d2a; --warn-bg:#fbf1ee;
  --over:#8c6410; --over-bg:#fbf5e6;
  --none:#6b7280; --none-bg:#f1f2f4;
  --pill-a:#5b2457; --pill-b:#ffffff; --pill-c:#dfe3ea;
  --r-1:14px; --r-2:22px; --r-3:28px; --r-pill:9999px;
  --fs-0:11px; --fs-1:13.5px; --fs-2:15px; --fs-3:18px; --fs-4:28px; --fs-5:40px; --fs-6:66px;
  --font-head:"KofihJongwook","Malgun Gothic","Apple SD Gothic Neo",sans-serif; --font-body:var(--font-head); --font-num:var(--font-head);
  --ease:cubic-bezier(.2,.7,.2,1); --dur-1:120ms; --dur-2:200ms; --dur-3:300ms; --dur-4:600ms;
  --max:1120px; --g:max(0px,calc((100vw - 1120px) / 2));
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--lav-light) linear-gradient(90deg,var(--lav-edge) 0,var(--lav-mid) var(--g),var(--lav-light) calc(var(--g) + 96px),var(--lav-light) calc(100% - var(--g) - 96px),var(--lav-mid) calc(100% - var(--g)),var(--lav-edge) 100%) fixed;color:var(--ink);font-family:var(--font-body);font-size:var(--fs-2);line-height:1.6;overflow-x:hidden}
h1,h2,h3,h4{word-break:keep-all;margin:0;font-family:var(--font-head);font-weight:300;line-height:1.15;letter-spacing:-.01em}
h1{font-size:var(--fs-6)} h2{font-size:var(--fs-5)} h3{font-size:var(--fs-4)} h4{font-size:var(--fs-3);font-family:var(--font-body);font-weight:700}
h1 b,h2 b,h3 b{font-weight:700;color:var(--brand)}
p{margin:0 0 8px}
a{color:var(--brand-ink);text-decoration-thickness:1px;text-underline-offset:3px}
button{font:inherit;color:inherit}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.num{font-family:var(--font-num);font-weight:700;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3);font-size:var(--fs-1)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
.prose{max-width:640px}

/* ───────── 내비 ───────── */
.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
#app{position:relative;z-index:1}
#pillfield{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fpill{position:absolute;top:0;aspect-ratio:calc(var(--cw) / var(--ch));background:url(assets/pills2.jpg) no-repeat;background-size:calc(541 / var(--cw) * 100%) auto;background-position:calc(var(--cx) / (541 - var(--cw)) * 100%) calc(var(--cy) / (1043 - var(--ch)) * 100%);-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 58%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 58%,transparent 100%);will-change:transform}
.nav .wrap{height:64px;display:flex;align-items:center;gap:16px}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo .mark{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line-2);background:linear-gradient(90deg,var(--pill-a) 50%,var(--pill-b) 50%);transform:rotate(-24deg)}
.logo .word{font-family:var(--font-head);font-weight:700;font-style:italic;font-size:22px;letter-spacing:-.02em}
.nav .tabs{display:flex;gap:4px;margin-left:16px}
.nav .tabs a{padding:8px 14px;border-radius:var(--r-pill);text-decoration:none;color:var(--ink-2);font-weight:700}
.nav .tabs a[aria-current="page"]{background:var(--bg-3);color:var(--ink)}
.nav .spacer{flex:1}
.nav .who{font-size:var(--fs-1);color:var(--ink-3)}
.bottombar{display:none}

/* ───────── 버튼·칩·배지 ───────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:var(--r-pill);border:1px solid var(--line-2);background:var(--bg);cursor:pointer;font-weight:700;text-decoration:none;white-space:nowrap;transition:background var(--dur-2) var(--ease),transform var(--dur-1) var(--ease),filter var(--dur-2) var(--ease)}
.btn:hover{background:var(--bg-2)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-ink)}
.btn-black{background:var(--black);border-color:var(--black);color:#fff}
.btn-black:hover{filter:brightness(1.15);background:var(--black)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--bg-2)}
.btn-sm{min-height:36px;padding:0 14px;font-size:var(--fs-1)}
.btn-lg{min-height:56px;padding:0 28px;font-size:var(--fs-3)}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:var(--r-pill);border:1px solid var(--line-2);background:var(--bg);cursor:pointer;font-size:var(--fs-2)}
.chip[aria-pressed="true"]{background:var(--brand-bg);border-color:var(--brand);color:var(--brand-ink)}
.badge{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:0 10px;border-radius:var(--r-pill);font-size:var(--fs-1);font-weight:700;background:var(--bg-3);color:var(--ink-2)}
.badge-warn{background:var(--warn-bg);color:var(--warn)}
.badge-over{background:var(--over-bg);color:var(--over)}
.badge-none{background:var(--none-bg);color:var(--none)}
.badge-cobalt{background:var(--brand-bg);color:var(--brand-ink)}
.ico{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;display:inline-grid;place-items:center;font-size:10px;line-height:1;font-weight:700;flex:none}
.seg{display:inline-flex;padding:4px;border-radius:var(--r-pill);background:var(--bg-3)}
.seg button{min-height:40px;padding:0 18px;border:0;border-radius:var(--r-pill);background:transparent;cursor:pointer;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* ───────── 폼 ───────── */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-weight:700}
.input{min-height:48px;padding:0 16px;border-radius:var(--r-1);border:1px solid var(--line-2);background:var(--bg-2);width:100%}
textarea.input{min-height:96px;padding:12px 16px;resize:vertical}
.input:focus{border-color:var(--brand);background:var(--bg)}
.hint{font-size:var(--fs-1);color:var(--ink-3)}
.error{font-size:var(--fs-1);color:var(--warn);font-weight:700}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{width:20px;height:20px;margin:3px 0 0;accent-color:var(--brand)}
.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* ───────── 카드·레이아웃 ───────── */
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-2);padding:24px}
.card-soft{background:var(--bg-2);border-color:transparent}
.card-link{display:block;text-decoration:none;color:inherit;transition:transform var(--dur-2) var(--ease),box-shadow var(--dur-2) var(--ease)}
.card-link:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(17,19,24,.08)}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)} .grid-3{grid-template-columns:repeat(3,1fr)} .grid-4{grid-template-columns:repeat(4,1fr)}
.section{padding:64px 0}
.section + .section{border-top:1px solid var(--line)}
.eyebrow{font-size:var(--fs-1);font-weight:700;letter-spacing:.06em;color:var(--brand-ink);text-transform:uppercase;margin-bottom:16px}
.page{padding:40px 0 96px}
.page-head{margin-bottom:24px}
.page-head h2{font-size:var(--fs-5)}
.stack>*+*{margin-top:16px}
.empty{padding:40px 24px;text-align:center;color:var(--ink-2);border:1px dashed var(--line-2);border-radius:var(--r-2)}
.notice{padding:16px 24px;border-radius:var(--r-1);background:var(--brand-bg);color:var(--brand-ink)}
.notice-none{background:var(--none-bg);color:var(--ink)}
.notice-warn{background:var(--warn-bg);color:var(--warn)}
.disclaimer{padding:16px 24px;border-radius:var(--r-1);background:var(--bg-2);color:var(--ink-2);font-size:var(--fs-1)}
blockquote.quote{margin:0;padding:12px 16px;border-left:3px solid var(--line-2);background:var(--bg-2);border-radius:0 var(--r-1) var(--r-1) 0;font-size:var(--fs-2)}
.src{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:var(--fs-1)}
.src .t{font-weight:700}
hr.sep{border:0;border-top:1px solid var(--line);margin:16px 0}

/* ───────── 표 ───────── */
table.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-2)}
.tbl th{font-weight:700;color:var(--ink-3);font-size:var(--fs-1);text-align:left;padding:8px 12px;background:var(--bg-3)}
.tbl th:first-child{border-radius:var(--r-1) 0 0 var(--r-1)} .tbl th:last-child{border-radius:0 var(--r-1) var(--r-1) 0}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .name{font-weight:700}

/* ───────── 히어로 ───────── */
.hero{padding:64px 0 40px}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero h1{margin:8px 0 16px}
.hero .lead{font-size:var(--fs-3);color:var(--ink-2);max-width:560px}
.hero .cta{display:flex;gap:12px;margin:24px 0 16px;flex-wrap:wrap}
.panel{width:440px;max-width:100%;justify-self:end;padding:24px;border-radius:var(--r-3);background:rgba(255,255,255,.82);border:1px solid var(--line);box-shadow:0 12px 40px rgba(80,60,160,.12)}
.panel .cap{font-size:var(--fs-1);color:var(--ink-3);margin-bottom:12px}
.panel .chips{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.panel .chip{cursor:default;background:var(--bg);box-shadow:0 2px 8px rgba(17,19,24,.06);font-size:var(--fs-1)}
.hero h1{font-size:56px}
.preview .act{word-break:keep-all;font-size:var(--fs-4);font-weight:700;color:var(--warn);margin:12px 0;line-height:1.25}
.cmp{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--fs-2)}
.cmp th,.cmp td{padding:16px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.cmp thead th{font-size:var(--fs-1);color:var(--ink-3)}
.cmp tbody th{width:22%;font-weight:700}
.cmp .us{background:var(--brand-bg);color:var(--brand-ink);font-weight:700}
.cmp thead .us{border-radius:var(--r-1) var(--r-1) 0 0}
.cmp tbody tr:last-child .us{border-radius:0 0 var(--r-1) var(--r-1)}
.cmp tbody tr:last-child th,.cmp tbody tr:last-child td{border-bottom:0}
.cmp-wrap{overflow-x:auto;background:rgba(255,255,255,.8);border-radius:var(--r-2);border:1px solid var(--line);padding:8px}
.cmp{min-width:720px}
.problem{font-size:var(--fs-3);color:var(--ink-2)}
.who .tag{font-size:var(--fs-1);font-weight:700;color:var(--brand-ink);margin-bottom:8px}
.step .num{font-size:var(--fs-4);color:var(--brand-ink)}
.band{background:var(--black);color:#fff;border-radius:var(--r-3);padding:48px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.band h3{color:#fff}
.band h3 b{color:#fff}
.footer{padding:40px 0 64px;border-top:1px solid var(--line);font-size:var(--fs-1);color:var(--ink-3)}
.footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* ───────── 복용 목록 ───────── */
.list-layout{display:grid;grid-template-columns:400px 1fr;gap:24px;align-items:start}
.result{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r-1);cursor:pointer;background:var(--bg);text-align:left;width:100%}
.result:hover{background:var(--bg-2)}
.result .n{font-weight:700} .result .s{font-size:var(--fs-1);color:var(--ink-3)}
.results{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto}
.tips{margin:0;padding-left:20px}
.tips li{margin:4px 0}
.drop{border:2px dashed var(--line-2);border-radius:var(--r-2);padding:24px;text-align:center;background:var(--bg-2)}
.drop input{display:none}

/* ───────── 경고 창·토스트 ───────── */
.overlay{position:fixed;inset:0;background:rgba(17,19,24,.45);display:grid;place-items:center;padding:16px;z-index:50;animation:fade var(--dur-2) var(--ease)}
.modal{background:var(--bg);border-radius:var(--r-3);width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:32px;animation:rise var(--dur-3) var(--ease)}
.modal h3{margin:8px 0 16px}
.finding{padding:20px;border-radius:var(--r-2);border:1px solid var(--line)}
.finding+.finding{margin-top:16px}
.finding .head{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.finding .lvl{font-size:var(--fs-3);font-weight:700}
.finding .act{font-family:var(--font-head);font-size:var(--fs-4);font-weight:700;margin:4px 0 12px}
.finding-warn .lvl,.finding-warn .act{color:var(--warn)}
.finding-over .lvl,.finding-over .act{color:var(--over)}
.finding .pair{font-weight:700;margin-bottom:8px}
.finding .q{margin-top:12px;padding:12px 16px;border-radius:var(--r-1);background:var(--bg-2)}
.modal .actions{display:flex;gap:12px;justify-content:flex-end;margin-top:24px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--black);color:#fff;padding:12px 20px;border-radius:var(--r-pill);z-index:60;animation:rise var(--dur-2) var(--ease);max-width:calc(100% - 32px)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.progress{display:flex;flex-direction:column;gap:12px;margin:24px 0}
.progress .p{display:flex;gap:12px;align-items:center;color:var(--ink-3)}
.progress .p .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line-2)}
.progress .p.done{color:var(--ink)} .progress .p.done .dot{background:var(--brand);border-color:var(--brand)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.summary .card .num{font-size:var(--fs-5);line-height:1.1}
.summary .warn .num{color:var(--warn)}

/* ───────── 반응형 ───────── */
@media (max-width:1000px){
  .hero-grid{grid-template-columns:1fr}
  .panel{justify-self:start;width:100%}
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .list-layout{grid-template-columns:1fr}
}
@media (max-width:760px){
  :root{--fs-2:16px;--fs-6:40px;--fs-5:28px}
  .hero h1{font-size:36px}
  .wrap{padding:0 16px}
  .section{padding:40px 0}
  .grid-2,.grid-3,.grid-4,.summary,.row-2{grid-template-columns:1fr}
  .nav .tabs,.nav .who{display:none}
  body.app{padding-bottom:72px}
  .bottombar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);height:64px}
  .bottombar a{flex:1;display:grid;place-items:center;text-decoration:none;color:var(--ink-2);font-size:var(--fs-1);font-weight:700}
  .bottombar a[aria-current="page"]{color:var(--brand-ink)}
  .band{padding:32px 24px}
  .modal{padding:24px}
  .modal .actions{flex-direction:column-reverse}
  .modal .actions .btn{width:100%}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

<script>
/* ═══════════════ DB (목업·출처 있는 것만) ═══════════════ */

function entryIngs(e){ return item(e.catalogId).ings; }
function dailyMg(e){ return e.mg ? e.count * e.mg : null; }
function pairKey(a,b){ return [a,b].sort().join('|'); }
function findRule(a,b){ return RULES.find(r => pairKey(r.a,r.b) === pairKey(a,b)); }
function displayEntry(e){ const c = item(e.catalogId); return { name:c.name, easy:c.easy, kind:c.kind, dose: e.mg ? `${e.count}알 × ${e.mg}mg = 하루 ${e.count*e.mg}mg` : `하루 ${e.count}${c.kind==='영양제'?'알':'정'}` }; }
// 새 항목(또는 목록 전체)을 점검해 소견 목록을 돌려준다
function judge(entries, newEntry){
  const findings = []; const seen = new Set(); let checkedPairs = 0;
  const targets = newEntry ? [newEntry] : entries;
  for(const t of targets){
    for(const o of entries){
      if(o === t || o.id === t.id) continue;
      for(const a of entryIngs(t)) for(const b of entryIngs(o)){
        if(a === b) continue; checkedPairs++;
        const r = findRule(a,b); if(!r) continue;
        const k = r.id; if(seen.has(k)) continue; seen.add(k);
        // 표시 순서는 규칙에 적힌 순서(약 ↔ 영양제)로 고정한다
        findings.push({ type:'pair', rule:r, level:r.level, left:r.a, right:r.b });
      }
    }
  }
  // 하루 합계
  const all = newEntry ? [...entries.filter(e=>e.id!==newEntry.id), newEntry] : entries;
  for(const L of LIMITS){
    const parts = all.filter(e => entryIngs(e).includes(L.ing) && dailyMg(e));
    const total = parts.reduce((s,e)=>s+dailyMg(e),0);
    if(total > L.judge) findings.push({ type:'limit', rule:L, level:'over', total, parts });
  }
  findings.sort((x,y)=>LEVEL_ORDER[x.level]-LEVEL_ORDER[y.level]);
  return { findings, checkedPairs };
}
function ruleById(id){ return RULES.find(r=>r.id===id) || LIMITS.find(l=>l.id===id); }

let fieldEls = null;
function buildField(){
  const host = document.getElementById('pillfield'); if(!host) return;
  host.innerHTML = '';
  // 글이 있는 가운데(최대 1120px)는 비우고, 양옆 여백 안에만 알약을 둔다. 여백이 좁으면(휴대폰·작은 창) 알약을 숨긴다
  const gutter = Math.max(0, (window.innerWidth - 1120) / 2);
  host.style.display = gutter < 56 ? 'none' : '';
  if(gutter < 56){ fieldEls = []; return; }
  fieldEls = FIELD.map(f => {
    const w = Math.round(Math.min(f.c[2] * 1.1, gutter * f.k));
    const off = Math.max(0, (gutter - w) / 2 + gutter * f.j * .5); // 여백 한가운데에서 조금 흔들어 놓는다
    const el = document.createElement('div'); el.className = 'fpill';
    el.style.cssText = `--cx:${f.c[0]};--cy:${f.c[1]};--cw:${f.c[2]};--ch:${f.c[3]};width:${w}px;${f.side==='L'?'left':'right'}:${Math.round(off)}px`;
    host.appendChild(el); return { el, f };
  });
}

function parallax(){
  parallaxQueued = false;
  const vh = window.innerHeight, sy = window.scrollY;
  if(!fieldEls) buildField();
  fieldEls.forEach(({el,f}) => {
    const h = el.offsetHeight, loop = vh + h*2;
    // 알약마다 다른 속도로 위로 흘러가다 화면 밖으로 나가면 반대쪽에서 다시 들어온다. 스크롤을 올리면 거꾸로 간다
    const y = (((f.y*vh/900 - (reduceMotion?0:sy)*f.speed) % loop) + loop) % loop - h;
    const r = f.base + (reduceMotion?0:sy*f.rot);
    el.style.transform = `translate3d(0,${y.toFixed(1)}px,0) rotate(${r.toFixed(2)}deg)`;
  });
}
function queueParallax(){ if(!parallaxQueued){ parallaxQueued = true; requestAnimationFrame(parallax); } }
window.addEventListener('scroll', queueParallax, { passive:true });
window.addEventListener('resize', () => { buildField(); queueParallax(); });

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', render);
function route(){ const h = location.hash.replace(/^#\/?/, ''); return h.split('/'); }
function render(){
  const [p, arg] = route();
  const authed = !!me();
  const needAuth = ['home','list','analyze','report','detail','recommend'];
  if(needAuth.includes(p) && !authed){ go('/login'); return; }
  if((p === 'login' || p === 'signup') && authed){ go('/home'); return; }
  if(!['', 'signup','login','home','list','analyze','report','detail','recommend'].includes(p)){ go('/'); return; }
  document.body.classList.toggle('app', authed);
  const app = document.getElementById('app');
  const pages = { '':Landing, signup:Signup, login:Login, home:Home, list:List, analyze:Analyze, report:Report, detail:Detail, recommend:Recommend };
  app.innerHTML = Nav(p) + pages[p](arg) + (authed ? BottomBar(p) : '');

    <form data-form="recommend" novalidate class="stack">
      <div><h4>원하는 효과</h4><p class="faint">여러 개 골라도 돼요</p><div class="row" data-testid="goals">${chips(GOALS, s.goals, 'goals')}</div></div>
      <div><h4>지금 증상</h4><div class="row" data-testid="symptoms">${chips(SYMPTOMS, s.symptoms, 'symptoms')}</div></div>
      <div class="field"><label for="note">더 적고 싶은 것 (선택)</label><textarea class="input" id="note" name="note" placeholder="예 요즘 야근이 많아요">${esc(s.note)}</textarea></div>
      ${view.recError ? `<p class="error" role="alert">${esc(view.recError)}</p>` : ''}
      <button class="btn btn-primary btn-lg" type="submit" data-testid="rec-submit">추천 보기</button>
    </form>
  </div></main>`;
}
function recommend(survey, list){
  // AI 목업: DB의 성분 효과 안에서만 고른다. 실제 구현에서는 LLM이 같은 제약으로 고른다
  const picks = [];
  for(const [ing, ef] of Object.entries(EFFECTS)){
    const why = [];
    for(const g of survey.goals) if(ef.goals.includes(g)) why.push(`원하는 효과 '${g}'`);
    for(const s of survey.symptoms) if(ef.symptoms.includes(s)) why.push(`지금 증상 '${s}'`);
    if(!why.length) continue;
    const already = list.some(e=>entryIngs(e).includes(ing));
    if(already) continue;
    // F4와 같은 규칙으로 내 목록과 다시 점검
    const conflicts = [];
    for(const e of list) for(const b of entryIngs(e)){ const r = findRule(ing, b); if(r) conflicts.push({ rule:r, other:b }); }
    picks.push({ ing, ef, why, conflicts });
  }
  return { ok: picks.filter(p=>!p.conflicts.length), caution: picks.filter(p=>p.conflicts.length) };
}
function RecommendResult(){
  const s = view.survey; if(!s || (!s.goals.length && !s.symptoms.length)){ go('/recommend'); return ''; }
  const { ok, caution } = recommend(s, myList());
  const card = p => `<div class="card" data-testid="rec-item"><div class="row" style="justify-content:space-between"><h4>${esc(ingName(p.ing))}</h4><span class="badge badge-cobalt">추천</span></div>
    <p class="muted" style="margin-top:8px">왜 골랐나요: ${p.why.join(', ')} 때문이에요.</p>
    <blockquote class="quote">${esc(p.ef.effect)}</blockquote><div style="margin-top:8px">${srcLine(p.ef.src)}</div></div>`;
  const warnCard = p => `<div class="card" style="border-color:var(--warn)" data-testid="rec-caution"><div class="row" style="justify-content:space-between"><h4>${esc(ingName(p.ing))}</h4>${levelBadge(p.conflicts[0].rule.level)}</div>
    <p style="margin-top:8px;color:var(--warn);font-weight:700">지금 드시는 ${p.conflicts.map(c=>ingLabel(c.other)).join('·')}과 함께 주의가 필요해요</p>
    ${p.conflicts.map(c=>`<p class="muted">${esc(ingLabel(c.other))} ↔ ${esc(ingName(p.ing))}: ${esc(c.rule.action || T.levels[c.rule.level])}</p><div class="stack">${c.rule.sources.map(srcLine).join('')}</div>`).join('')}
    <p class="faint" style="margin-top:8px">${p.why.join(', ')} 때문에 후보에 올랐지만, 추천이 아니라 경고로 보여 드려요.</p></div>`;
  return `<main class="page"><div class="wrap" style="max-width:800px">
    <div class="disclaimer" data-testid="rec-disclaimer-top">${T.recDisclaimer}</div>
    <div class="page-head" style="margin-top:24px"><div class="eyebrow">추천 결과</div><h2>내 약과 부딪히지 않는 <b>성분</b></h2><p class="muted">고른 효과: ${s.goals.join(', ')||'—'} / 증상: ${s.symptoms.join(', ')||'—'}</p></div>
    <section class="stack" data-testid="rec-ok"><h4>추천</h4>${ok.length ? ok.map(card).join('') : `<div class="empty">DB의 효과 문장과 맞는 추천이 없어요. 다른 효과를 골라 보세요.</div>`}</section>
    ${caution.length ? `<section class="stack" style="margin-top:24px" data-testid="rec-warn"><h4>주의</h4>${caution.map(warnCard).join('')}</section>` : ''}
    <div class="disclaimer" style="margin-top:24px" data-testid="rec-disclaimer-bottom">${T.recDisclaimer}</div>
    <div class="row" style="margin-top:24px"><a class="btn" href="#/recommend">다시 고르기</a><a class="btn btn-ghost" href="#/home">홈으로</a></div>
  </div></main>`;
}

/* ═══════════════ 경고 창·토스트 ═══════════════ */
function showModal(html){ document.getElementById('layer').innerHTML = `<div class="overlay" data-overlay><div class="modal" role="dialog" aria-modal="true" data-testid="modal">${html}</div></div>`; const f = document.querySelector('.modal [data-autofocus]'); if(f) f.focus(); }
function closeModal(){ document.getElementById('layer').innerHTML = ''; }
function toast(msg){ const el = document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); el.setAttribute('data-testid','toast'); el.textContent = msg; document.body.appendChild(el); setTimeout(()=>el.remove(), 3000); }
function WarningModal(findings){
  const top = findings[0];
  return `<div class="faint">등록하기 전에 확인하세요</div>
    <h3>${esc(T.levels[top.level])}</h3>
    ${findings.map(f=>Finding(f)).join('')}
    <div class="disclaimer" style="margin-top:16px">${T.consult}</div>
    <div class="actions"><button class="btn" data-action="modal-cancel" data-testid="modal-cancel">취소</button><a class="btn" href="#/detail/${top.rule.id}" data-action="modal-detail" data-testid="modal-detail">자세히</a><button class="btn btn-black" data-action="modal-add" data-testid="modal-add" data-autofocus>그래도 추가</button></div>`;
}

/* ═══════════════ 동작 ═══════════════ */
function search(q){
  q = q.trim(); const ql = q.toLowerCase();
  const starts = [], contains = [];
  for(const c of CATALOG){
    if(c.name.includes('수출')) continue;
    const fields = [c.name, c.easy, c.raw, ...c.keys].map(s=>s.toLowerCase());
    if(fields.some(f=>f.startsWith(ql))) starts.push(c); else if(fields.some(f=>f.includes(ql))) contains.push(c);
  }
  return [...starts, ...contains].slice(0,20);
}
function registerFlow(entry){
  const list = myList();
  if(list.some(e=>e.catalogId===entry.catalogId)){ view.regError = T.already; render(); return; }
  const { findings, checkedPairs } = judge(list, entry);
  const commit = () => { list.push(entry); save(); view.selected=null; view.results=null; view.q=''; view.count=''; view.mg=''; view.regError=''; view.photo=null; };
  if(findings.length){
    view.pending = entry;
    showModal(WarningModal(findings));
  } else {
    commit();
    view.flash = NoRecordCard(checkedPairs);
    render(); toast('목록에 추가했어요');
  }
}
function readPhoto(nameOrSample){
  view.photo = { step:'reading' }; render();
  setTimeout(()=>{
    const n = (nameOrSample||'').toLowerCase();
    if(n.includes('blur') || n.includes('흐린')) view.photo = { step:'error', msg:T.blurry };
    else if(n.includes('fero') || n.includes('훼로바')) view.photo = { step:'candidates', list:[item('ferobau'), item('iron')] };
    else if(n.includes('synth') || n.includes('씬지')) view.photo = { step:'candidates', list:[item('synthroid')] };
    else view.photo = { step:'candidates', list:[] };
    render();
  }, 600);
}
document.addEventListener('click', ev => {
  const a = ev.target.closest('[data-action]'); if(!a) return;
  const act = a.dataset.action;
  if(act==='logout'){ state.session=null; save(); view={}; go('/'); }
  if(act==='demo'){ view.prefillEmail=SEED.email; view.prefillPw=SEED.pw; render(); }
  if(act==='mode'){ view.listMode=a.dataset.mode; view.selected=null; view.results=null; view.regError=''; view.flash=''; if(a.dataset.mode==='photo') view.photo={step:'consent'}; render(); }
  if(act==='select'){ view.selected=a.dataset.id; view.regError=''; view.flash=''; if(view.photo) view.photo={step:'selected', sel:a.dataset.id}; render(); setTimeout(()=>{const c=document.getElementById('cnt'); if(c) c.focus();},0); }
  if(act==='unselect'){ view.selected=null; view.photo=null; render(); }
  if(act==='photo-consent'){ view.photo={step:'shoot'}; render(); }
  if(act==='photo-retry'){ view.photo={step:'shoot'}; render(); }
  if(act==='photo-sample'){ readPhoto(a.dataset.sample); }
  if(act==='ask-delete'){ const e = myList().find(x=>x.id===a.dataset.id); const c=item(e.catalogId); showModal(`<h3>삭제할까요?</h3><p class="muted"><strong>${esc(c.name)}</strong>을(를) 목록에서 지워요. 분석 보고서에서도 사라져요.</p><div class="actions"><button class="btn" data-action="modal-cancel">취소</button><button class="btn btn-black" data-action="confirm-delete" data-id="${e.id}" data-testid="confirm-delete" data-autofocus>삭제</button></div>`); }
  if(act==='confirm-delete'){ const l=myList(); const i=l.findIndex(x=>x.id===a.dataset.id); if(i>-1) l.splice(i,1); save(); closeModal(); view.flash=''; render(); toast(T.deleted); }
  if(act==='modal-cancel'){ closeModal(); view.pending=null; }
  if(act==='modal-add'){ const e=view.pending; view.pending=null; closeModal(); if(e){ myList().push(e); save(); view.selected=null; view.results=null; view.q=''; view.count=''; view.mg=''; view.photo=null; view.flash=''; render(); toast('경고를 확인하고 목록에 추가했어요'); } }
  if(act==='modal-detail'){ closeModal(); view.pending=null; }
  if(act==='analyze'){ view.running=true; view.runStep=0; render(); const tick=()=>{ view.runStep++; if(view.runStep<=3){ render(); setTimeout(tick,300);} else { view.running=false; go('/report'); } }; setTimeout(tick,300); }
  if(act==='back'){ history.back(); }
  if(act==='chip'){ const s=view.survey; const arr=s[a.dataset.key]; const v=a.dataset.val; const i=arr.indexOf(v); if(i>-1) arr.splice(i,1); else arr.push(v); a.setAttribute('aria-pressed', i===-1); }
});
document.addEventListener('submit', ev => {
  const f = ev.target.closest('[data-form]'); if(!f) return; ev.preventDefault();
  const d = Object.fromEntries(new FormData(f).entries());
  const kind = f.dataset.form;
  if(kind==='signup'){
    const email = (d.email||'').trim().toLowerCase();
    if(!email.includes('@')) view.signupError='이메일을 확인해 주세요';
    else if(state.users[email]) view.signupError=T.dupEmail;
    else if((d.pw||'').length<8) view.signupError='비밀번호는 8자 이상이에요';
    else if(d.pw!==d.pw2) view.signupError='비밀번호가 서로 달라요';
    else if(!d.consent) view.signupError='동의해야 가입할 수 있어요';
    else { state.users[email]={pw:d.pw}; state.lists[email]=[]; state.session=email; save(); view={}; go('/home'); return; }
    render();
  }
  if(kind==='login'){
    const email=(d.email||'').trim().toLowerCase(); const u=state.users[email];
    if(!u || u.pw!==d.pw){ view.loginError=T.badLogin; view.prefillEmail=d.email; render(); return; }
    state.session=email; save(); view={}; go('/home');
  }
  if(kind==='search'){
    const q=(d.q||'').trim(); view.q=q; view.selected=null; view.flash='';
    if(q.length<2){ view.qError=T.minChars; view.results=null; } else { view.qError=''; view.results=search(q); }
    render();
  }
  if(kind==='register'){
    const c=item(view.selected); const count=parseInt(d.count,10); const mg=d.mg?parseFloat(d.mg):null;
    view.count=d.count; view.mg=d.mg||'';
    if(!(count>=1)){ view.regError='하루에 먹는 개수를 1 이상 넣어 주세요'; render(); return; }
    registerFlow({ id:uid(), catalogId:c.id, count, mg: c.kind==='영양제' && mg>0 ? mg : null });
  }
  if(kind==='recommend'){
    const s=view.survey; s.note=d.note||'';
    if(!s.goals.length && !s.symptoms.length){ view.recError='원하는 효과나 지금 증상을 하나 이상 골라 주세요'; render(); return; }
    view.recError=''; go('/recommend/result');
  }
});
document.addEventListener('change', ev => {
  const i = ev.target; if(i.dataset.file==='photo' && i.files && i.files[0]) readPhoto(i.files[0].name);
});
document.addEventListener('keydown', ev => { if(ev.key==='Escape' && document.querySelector('[data-overlay]')){ closeModal(); view.pending=null; } });
</script>
</body>
</html>
