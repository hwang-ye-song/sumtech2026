# 사용자 핵심 흐름. 2026-10-30 팀 결정으로 흐름 8개 모두 대표 고객 한 세대, 약을 매일 드시는 50~60대 부모님(problem.yaml P3)의 장면으로 맞췄습니다.
# 흐름은 등록(검색·사진, 처음엔 경고 없이) → '검진하기'로 한 번에 점검 → 이후 추가하면 자동 경고 → 근거 → 비타민 추천을 따라갑니다. 데모·주최 측 실행은 웹사이트(PC 화면) 기준입니다. 가족 그룹은 고도화로 두어 흐름에서 뺐습니다.
# 2026-10-29 팀 결정: 사진 등록(촬영 안내·다시 찍기)과 설문 기반 영양제 추천을 구현한다. 흐름은 8개까지라
#   쉬운 이름 검색과 다시 로그인 흐름을 빼고 사진(S7)·추천(S6) 흐름을 넣었다(쉬운 이름 검색은 F3 완료 조건으로 남는다).
# 하루 복용량은 '하루에 먹는 개수'(필수)와 영양제 '한 알 함량'(선택)으로 넣는다. 삭제 문구는 "약·영양제".
# 메뉴·버튼 이름은 시안이며, 화면을 만들면서 바뀌면 이 파일과 e2e spec을 함께 고칩니다.
# 시드: 복용자 계정 목록에는 레보티록신(갑상선약, 하루 1정)과 칼슘(하루 1000mg)이 들어 있고 첫 검진을 마친 상태라, 이후 추가하면 자동 점검된다.
#   부모님 본인의 목록이다(처음 목록은 자녀가 대신 만들어 드릴 수 있다).
# 사진 흐름(S7)에 올릴 사진은 e2e/fixtures/blurry-pill.jpg(흐린 알약 사진)와 e2e/fixtures/ferobau-box.jpg(훼로바-유서방정 상자 사진)로 커밋한다.
# S6·S7은 실제 AI 응답을 기다려 확인한다(AI_GATEWAY_API_KEY).
# 주최 측 실행은 S1부터 같은 DB에서 차례로 돈다. 그래서
#   - 복용자 계정을 쓰는 흐름은 목록을 바꾸지 않고 끝나거나(취소), 바꾼 것을 흐름 안에서 되돌린다(S3).
#   - 목록을 바꾸는 흐름은 새로 가입해서 한다(S1, S8). 이메일은 실행마다 다르게 만든다.
#   - 알아보기 흐름(S4)은 로그인하지 않고 한다(F6, 가입 전에 먼저 보는 화면).
platform: desktop
platformReason: |
  2026-10-29 팀 결정으로 데모와 주최 측 실행은 웹사이트(PC 화면)를 기준으로 한다. 복용 목록·검진 리포트·근거 원문을
  한 화면에 넓게 펼쳐 보여 주는 장면이 데모의 중심이고, 사진 등록은 PC에서 사진 파일을 올리는 방식으로 확인한다.
  휴대폰 폭에서도 화면이 넘치지 않고 로그인 뒤 메뉴가 아래 탭 바로 바뀌지만, 흐름 검증은 PC 화면으로만 한다.
scenarios:
  # ── 50~60대 부모님(P3) ──
  - id: S1
    title: 갑상선약을 드시는 50~60대 부모님이 서비스 소개를 보고 가입해 레보티록신을 등록한다
    steps:
      - 첫 화면에서 서비스 소개와 '처방이나 진단을 하지 않아요' 안내를 확인한다
      - 첫 화면 위쪽의 '회원가입'을 누른다
      - 이메일 칸에 새 이메일을, 비밀번호 칸에 8자 이상 비밀번호를 입력한다
      - 비밀번호 확인 칸에 실수로 다른 비밀번호를 입력한다
      - "'건강 정보 수집·이용과 사진 AI 판독에 동의해요'에 체크한다"
      - "'가입하기'를 누른다"
      - 오류 안내를 보고 비밀번호와 비밀번호 확인 칸에 같은 비밀번호를 다시 입력한다
      - "'가입하기'를 누른다"
      - 검색창에 '레보티록신'을 입력하고 '검색'을 누른다
      - 검색 결과에서 '레보티록신'을 고른다
      - "'하루에 먹는 개수'에 1을 입력한다"
      - "'등록'을 누른다"
    expected: 비밀번호 확인이 다르면 가입되지 않고 "비밀번호 확인이 비밀번호와 달라요."가 보이며, 입력한 이메일과 동의 체크는 그대로 남아 있다. 고쳐서 다시 누르면 바로 복용 목록 화면으로 가서 "가입을 환영해요! 지금 먹고 있는 약과 영양제를 먼저 등록해 주세요." 안내와 검색창이 보인다. 처음 등록이라 경고 창 없이 '약' 표에 레보티록신 1정이 보인다
  - id: S2
    title: 칼슘을 드시는 50~60대 부모님이 피로회복용 비타민제(비맥스제트정)를 더하려다 식약처 원문 경고를 받는다
    account: 복용자
    steps:
      - 홈에서 '복용 목록'을 누른다
      - 검색창에 '비맥스'를 입력하고 '검색'을 누른다
      - 검색 결과에서 '비맥스제트정'을 고른다
      - "'하루에 먹는 개수'에 1을 입력한다"
      - "'등록'을 누른다"
      - 경고 창의 '취소'를 누른다
    expected: 경고 창 맨 위에 "함께 먹지 마세요"가 보이고, 그 아래 "비맥스제트정 ↔ 칼슘", 식약처 원문 "인산염, 칼슘염, 경구용 테트라사이클린계 제제, 제산제, 레보도파와 함께 복용하지 마십시오.", 출처 제목 "비맥스제트정 e약은요", 약사에게 물을 질문, "복용을 바꾸기 전에 약사·의사와 상담하세요"가 보인다. '취소'하면 복용 목록에 비맥스제트정이 없다
  - id: S3
    title: 감기에 걸린 50~60대 부모님이 비타민C를 더하면 안전하다고 단정하지 않는 안내를 받고, 잘못 넣은 것은 지운다
    account: 복용자
    steps:
      - 홈에서 '복용 목록'을 누른다
      - 검색창에 '비타민C'를 입력하고 '검색'을 누른다
      - 검색 결과에서 '비타민C'를 고른다
      - "'하루에 먹는 개수'에 1을 입력한다"
      - "'등록'을 누른다"
      - 복용 목록의 비타민C 줄에서 '삭제'를 누른다
      - "'삭제할까요?' 창의 '삭제'를 누른다"
    expected: 등록할 때 "확인한 자료에서는 보고된 문제가 없어요. 걱정되면 약사에게 확인하세요"와 확인한 자료·확인 날짜가 보이고 "안전", "문제없어요", "먹어도 돼요"는 보이지 않는다. 삭제하면 "등록된 약·영양제가 목록에서 삭제되었습니다."가 보이고 비타민C가 사라지며, 레보티록신과 칼슘은 남아 있다
  - id: S4
    title: 갑상선약을 드시는 50~60대 부모님이 자녀가 사 드리려는 철분을, 가입·로그인 없이 '약·영양제 알아보기'에서 먼저 찾아 드시는 약과 맞는지 확인한다
    steps:
      - 첫 화면 위쪽 메뉴의 '약·영양제 알아보기'를 누른다
      - 검색창에 '철분'을 입력하고 '찾기'를 누른다
      - 결과 맨 위 '철분' 성분 항목을 눌러 펼친다
      - "'내 목록에 더하기'를 누른다"
    expected: 로그인하지 않아도 알아보기 화면이 열리고, '철분' 항목에 "주의 N건"이 보인다. 펼치면 "레보티록신(갑상선약) ↔ 철분", "시간을 띄워 드세요", "레보티록신과 최소 4시간 띄워 드세요"와 출처 링크 "Levothyroxine (MedlinePlus)"가 보이고, 화면 아래에 "이 화면은 처방이나 진단이 아니에요" 안내가 있다. '내 목록에 더하기'를 누르면 로그인 화면으로 가서 "로그인이 필요한 화면이에요." 안내가 보인다
  - id: S5
    title: 50~60대 부모님이 드시는 약·영양제 목록을 검진해, 점검 결과와 근거를 확인한다
    account: 복용자
    steps:
      - 홈에서 '검진하기'를 누른다
      - 리포트의 '레보티록신 ↔ 칼슘' 항목에서 '자세히'를 누른다
    expected: 리포트 맨 위에 "주의할 항목 1개"와 레보티록신과 칼슘 조합 경고가 "레보티록신과 최소 4시간 띄워 드세요" 안내, 약사에게 물을 질문, 약사 상담 안내와 함께 보이고, 아래에 레보티록신 1정과 칼슘 1000mg이 보인다. 상세 화면에 출처 "Absorption of Levothyroxine When Coadministered with Various Calcium Formulations"(논문, 건강한 성인 8명 연구)와 "Levothyroxine (MedlinePlus)"(공식 자료), DB 확인 날짜가 보이고, '출처 보기' 링크 주소가 https://pmc.ncbi.nlm.nih.gov/articles/PMC3092723/ 와 https://medlineplus.gov/druginfo/meds/a682461.html 이다
  - id: S6
    title: 50~60대 부모님이 검진 결과에서 비타민 추천을 받고, 드시는 약과 부딪히는 성분은 추천이 아닌 경고로 본다
    account: 복용자
    steps:
      - 홈에서 '검진하기'를 누른다
      - 리포트 맨 아래의 '영양제 추천받기'를 누른다
      - 설문의 '현재 겪는 증상'에서 '쉽게 피곤함'을 고른다
      - 설문의 '개선하고 싶은 점'에서 '피로 회복'을 고른다
      - "'추천 보기'를 누른다"
    expected: 설문은 '현재 겪는 증상'과 '개선하고 싶은 점' 두 가지만 묻고(성별·나이·키·몸무게는 묻지 않는다), '개선하고 싶은 점'은 2개까지만 고를 수 있다. '추천 보기'를 누르면 화면이 결과 맨 위로 올라가고, 추천 비타민이 최대 3개 보이고, 추천에 추천 이유와 효과 문장의 출처 링크가 보인다. '추천' 칸에는 철분처럼 레보티록신·칼슘과 부딪히는 성분이 없고, 그런 성분이 나오면 '주의' 칸에 경고와 출처 링크로 보인다. "이 추천은 진단이나 처방이 아니에요. 새로 드시기 전에 약사·의사와 상담하세요"가 보이고, 제품명·구매 링크는 보이지 않는다
  - id: S7
    title: 성분표를 읽기 어려운 50~60대 부모님이 약 상자를 사진으로 찍어 등록하려다, 흐린 사진은 다시 찍고 경고를 받는다
    account: 복용자
    steps:
      - 홈에서 '복용 목록'을 누른다
      - "'사진 등록' 칸의 '사진 올리기'로 흐린 알약 사진을 올린다"
      - "'다시 찍기'를 누른다"
      - 훼로바-유서방정 상자 사진을 올린다
      - 후보 목록에서 '훼로바-유서방정'이 골라져 있고 하루 1개인 것을 확인한다
      - "'고른 1개 모두 등록'을 누른다"
      - 경고 창의 '취소'를 누른다
    expected: 사진을 올리기 전에 '사진 등록' 칸에 "읽은 뒤 사진은 바로 지우고 저장하지 않아요" 안내가 보인다. 흐린 사진에는 "사진이 흐려서 읽지 못했어요. 다시 찍어 주세요"가 보인다. 상자 사진의 후보에는 사진 속 약인 훼로바-유서방정(건조황산제일철)만 골라진 채로 보이고, '모두 등록'을 누르면 "시간을 띄워 드세요"와 "레보티록신(갑상선약) ↔ 철분" 경고가 출처와 함께 보인다. '취소'하면 목록에 레보티록신과 칼슘만 있다
  - id: S8
    title: 뼈에 좋다는 칼슘을 많이 드시는 50~60대 부모님이 하루 기준량을 넘었는지 확인한다
    steps:
      - 첫 화면 위쪽의 '회원가입'을 누른다
      - 새 이메일, 8자 이상 비밀번호, 같은 비밀번호 확인을 입력하고 동의에 체크한다
      - "'가입하기'를 누른다"
      - 검색창에 '칼슘'을 입력하고 '검색'을 누른다
      - 검색 결과에서 '칼슘'을 고른다
      - "'하루에 먹는 개수'에 2를, '한 알 함량'에 1500mg을 입력한다"
      - "'등록'을 누른다"
      - 위쪽 메뉴의 '검진하기'를 누른다
    expected: 가입하면 바로 복용 목록 화면(등록 안내)으로 가고, 처음 등록할 때는 경고 창 없이 목록에 추가되며, 검진 리포트에 칼슘 과다 섭취 경고 "하루 기준량을 넘어요", 내 하루 칼슘 3000mg(2알 × 1500mg)과 출처의 하루 기준량 두 개(19~50세 2,500mg, 50세 초과 2,000mg), 출처 링크 https://medlineplus.gov/ency/article/002412.htm, 약사 상담 안내가 보인다
