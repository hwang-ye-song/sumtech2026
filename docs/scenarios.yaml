# 팀 늘크크 사용자 핵심 흐름 (데모: 개인 기준, 역할 이름 `데모`)
# 서비스 순서: 새로 가입 → 지금 먹는 약·영양제를 모두 넣고 '검진하기' → 사용 중 → 나중에 약·비타민을 추가하면 자동 검진.
# 약·영양제는 직접 검색하거나 사진으로 추가한다(S7). 사진 흐름의 입력 사진은 e2e/fixtures/에 커밋한다.
# 주최 측 실행은 흐름을 S1부터 같은 DB에서 차례로 돌린다. 앞 흐름이 더한 항목이 뒤 흐름에 섞이지 않도록
# `데모` 계정은 S2에서만 쓰고, 나머지 흐름은 회원가입부터 새 계정으로 한다.
# 시드: `데모` 계정은 첫 검진을 마친 '사용 중' 상태이고 목록에 비맥스제트정이 있다.
# 조합 규칙 시드(F5)에 비맥스제트정×칼슘, 레보티록신×칼슘(R3), 칼슘×철분이 있어야 한다.
# 버튼·메뉴 이름은 구현하면서 바뀌면 이 파일도 같은 commit에서 고친다.
platform: both
platformReason: |
  서비스는 웹사이트를 기준으로 만든다. 그런데 실제로는 약을 받아 오거나 영양제를 새로 살 때,
  그 자리에서 휴대폰으로 먹는 약 이름을 검색해 바로 목록에 추가할 것이라 휴대폰 화면에서도 똑같이 작동해야 한다.
  약 봉투·약 상자·영양제 통을 찍어 추가하는 사진 등록도 휴대폰 카메라로 쓰는 기능이다.
scenarios:
  - id: S1
    title: 처음 가입한 사람이 지금 먹는 갑상선약과 칼슘을 넣고 검진해 흡수 감소 경고를 받는다
    steps:
      - 첫 화면에서 '회원가입'을 누른다
      - 이메일과 비밀번호를 입력하고 '가입하기'를 누른다
      - 내 목록에서 '약·영양제 추가'를 누른다
      - 검색창에 '레보티록신'을 입력한다
      - 검색 결과에서 '레보티록신'의 '추가'를 누른다
      - "'약·영양제 추가'를 누른다"
      - 검색창에 '칼슘'을 입력한다
      - 검색 결과에서 '칼슘'의 '추가'를 누른다
      - 내 목록에서 '검진하기'를 누른다
    expected: 검진 결과에 레보티록신과 칼슘의 흡수 감소 경고, 논문(R3) 출처 링크, 약사에게 물을 질문이 보인다.
  - id: S2
    title: 사용 중인 사람이 비타민제를 먹다가 칼슘을 새로 추가하면 바로 식약처 원문 경고를 받는다
    account: 데모
    steps:
      - 내 목록에서 '약·영양제 추가'를 누른다
      - 검색창에 '칼슘'을 입력한다
      - 검색 결과에서 '칼슘'의 '추가'를 누른다
    expected: 검진하기를 누르지 않아도 경고가 뜨고, 비맥스제트정의 "칼슘염" "함께 복용하지 마십시오" 원문 문장, 식약처 e약은요 출처 링크, 약사에게 물을 질문이 보인다.
  - id: S3
    title: 칼슘을 먹던 사람이 나중에 철분을 추가하면 영양제끼리 겹치는 경고를 받는다
    steps:
      - 첫 화면에서 '회원가입'을 누른다
      - 이메일과 비밀번호를 입력하고 '가입하기'를 누른다
      - 내 목록에서 '약·영양제 추가'를 누른다
      - 검색창에 '칼슘'을 입력한다
      - 검색 결과에서 '칼슘'의 '추가'를 누른다
      - 내 목록에서 '검진하기'를 누른다
      - "'약·영양제 추가'를 누른다"
      - 검색창에 '철분'을 입력한다
      - 검색 결과에서 '철분'의 '추가'를 누른다
    expected: 철분을 추가하자마자 칼슘이 철분 흡수를 방해한다는 경고가 뜨고, 출처 링크와 약사에게 물을 질문이 보인다.
  - id: S4
    title: 기록 없는 조합을 검진하면 현재 기준으로 안전하다고 알려 주고 약사 확인을 권한다
    steps:
      - 첫 화면에서 '회원가입'을 누른다
      - 이메일과 비밀번호를 입력하고 '가입하기'를 누른다
      - 내 목록에서 '약·영양제 추가'를 누른다
      - 검색창에 '타이레놀'을 입력한다
      - 검색 결과에서 '타이레놀정500밀리그람(아세트아미노펜)'의 '추가'를 누른다
      - "'약·영양제 추가'를 누른다"
      - 검색창에 '오메가3'을 입력한다
      - 검색 결과에서 '오메가3'의 '추가'를 누른다
      - 내 목록에서 '검진하기'를 누른다
    expected: "\"현재 기준으로 안전해요. 약사에게도 확인하세요\"가 보이고, 경고 카드는 보이지 않는다."
  - id: S5
    title: 검진을 마친 사람이 약사에게 보여 줄 복용 리포트를 연다
    steps:
      - 첫 화면에서 '회원가입'을 누른다
      - 이메일과 비밀번호를 입력하고 '가입하기'를 누른다
      - 내 목록에서 '약·영양제 추가'를 누른다
      - 검색창에 '비맥스'를 입력한다
      - 검색 결과에서 '비맥스제트정'의 '추가'를 누른다
      - "'약·영양제 추가'를 누른다"
      - 검색창에 '칼슘'을 입력한다
      - 검색 결과에서 '칼슘'의 '추가'를 누른다
      - 내 목록에서 '검진하기'를 누른다
      - 검진 결과에서 '복용 리포트'를 누른다
    expected: 리포트 맨 위에 비맥스제트정과 칼슘 조합, 식약처 출처 링크, 약사에게 물을 질문이 보이고, 아래에 비맥스제트정과 칼슘이 모두 보인다.
  - id: S6
    title: 검진을 마친 사람이 간단한 설문에 답하고 지금 먹는 약과 겹치지 않는 비타민 추천을 받는다
    # 설문은 시안(PRD 6.2)이다. 보기가 바뀌면 이 단계 문구도 바꾼다.
    steps:
      - 첫 화면에서 '회원가입'을 누른다
      - 이메일과 비밀번호를 입력하고 '가입하기'를 누른다
      - 내 목록에서 '약·영양제 추가'를 누른다
      - 검색창에 '비맥스'를 입력한다
      - 검색 결과에서 '비맥스제트정'의 '추가'를 누른다
      - 내 목록에서 '검진하기'를 누른다
      - 검진 결과에서 '비타민 추천받기'를 누른다
      - 설문의 '좋아지고 싶은 부분'에서 '기타'를 고르고 '오후에 쉽게 지쳐요'를 입력한다
      - "'하루에 몇 알까지'에서 '2~3알'을 고른다"
      - "'추천받기'를 누른다"
    expected: AI 분석이 끝나면 추천 비타민마다 어디에 좋은지 식약처 기능성 문구와 출처 링크, "현재 기준으로 안전해요. 약사에게도 확인하세요"가 보이고, 비맥스제트정과 함께 먹지 말라는 칼슘은 추천 목록에 없다. 제품 이름이나 구매 링크는 없다.
  - id: S7
    title: 사진으로 약 상자를 찍어 올리면 그 약이 내 목록에 추가된다
    steps:
      - 첫 화면에서 '회원가입'을 누른다
      - 이메일과 비밀번호를 입력하고 '가입하기'를 누른다
      - 내 목록에서 '사진으로 추가'를 누른다
      - 비맥스제트정 상자 사진(e2e/fixtures/bemax-z.jpg)을 올린다
      - 인식 결과에서 '비맥스제트정'의 '추가'를 누른다
    expected: 내 목록에 비맥스제트정이 추가되어 보인다.
