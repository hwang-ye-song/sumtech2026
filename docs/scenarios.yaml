# 사용자 핵심 흐름(2026-10-29). 학생이 말한 흐름(로그인 → 사진·검색으로 등록 → 분석하기 보고서)에
# 팀 기획서의 흐름(추가할 때 점검, 근거 보기, 검색 실패 안내, 다시 로그인)을 합쳤습니다.
# 메뉴·버튼 이름은 시안이며, 화면을 만들면서 바뀌면 이 파일과 e2e spec을 함께 고칩니다.
# 시드: 복용자 계정 목록에는 레보티록신(하루 1정)과 칼슘(하루 1000mg)이 들어 있다.
# 주최 측 실행은 S1부터 같은 DB에서 차례로 돈다. 그래서
#   - 복용자 계정을 쓰는 흐름은 목록을 바꾸지 않고 끝나거나(취소), 바꾼 것을 흐름 안에서 되돌린다(S8).
#   - 목록을 바꾸는 흐름은 새로 가입해서 한다(S1, S2, S5). 이메일은 실행마다 다르게 만든다.
# 사진 등록(S2)에 올릴 사진은 e2e/fixtures/levothyroxine.jpg로 커밋한다.
platform: mobile
platformReason: |
  복용자는 약국에서 약을 새로 받았을 때나 마트·쇼핑 앱에서 영양제를 사려 할 때, 그 자리에서 같이 먹어도 되는지
  확인해야 한다. 이때 손에 있는 건 휴대폰이고, 약 봉투나 영양제 성분표를 휴대폰 카메라로 찍어 바로 등록한다.
  집에서 목록을 다시 볼 때도 매일 아침 약을 챙기며 휴대폰으로 연다.
scenarios:
  - id: S1
    title: 처음 온 사람이 서비스 소개를 보고 회원가입한다
    steps:
      - 첫 화면에서 서비스 소개와 '처방이나 진단을 하지 않아요' 안내를 확인한다
      - 첫 화면의 '회원가입'을 누른다
      - 이메일 칸에 새 이메일을 입력한다
      - 비밀번호 칸에 8자 이상 비밀번호를 입력한다
      - 비밀번호 확인 칸에 같은 비밀번호를 입력한다
      - "'가입하기'를 누른다"
    expected: 가입한 뒤 홈 화면에 '복용 목록'과 '분석하기' 두 칸이 보이고, "먹고 있는 약이나 영양제를 추가해 보세요"가 보인다
  - id: S2
    title: 새로 가입한 복용자가 갑상선약 사진을 찍어 복용 목록에 등록한다
    steps:
      - 첫 화면의 '회원가입'을 누른다
      - 새 이메일, 8자 이상 비밀번호, 같은 비밀번호 확인을 입력한다
      - "'가입하기'를 누른다"
      - 홈에서 '복용 목록'을 누른다
      - "'사진으로 등록'을 누른다"
      - 갑상선약 사진을 올린다
      - 후보 목록에서 '레보티록신'을 고른다
      - "'하루 복용량'에 1정을 입력한다"
      - "'등록'을 누른다"
    expected: '"확인한 자료에서는 보고된 문제가 없어요. 걱정되면 약사에게 확인하세요"가 보이고, 복용 목록의 약 칸에 레보티록신과 하루 복용량 1정이 보인다'
  - id: S3
    title: 복용자가 철분 영양제를 추가하려 하면 경고를 받고, 다시 해도 같은 경고를 받는다
    account: 복용자
    steps:
      - 홈에서 '복용 목록'을 누른다
      - "'검색으로 등록'을 누른다"
      - 검색창에 '철분'을 입력하고 '검색'을 누른다
      - 검색 결과에서 '철분'을 고른다
      - "'하루 복용량'에 20mg을 입력한다"
      - "'등록'을 누른다"
      - 경고 창의 '취소'를 누른다
      - "'등록'을 다시 누른다"
      - 경고 창의 '취소'를 누른다
      - 아래 탭의 '복용 목록'을 누른다
    expected: 두 번 모두 같은 경고 창 맨 위에 "시간을 띄워 드세요"와 "레보티록신과 최소 4시간 띄워 드세요"가 보이고, 그 아래 "레보티록신(갑상선약) ↔ 철분", 출처 제목 "Levothyroxine (MedlinePlus)", "복용을 바꾸기 전에 약사·의사와 상담하세요", '자세히'·'그래도 추가'·'취소'가 보인다. 복용 목록에는 철분이 없고 레보티록신과 칼슘만 있다
  - id: S4
    title: 복용자가 갑상선약과 칼슘을 함께 먹을 때의 위험을 보고서로 보고 근거를 확인한다
    account: 복용자
    steps:
      - 홈에서 '분석하기'를 누른다
      - "'분석 시작'을 누른다"
      - 보고서의 '레보티록신 ↔ 칼슘' 항목에서 '자세히'를 누른다
    expected: 보고서에 "주의할 항목 1개"와 레보티록신과 칼슘 조합 경고가 "레보티록신과 최소 4시간 띄워 드세요" 안내를 맨 위에 두고 약사 상담 안내와 함께 보인다. 상세 화면에 출처 "Absorption of Levothyroxine When Coadministered with Various Calcium Formulations"(논문, 건강한 성인 8명 연구)와 "Levothyroxine (MedlinePlus)"(공식 자료), DB 확인 날짜가 보이고, '출처 보기' 링크 주소가 https://pmc.ncbi.nlm.nih.gov/articles/PMC3092723/ 와 https://medlineplus.gov/druginfo/meds/a682461.html 이다
  - id: S5
    title: 새로 가입한 복용자가 칼슘을 하루 기준보다 많이 먹고 있는지 확인한다
    steps:
      - 첫 화면의 '회원가입'을 누른다
      - 새 이메일, 8자 이상 비밀번호, 같은 비밀번호 확인을 입력한다
      - "'가입하기'를 누른다"
      - 홈에서 '복용 목록'을 누른다
      - "'검색으로 등록'을 누른다"
      - 검색창에 '칼슘'을 입력하고 '검색'을 누른다
      - 검색 결과에서 '칼슘'을 고른다
      - "'하루 복용량'에 3000mg을 입력한다"
      - "'등록'을 누른다"
      - 경고 창의 '그래도 추가'를 누른다
      - 아래 탭의 '분석하기'를 누른다
      - "'분석 시작'을 누른다"
    expected: 보고서에 칼슘 과다 섭취 경고 "하루 기준량을 넘어요", 내 하루 복용량 3000mg과 하루 기준량 2,500mg, 출처 링크 https://medlineplus.gov/ency/article/002412.htm, 약사 상담 안내가 보인다
  - id: S6
    title: 성분 이름을 잘 모르는 복용자가 흔히 부르는 이름이나 성분 이름으로 약·영양제를 찾는다
    account: 복용자
    steps:
      - 홈에서 '복용 목록'을 누른다
      - "'검색으로 등록'을 누른다"
      - 검색창에 '갑상선약'을 입력하고 '검색'을 누른다
      - 검색창을 지우고 '칼'을 입력한 뒤 '검색'을 누른다
      - 검색창을 지우고 '선물받은프리미엄본케어골드'를 입력한 뒤 '검색'을 누른다
      - 검색창을 지우고 '칼슘'을 입력한 뒤 '검색'을 누른다
    expected: "'갑상선약'에는 레보티록신이 종류 '약', 쉬운 이름 '갑상선약'과 함께 보인다. '칼'에는 \"2글자 이상 입력해 주세요\", 없는 제품명에는 \"찾는 제품이 없어요. 성분 이름(예 칼슘)으로 검색해 보세요\"가 보이고, '칼슘'에는 칼슘 항목이 종류 '영양제', 주요 성분과 함께 보인다"
  - id: S7
    title: 복용자가 다시 로그인하면 목록이 그대로 있고, 로그아웃하면 목록을 볼 수 없다
    steps:
      - 첫 화면의 '로그인'을 누른다
      - 시드 복용자 이메일과 틀린 비밀번호를 입력하고 '로그인'을 누른다
      - 비밀번호 칸을 지우고 시드 복용자 비밀번호를 입력한 뒤 '로그인'을 누른다
      - 홈에서 '복용 목록'을 누른다
      - 화면 위쪽의 '로그아웃'을 누른다
    expected: 틀린 비밀번호에는 "이메일 또는 비밀번호가 맞지 않아요"가 보이고 로그인되지 않는다. 맞는 비밀번호로 로그인하면 복용 목록에 레보티록신 1정과 칼슘 1000mg이 그대로 있다. 로그아웃하면 첫 화면의 '회원가입'·'로그인' 버튼이 보인다
  - id: S8
    title: 기록 없는 영양제는 안전하다고 단정하지 않고, 잘못 등록한 것은 지울 수 있다
    account: 복용자
    steps:
      - 홈에서 '복용 목록'을 누른다
      - "'검색으로 등록'을 누른다"
      - 검색창에 '비타민C'를 입력하고 '검색'을 누른다
      - 검색 결과에서 '비타민C'를 고른다
      - "'하루 복용량'에 500mg을 입력한다"
      - "'등록'을 누른다"
      - 복용 목록의 비타민C 줄에서 '삭제'를 누른다
      - "'삭제할까요?' 창의 '삭제'를 누른다"
    expected: 등록할 때 "확인한 자료에서는 보고된 문제가 없어요. 걱정되면 약사에게 확인하세요"가 보이고 "안전", "문제없어요", "먹어도 돼요"는 보이지 않는다. 삭제하면 "등록된 약,영양제가 목록에서 삭제되었습니다."가 보이고 비타민C가 사라지며, 레보티록신과 칼슘은 남아 있다
