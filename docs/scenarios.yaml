# 사용자 핵심 흐름 초안(2026-10-29). 학생이 말한 흐름(로그인 → 사진·검색으로 등록 → 분석하기 보고서)을 옮겼습니다.
# 메뉴·버튼 이름은 시안이며, 화면을 만들면서 바뀌면 이 파일과 e2e spec을 함께 고칩니다.
# 시드: 복용자 계정에는 갑상선약(레보티록신)과 칼슘이 미리 등록되어 있다(S5용).
# 각 흐름은 시드 데이터만으로 성립하도록, 필요한 등록은 흐름 안에서 직접 한다.
platform: mobile
platformReason: |
  복용자는 먹고 있는 약과 영양제를 사진으로 찍어 등록하기 때문에, 카메라가 있는 휴대폰으로 쓴다.
scenarios:
  - id: S1
    title: 처음 온 사람이 서비스 소개를 보고 회원가입한다
    steps:
      - 첫 화면에서 서비스 소개 문구를 확인한다
      - 첫 화면의 '회원가입'을 누른다
      - 이메일과 비밀번호를 입력한다
      - "'가입하기'를 누른다"
    expected: 가입한 뒤 홈 화면에 '복용 목록'과 '분석하기' 두 칸이 보인다
  - id: S2
    title: 복용자가 갑상선약 사진을 찍어 복용 목록에 등록한다
    account: 복용자
    steps:
      - 홈에서 '복용 목록'을 누른다
      - "'사진으로 등록'을 누른다"
      - 갑상선약 사진을 올린다
      - 후보 목록에서 '레보티록신'을 고른다
      - "'하루 복용량'에 1정을 입력한다"
      - "'등록'을 누른다"
    expected: 복용 목록에 레보티록신과 하루 복용량 1정이 보인다
  - id: S3
    title: 복용자가 이름으로 검색해 철분 영양제를 등록한다
    account: 복용자
    steps:
      - 홈에서 '복용 목록'을 누른다
      - "'검색으로 등록'을 누른다"
      - 검색창에 '철분'을 입력한다
      - 검색 결과에서 '철분'을 고른다
      - "'하루 복용량'에 20mg을 입력한다"
      - "'등록'을 누른다"
    expected: 복용 목록에 철분과 하루 복용량 20mg이 보인다
  - id: S4
    title: 복용자가 잘못 등록한 영양제를 목록에서 삭제한다
    account: 복용자
    steps:
      - 홈에서 '복용 목록'을 누른다
      - "'검색으로 등록'을 누른다"
      - 검색창에 '비타민C'를 입력하고 결과에서 '비타민C'를 고른다
      - "'하루 복용량'에 500mg을 입력하고 '등록'을 누른다"
      - 목록의 비타민C 줄에서 '삭제'를 누른다
    expected: '"등록된 약,영양제가 목록에서 삭제되었습니다."가 보이고, 복용 목록에서 비타민C가 사라진다'
  - id: S5
    title: 복용자가 갑상선약과 칼슘을 함께 먹을 때의 위험을 확인한다
    account: 복용자
    steps:
      - 홈에서 '분석하기'를 누른다
      - "'분석 시작'을 누른다"
    expected: 보고서에 갑상선약과 칼슘 조합 경고, 최소 4시간 띄워 먹으라는 안내, 출처 링크, 약사 상담 안내가 보인다
  - id: S6
    title: 복용자가 칼슘을 하루 기준보다 많이 먹고 있는지 확인한다
    account: 복용자
    steps:
      - 홈에서 '복용 목록'을 누른다
      - "'검색으로 등록'을 누른다"
      - 검색창에 '칼슘'을 입력하고 결과에서 '칼슘'을 고른다
      - "'하루 복용량'에 3000mg을 입력하고 '등록'을 누른다"
      - 홈으로 돌아가 '분석하기'를 누른다
      - "'분석 시작'을 누른다"
    expected: 보고서에 칼슘 과다 섭취 경고, 하루 기준량 2,500mg, 출처 링크가 보인다
  - id: S7
    title: 자료에 없는 조합은 안전하다고 단정하지 않는다
    steps:
      - 첫 화면의 '회원가입'을 누르고 새 이메일과 비밀번호로 가입한다
      - 홈에서 '복용 목록'을 누른다
      - "'검색으로 등록'을 누르고 '비타민C'를 검색해 고른다"
      - "'하루 복용량'에 500mg을 입력하고 '등록'을 누른다"
      - 홈으로 돌아가 '분석하기'를 누르고 '분석 시작'을 누른다
    expected: 보고서에 "확인한 자료에서는 보고된 문제가 없어요. 약사에게 확인하세요"가 보이고, "안전"이라는 단정은 보이지 않는다
