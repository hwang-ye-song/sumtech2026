# 팀 늘크크의 문제정의다. 종이 캔버스(2026-10-29)에서 시작해 지금 앱(TwoPills) 기준으로 다시 썼다.
# 괄호 안 번호는 근거다. E는 경험, R은 자료, P는 페르소나, F는 기능이다.

statement: |-
  약을 매일 드시는 50~60대 부모님은 아침 식사 뒤 병원 약과 영양제를 한꺼번에 드신다.
  약은 병원에서, 영양제는 자녀 선물이나 지인 추천으로 따로 들어오는데, 둘을 같이 봐 주는 곳이 없어서 괜찮은지 모른 채 매일 그대로 드신다.
  지금은 유튜브·AI에 묻거나 자녀가 약국에 가서 물어보지만, 답의 근거를 알 수 없고 약이나 영양제가 바뀔 때마다 다시 물어야 한다.

canvas:
  context: |-
    아침 식사 뒤 약과 영양제를 한꺼번에 드실 때다. 매일 반복된다.
    어머니는 병원 약과 종합비타민·칼슘을, 아버지는 알레르기약과 비타민B·마그네슘·유산균을 밥 먹고 같이 드신다. 약과 영양제는 요일별 약통에 함께 담겨 있다(E2, E18, E20).
    조합은 어느 날 바뀐다. 새 약을 처방받으시거나, 지인 말을 듣고 영양제를 더하시거나, 자녀가 칼슘·종합비타민을 사 드린다. 그래도 전에 드시던 건 그대로 드신다(E21, E22, E23, E25).
    한 번 잘못 섞이면 알아챌 때까지 매일 그대로 드시게 된다.
  customer: |-
    대표 고객은 약을 매일 드시는 50~60대 부모님이다(P3).
    혈압·갑상선·알레르기 약을 꾸준히 드시면서, 직접 사거나 자녀가 사 드린 영양제를 같이 드신다. 영양제는 약이 아니라고 생각하시고, 드시는 제품 이름을 기억 못 하실 때도 있다(E2, E15, E19, E20).
    같은 문제를 겪는 사람:
    - 영양제를 사 드리는 30~40대 자녀(P2). 부모님 약을 모른 채 사 드리고, 후기와 가격은 비교해도 약과 맞는지는 찾아보지 않는다. 사 드린 뒤에야 걱정한다(E4, E17, E24).
    - 영양제를 먹다가 약이 생기는 20~30대(P1). AI에게 묻고 그냥 먹고, 잊지 않으려고 철분과 칼슘을 아침에 한꺼번에 먹기도 한다. 영양제를 고를 기준도 없다(E1, E16, E31, E26, E27, E28, E29).
  root_problem: |-
    부모님의 약과 영양제를 한곳에 모아 맞춰 볼 곳이 없다.
    약은 병원에서 받고, 영양제는 자녀·지인·직구로 따로 들어온다. 병원과 약국은 먹는 약만 묻고, 부모님도 영양제는 말하지 않으신다(E15, E19, E21, R2, R4, R8).
    약끼리는 DUR이 걸러 주지만 영양제는 대상이 아니다(R5). 같이 먹지 말라는 말은 약 설명서에 '칼슘염' 같은 성분 이름으로만 있어서, 드시는 제품이 해당하는지 직접 맞춰 봐야 한다(E3, R7). 영양제끼리 같은 성분이 겹쳐도 이름이 달라 모른다(E30, E33, E35).
    그래서 약이나 영양제가 하나 바뀔 때마다 처음부터 다시 확인해야 하고, 결국 확인 없이 드신다.
  impact:
    feeling: |-
      괜찮은지 몰라서 찜찜하다. 어머니는 “이게 다 뭘까…” 하시고, 드시는 영양제 이름을 물으면 “뭐더라…그….” 하신다(E15, E20).
      아버지는 “아잇! 이게 무슨 약이야..! 상관없다니까” 하고 넘기신다(E19).
      사 드린 자녀는 부모님이 잘못 드셔서 더 안 좋아지실까 봐 걱정한다(E17). AI에게 물어도 답이 애매해서 마음이 놓이지 않는다(E1).
    measurable: |-
      - 영양제를 먹는 사람은 86.1%, 효능·부작용까지 다 안다는 사람은 15.3%다(R1, 944명 설문).
      - 일본에서 약과 영양제를 같이 먹는 환자 1,508명 중 70.3%가 의사·약사에게 말하지 않았다(R2).
      - 처방약을 먹는 국내 만성질환자 146명 중 약 72%가 영양제를 약국 밖에서 샀다(R4).
      - 갑상선약(레보티록신)을 칼슘제와 같이 먹으면 흡수가 약 20~25% 줄었다(R3, 건강한 성인 8명).
      - 칼슘 300~600mg은 철분 흡수를 약 50~60% 줄였다(R10, 126명).
      - 미국 국립의학도서관은 칼슘제·철분제를 레보티록신과 최소 4시간 띄우라고 한다(R12).
      - 칼슘은 음식과 보충제를 합해 50세가 넘으면 하루 2,000mg까지로 본다(R13).
      - 자주 쓰는 일반의약품 원문 36개 중 12개에 영양제 성분과 같이 먹지 말라는 문구가, 1개에 약사와 상의하라는 문구가 있었다(R22, 편의 표본).
      - 건강기능식품 이상사례 신고는 2022년 1,115건에서 2025년 3,547건으로 늘었다(R19). 약과 같이 먹은 경우만 센 숫자는 아니다.
      우리가 들은 사례에서 실제로 몸이 나빠졌는지는 확인하지 못했다.
      잃는 것(위 사례와 자료에서 끌어낸 것이다. 얼마나 큰지는 아직 재지 못했다):
      - 시간: 사 드린 뒤 걱정이 된 자녀는 약국까지 직접 가서 물었다(E17). 약이나 영양제가 바뀔 때마다 이 일을 다시 해야 할 수 있다(E21, E25).
      - 돈: 칼슘제와 같이 먹으면 갑상선약 흡수가 약 20~25% 줄고(R3), 칼슘은 철분 흡수를 약 50~60% 줄였다(R10). 돈을 내고 산 약과 영양제가 기대만큼 듣지 않을 수 있다. 이미 드시는 종합비타민을 하나 더 사 드리기도 했다(E23).
      - 기회: 병원에서 영양제를 말하지 않으니(R2, E19) 전문가가 조합을 봐 줄 기회를 놓친다. 약국에 가도 바쁘면 다 묻지 못한다(E6).
  alternatives:
    - how_used: 유튜브·블로그·SNS를 찾아본다(E15, E16).
      shortcoming: 광고와 비전문가 의견이 섞여 있다. 영상은 내가 먹는 약을 모른다(E1, E16).
      why_ours: |-
        '영상은 내 약을 모른다'는 단점을 없앤다. 내 목록(F2)에 든 약과 바로 맞춰 보고(F3), 경고마다 식약처 원문과 논문 출처를 붙인다(F4, R7, R3).
        광고 대신 출처 있는 DB 안에서만 영양제를 고르고, 내 약과 부딪히는 성분은 경고로 돌린다(F5, E16).
    - how_used: 생성형 AI나 상담 앱의 AI에게 먹는 약과 영양제를 적고 묻는다(E1, E16).
      shortcoming: |-
        답이 애매해서 찜찜한 채로 먹는다(E1). 설명서 문구를 확인하지 못한 채 답하기도 한다(E3). 물을 때마다 다시 적어야 한다.
        우리가 열어 본 공개 질문 12건 중 9건은 의사·약사가 아니라 AI가 답했다(E3, E4, E6, E7, E8, E9, E10, E13, E14).
      why_ours: |-
        '답이 애매하고, 물을 때마다 다시 적어야 한다'는 단점을 없앤다.
        판정은 AI가 아니라 사람이 원문을 확인한 DB로 한다. 같은 조합엔 늘 같은 답과 같은 출처가 나온다(F3, E1, E3). 자료에 없는 조합도 괜찮다고 단정하지 않는다(F3).
        한 번 등록하면 다시 적지 않고, 더할 때마다 목록 전체와 알아서 맞춰 본다(F2, F3).
    - how_used: 약국에 가서 약사에게 묻는다(E17).
      shortcoming: |-
        매번 가기 번거롭다. 부모님은 제품 이름을 기억 못 하시고(E20), 약국이 바쁘면 다 봐 주지 못한다(E6).
        약사·전문의가 답한 공개 질문도 있었지만, 그때그때 묻는 방식이다(E5, E11, E12).
      why_ours: |-
        '매번 가야 하고, 가서도 이름을 몰라 다 묻지 못한다'는 단점을 줄인다(E17, E20, E6).
        집에서는 더할 때마다 점검된다(F3). 약국에 갈 땐 먹는 것 전체, 주의할 조합, 약사에게 물을 질문이 정리된 검진 리포트를 보여 주면 된다(F4).
        약사 상담용 문진에도 지금 먹는 보충제가 들어간다(R21). 약사 상담을 대신하지 않고, 상담 때 쓸 목록을 만든다(R20).
    - how_used: 약 설명서나 식약처 e약은요를 직접 찾아본다(R7).
      shortcoming: 성분 이름으로만 적혀 있어 일일이 맞춰 봐야 한다(E3). e약은요에는 처방약이 없다(R6).
      why_ours: |-
        '성분 이름을 내 제품과 일일이 맞춰 봐야 한다'는 단점을 없앤다.
        제품 이름이나 '갑상선약' 같은 말로 등록하면(F2), 제품에 든 성분까지 풀어서 '칼슘염' 같은 경고 문구와 목록 전체를 맞춰 본다(F3, R7, E3). e약은요에 없는 처방약도 같은 방법으로 등록한다(F2, R6).
    - how_used: 심평원 '내가 먹는 약 한눈에'에서 최근 1년 처방 이력을 본다(R17).
      shortcoming: 처방받은 약만 나온다. 약국 밖에서 산 영양제(R4)와 맞춰 보지 않는다. 자녀는 부모님 인증 없이는 볼 수 없다.
      why_ours: |-
        '처방약만 보이고 영양제와 맞춰 보지 않는다'는 단점을 메운다.
        거기서 본 약 이름을 그대로 검색해 넣고(F2), 약국 밖에서 산 영양제(R4)를 더하면 함께 점검된다(F3). 부모님 약을 모르는 자녀도 이름만 받아 자기 목록에 넣어 볼 수 있다(F2, E17, E22).
    - how_used: 필라이즈 같은 영양제 앱에 등록한다(R9).
      shortcoming: 무슨 자료로 판단했는지 앱 소개에 나오지 않는다(R9).
      why_ours: |-
        '무슨 자료로 판단했는지 모른다'는 단점을 없앤다(R9).
        경고마다 원문 문장, 출처 링크, DB 확인 날짜를 붙여 사용자와 약사가 직접 확인할 수 있다(F3, F4). 로그인 없이도 성분별 주의 조합과 출처를 먼저 볼 수 있다(F6).

personas:
  - id: P1
    description: |-
      영양제를 챙겨 먹는 20~30대 직장인·대학생.
      비타민B·마그네슘·오메가3를 먹다가 감기약이나 처방약이 생긴다. AI에게 묻지만 확신이 없다. 약국은 번거로워서 그냥 먹는다.
      영양제를 고를 때도 기준이 없어 광고나 친구를 따른다.
    source: E1(팀원 본인), E3(닥터나우 공개 질문), E12(하이닥 공개 질문, 31세), E16(20대 팀원 인터뷰), E26~E29(팀원 경험)
  - id: P2
    description: |-
      부모님께 영양제를 사 드리는 30~40대 자녀.
      유튜브를 보고 사 드리지만 부모님 약은 모른다. 사 드린 뒤에야 걱정돼서 약국에 묻는다.
    source: E17(30대 자녀 인터뷰), E4(닥터나우 공개 질문), E22·E23·E24(팀원 경험)
  - id: P3
    description: |-
      약을 매일 드시는 50~60대 부모님.
      혈압·갑상선·알레르기 약과 영양제를 밥 먹고 한꺼번에 드신다. 성분표를 봐도 약과 맞는지 모른다. 제품 이름을 기억 못 하시기도 한다.
    source: E2(팀원 아버지), E15(팀원 어머니 인터뷰), E18·E19·E20·E21·E25(팀원 가족)

# E1·E2·E15~E35는 팀원 본인·가족·직접 인터뷰한 사람의 경험이다(기록 동의 받음, 2026-10-29 팀원 확인).
# E3~E14는 공개 Q&A에서 직접 열어 본 다른 사람의 질문 글이다. 인용은 원문 그대로다.
experiences:
  - id: E1
    when: 2026년 여름 시작할 때
    what_happened: 팀원이 감기약을 먹으면서 비타민B군과 마그네슘도 함께 먹었다. 같이 먹어도 되는지 궁금해 생성형 AI에게 물었고, AI는 시간을 좀 띄워서 먹으면 문제없을 것 같다고 답했다. 영양제는 유튜브 추천을 보고 샀는데, 영상은 약과 같이 먹어도 되는지는 알려 주지 않았다.
    workaround: AI 답을 믿고 시간을 좀 띄워서 그냥 먹었다.
    feeling: 괜찮은지 몰라서 찜찜했다.
    quote: “감기약이랑 비타민B이랑 마그네슘 같이 먹어도 돼?”
    source: 팀원 본인 경험(2026-10-29 인터뷰)
  - id: E2
    when: 2026년
    what_happened: 팀원의 아버지가 알레르기약과 비타민B군·마그네슘·유산균을 매번 밥 먹고 한꺼번에 다 드신다. 팀원이 다 같이 한 번에 먹어도 되냐고 물었지만, 아버지도 팀원도 확인해 보지 않았다.
    workaround: 확인하지 않고 그대로 드신다.
    feeling: 모름
    quote: 머 괜찮지 않을까?
    source: 팀원 가족(아버지) 경험, 팀원이 직접 보고 들음(2026-10-29 인터뷰)
  - id: E3
    when: 2026-10-07
    what_happened: 직장인이 포텐비정·오메가3(EPA·DHA 900mg)·칼슘·마그네슘·비타민K2&D 제품을 하루 한 알씩 함께 먹으려다, 포텐비정 주의사항의 칼슘염 병용 금지 문구와 세 제품의 비타민D 총량을 짚으며 같이 먹어도 되는지 물었다.
    workaround: 닥터나우 Q&A에 질문했고 닥터나우 AI의 참고용 답변을 받았다. 답변은 그 문구를 허가사항에서 확인하지 못했다며 첨부문서를 다시 보고 약사와 상담하라고 했다.
    feeling: 의아함
    quote: 포텐비정과 칼슘·오메가3 제품 동시 복용 가능할까요?
    source: https://doctornow.co.kr/content/qna/417f698127734632bb49611f15bc3bdc
  - id: E4
