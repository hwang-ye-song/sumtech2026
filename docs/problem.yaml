five_whys:
  symptom: 30대 자녀가 영양제면 다 괜찮은 줄 알고 부모님 약을 모른 채 비타민을 사 드렸고, 사 드린 뒤에야 "이거 근데 같이 먹어도 되나?" 걱정이 되어 약국까지 갔다(E17). 설명서의 칼슘염 병용 금지 문구를 본 사람도 같이 먹어도 되는지 판단하지 못했다(E3).
  whys:
    - 왜 확인 없이 사 드렸나? "영양제면 다 괜찮은 줄 알았다"(E17). 약과 영양제를 함께 먹는 환자 다수도 같이 먹어도 안전하다고 여긴다(R2).
    - 왜 영양제는 괜찮다고 여기나? 병원·약국은 약만 묻고 영양제는 묻지 않아(E15), 영양제를 약과 함께 확인해야 한다는 말을 들을 기회가 없다.
    - 왜 사기 전에 확인하지 못했나? 자녀는 부모님이 무슨 약을 드시는지 모르고(E17), 영양제는 대부분 약국 밖에서 사서 살 때 옆에 약사가 없다(R4). 유튜브 영상도 내 약과의 조합은 알려 주지 않는다(E1).
    - 왜 확인하려 해도 어렵나? 경고는 약 설명서에 "칼슘염" 같은 성분 이름으로만 적혀 있어 경고를 직접 본 사람도 판단하지 못했고(R7, E3), 처방 점검(DUR)은 약끼리만 본다(R5, R8).
    - 그래서 약과 영양제를 함께 확인해 주는 사람도 도구도 없고, 자녀는 사 드린 뒤에야 걱정하며 약국까지 찾아간다(E17).
solution_paths:
  - path: |-
      식약처 원문(R6, R7)과 논문·공식 자료(R3, R10, R12, R13)에서 '약×영양제' 위험 조합과 하루 기준량을 뽑아, 원문 문장과 대조해 확인된 것만 출처와 함께 DB에 넣는다. 이 DB를 'AI 위키'라고 부르지만, AI가 만든 것이 아니라 사람이 원문을 확인해 넣은 조합 DB다.
      사용자가 먹는 약(약 봉투·약 상자에 적힌 제품명, 성분 이름, 흔히 부르는 이름)과 영양제를 하루에 먹는 개수와 함께 한 목록에 등록하면, '검진하기'로 한 번에 점검하고, 그 뒤 더하는 순간마다 서로 맞춰 보고 원문 인용·해야 할 행동·약사에게 물을 질문을 함께 보여 준다.
      '검진하기'에서 목록 전체의 해로운 조합과 과다 섭취를 약사·의사에게 보여 줄 복용 리포트로 정리한다. 목록을 처음 채우는 길: 부모님은 약 봉투·약 상자에 적힌 이름을 그대로 검색하고, 기억나지 않으면 심평원 '내가 먹는 약 한눈에'에서 최근 1년 처방 약 이름을 보고 옮긴다(R17). 부모님 약을 모르는 자녀는 부모님께 약 봉투 사진이나 그 화면을 카톡으로 받아 그 이름으로 자기 목록에 넣고, 사 드릴 영양제를 더해 사기 전에 점검한다.
    status: chosen
    reason: 부모님께 영양제를 고르려는 자녀가 → 부모님 약 봉투 사진이나 심평원 처방 이력으로 부모님 약을 등록하고(F8·F3, R17) → '검진하기'로 주의할 조합을 확인하고(F5) → 부모님 약과 부딪히지 않는 비타민을 추천받고(F9) → 리포트를 부모님·약사에게 보여 드린다(F5). 들어오는 이유(무엇을 사 드릴지 고르기)와 문제 해결(묻지 않아도 뜨는 경고)이 한 흐름 안에서 이어진다. 판정은 원문을 확인한 DB로만 하므로 같은 조합에는 같은 결과가 나온다(F4·F6·F7).
  - path: 영양제끼리 부딪치는 조합도 점검한다. 칼슘과 철분처럼 출처가 있는 조합만 DB에 넣는다.
    status: chosen
    reason: 영양제는 다 좋다는 믿음 때문에 생기는 문제는 영양제끼리 먹을 때도 같다. 칼슘은 철분 흡수를 막는다는 연구(R10)와 전문의 발언(R11)이 있다. 영양제 쪽 공식 자료도 있다. 식품안전나라는 '건강기능식품 섭취 주의사항'에서 중복 섭취와 의약품 병용 섭취 정보를 제공한다(R16, R18). 그래서 이 고시 문장과 논문(R10)을 함께 쓰고, 원문 문장과 URL을 확인한 조합만 넣는다.
  - path: 같은 성분의 하루 복용량 합계가 출처에 있는 하루 기준량을 넘으면 과다 섭취로 경고한다.
    status: chosen
    reason: 여러 영양제에 같은 성분이 겹치면(E3의 비타민D 총량, E5의 성분이 겹치는 비타민) 모른 채 기준을 넘길 수 있다. 칼슘은 하루 기준량(R13), 철분은 과다 복용의 해로움(R14)이 공식 자료에 있다. 기준량 숫자가 출처에 있는 성분만 판정한다. 성분표를 읽기 어려운 부모님(P3)도 쓸 수 있게, 사용자는 하루에 먹는 개수(정·알)만 넣고 mg은 넣지 않아도 된다. 의약품은 데이터(drug_ingredient.csv)에 있는 한 알당 함량으로 계산하고, 영양제는 사용자가 함량을 넣었을 때만 과다 섭취를 판정하며 넣지 않으면 "함량을 넣으면 하루 기준량도 확인해 드려요"라고 안내한다.
  - path: 범용 생성형 AI 챗봇이 DB 없이 그때그때 조합을 판정한다.
    status: rejected
    reason: 만들기는 가장 쉽지만 생성형 AI 대안의 문제(틀린 정보를 사실처럼 말함, 애매한 답, E1·E3)를 그대로 반복한다. 그래서 조합 판정은 사람이 출처를 확인한 DB로만 하고, AI는 사진의 글자 읽기(F8)와 DB 안에서 추천 후보 고르기(F9)에만 쓴다.
  - path: 두 개를 골라 비교하는 조합 계산기(목록 저장 없음).
    status: rejected
    reason: 한 쌍씩만 확인되고 목록을 기억하지 못해 영양제를 8~9개 먹는 사람(E8, E10)은 모든 짝을 직접 입력해야 하고, 새로 더하는 순간에 먼저 알려 주지 못한다. 목록 등록과 더할 때 점검이 이를 포함한다.
  - path: 약과 약 사이의 병용 금기까지 다룬다.
    status: rejected
    reason: 약끼리 조합은 처방 단계 DUR이 이미 점검하고(R5) 잘못 안내하면 위험이 크다. 아무도 점검하지 않는 약+영양제 조합에만 집중한다.
  - path: |-
      참여 코드로 들어오는 가족 그룹. 자녀와 부모님이 같은 복용 목록을 함께 보고, 누가 더해도 같은 점검과 경고를 받는다.
      구현 방법: (1) 저장할 정보 — family_group(id, 이름, 6자리 숫자 참여 코드·중복 없음·다시 발급 가능, 만든 사람), group_member(group_id, user_id, 역할 만든 사람/멤버), 복용 목록 항목은 user_id 대신 group_id에 묶는다. (2) 가입할 때 내 이름의 그룹을 자동으로 만들고 지금 내 목록을 그 그룹으로 옮긴다. (3) 복용 목록 화면 위쪽 '가족 그룹'에서 '참여 코드 보기'·'코드로 들어가기'를 두고, 맞는 코드면 group_member에 추가, 틀리면 "없는 코드예요". (4) 권한은 그 그룹 멤버만 목록을 읽고 바꿀 수 있게 한다(Supabase RLS: group_member에 auth.uid()가 있을 때만). (5) 여러 그룹에 속하면 목록 화면에서 그룹을 고르고, 로그인하면 처음에는 자기 그룹이 보인다. 더할 때 점검(F4)·리포트(F5)는 고른 그룹 목록으로 한다. (6) 방향: 약이 들어 있는 부모님 목록의 주인이 코드를 보여 주고, 자녀가 그 코드로 들어와 부모님 목록을 본 뒤 사 드릴 영양제를 더해 경고를 받는다. (7) 권한과 개인정보: 목록 주인만 멤버 내보내기·코드 다시 만들기·항목 삭제를 할 수 있고 멤버는 보기와 더해 보기만 한다. 누구나 그룹에서 나갈 수 있다. 참여 코드는 10분 뒤 만료되고 한 번 쓰면 사라진다. 들어올 때 목록 주인이 '수락'해야 멤버가 된다. (8) E2E는 두 브라우저 창(부모 시드 계정·새로 가입한 자녀)으로 코드 입력 → 수락 → 자녀 화면에 레보티록신·칼슘이 보이고 철분을 더하면 경고, '취소'로 되돌리는지 확인한다.
    status: deferred
    reason: 자녀(P2)와 부모님(P3)이 같은 목록을 보면 사 드린 영양제와 부모님 약이 한자리에 모여 근본 문제를 더 직접 푼다. 하지만 5분 발표와 핵심 흐름(등록 → 더하는 순간 경고 → 근거 → 리포트)에 집중하기 위해 고도화로 둔다. 이번에는 자녀가 부모님 약과 사 드릴 영양제를 자기 목록에 넣어 점검하는 방식으로 자녀의 문제를 푼다(2026-10-29 팀 결정).
  - path: |-
      처방전·약 봉투·약 상자·영양제 상표를 사진으로 찍으면 AI가 글자를 읽어 DB에서 후보를 찾아 보여 주고, 사용자가 직접 골라 목록에 등록한다.
      찍기 전에 촬영 안내를 보여 준다: "플래시를 켜 주세요", "처방전이 보이게 찍어 주세요", "상표명이 보이게 찍어 주세요", "흐리지 않게 찍어 주세요". 너무 흐리거나 어두워 읽지 못하면 "사진이 흐려서 읽지 못했어요. 다시 찍어 주세요"와 '다시 찍기'를 보여 준다.
    status: chosen
    reason: 부모님 약을 모르는 자녀(E17)는 부모님께 약 봉투나 처방전 사진을 받아 바로 등록할 수 있어야 하고, 성분 이름보다 흔히 부르는 이름으로 기억하는 부모님(P3)도 처음 등록이 가장 큰 벽이다. 처방전이나 상표명이 보이면 읽은 이름을 DB(drug.csv의 제품명, 영양제 성분 목록)와 바로 맞춰 볼 수 있어 정확도 문제가 줄고, 알약만 찍어 흐리거나 어두운 경우는 촬영 안내와 다시 찍기로 막는다. 인식이 틀리면 판정도 틀어지므로 AI는 후보만 보여 주고 사용자가 고르기 전에는 등록하지 않는다. 처방전에는 이름·병원 같은 개인정보가 있으므로, 사진을 AI로 보내기 전에 동의를 받고, 읽은 뒤 바로 지우며 저장하지 않는다. 처음에는 보류했지만 2026-10-29 팀 결정으로 구현으로 옮겼다.
  - path: |-
      설문 기반 비타민 추천. 검진 리포트의 '영양제 추천받기' 버튼이나 홈에서 들어가, 좋아지고 싶은 부분(피로·눈·뼈·피부·면역·기타 직접 입력), 하루에 먹을 수 있는 알 수(1알·2~3알·상관없어요), 더 알려 주고 싶은 점(자유 입력)을 설문으로 답하면 LLM이 비타민 등 영양제 성분을 추천한다. 약은 추천하지 않는다. 추천 이유는 DB에 출처와 함께 넣은 성분별 효과에서만 가져온다. 생활 습관 리포트는 하지 않는다.
      AI는 DB 밖에서 지어내지 않는다. 추천 후보는 DB에 있는 영양제 성분에서만 고르고, 사용자가 지금 먹는 약·영양제 목록을 아는 상태에서 고른다. 고른 추천은 더할 때 점검(F4)과 같은 판정 규칙으로 다시 점검해, 지금 목록과 부딪히는 영양제는 경고와 출처를 붙여 보여 주고 '추천'으로 내세우지 않는다.
    status: chosen
    reason: 팀은 병용 주의 안내와 영양제 추천을 함께 제공하기로 했다. 건강을 위해 먹는 약과 영양제가 오히려 해로울 수 있다는 점을 알리고, 영양제를 고를 때도 기존 복용 목록을 확인하도록 돕기 위해서다(팀 의견). 대표 고객인 자녀도 사 드린 뒤 부모님 약과 같이 드셔도 되는 영양제를 추천받으려고 약국까지 갔고(E17), 약을 먹는 사람들도 "같이 먹어도 되는 영양제를 추천해 달라"고 직접 묻는다(E13, E14). 영양제를 새로 챙기려는 사람도 지금 먹는 약과 괜찮은지부터 묻는다(E12). 유튜브 추천으로 영양제를 사는 20~30대(E1)는 내 약을 모르는 추천에 기대고 있다. 일반 AI에게 묻는 것과 다른 점은, 우리 AI는 DB에서만 고르고, 지금 먹는 약과 영양제를 이미 알며, 설문으로 좋아지고 싶은 부분과 먹을 수 있는 알 수를 받고, 그 결과를 출처가 있는 판정 규칙으로 다시 점검한다는 것이다(2026-10-29 팀 결정).
  - path: 약과 영양제를 띄워 먹어야 할 때 복용 시간을 알려 준다.
    status: deferred
    reason: 갑상선약과 칼슘처럼 "띄워 먹으라"는 조합(R3, R12)은 시간 안내가 있어야 실제 행동으로 이어진다. 먼저 경고와 리포트를 완성한 뒤 다음 버전에서 고도화한다.
  - path: 경고 결과를 들고 근처 약국·비대면 약사 상담으로 연결한다.
    status: deferred
    reason: 정확도는 가장 높지만 약사 섭외·운영이 해커톤 범위 밖이다. 대신 모든 경고에 약사·의사 상담 안내와 보여 줄 수 있는 복용 리포트를 둔다.
  - path: 나이·질환·알레르기 같은 개인 건강 정보를 반영해 점검한다.
    status: deferred
    reason: 이번에는 약과 함께 먹을 때 생기는 문제에만 집중하기로 했다. 나이·질환·알레르기는 더 받지 않는다. 영양제 추천(F9) 설문 답(좋아지고 싶은 부분·알 수·더 알려 주고 싶은 점)은 추천을 만들 때만 쓰고 저장하지 않는다. 다만 복용 목록 자체도 건강에 관한 민감정보이므로, 이번 버전도 가입할 때 수집·이용 동의를 받고 본인만 보게 하며 탈퇴하면 지운다(F1). 시드와 E2E에는 가짜 계정만 쓴다.
  - path: 영양제 회사의 후원을 받거나, 사용자의 약과 부딪치지 않는 영양제의 판매 사이트를 연결해 수수료를 받아 운영한다. 후원사·판매 제품은 사용자의 약과 좋은 조합일 때만 보여 주고, 나쁜 조합이면 그 제품이라도 그대로 경고한다.
    status: deferred
    reason: 운영비를 마련할 수 있고, 판매 사이트 연결은 "이 영양제는 부모님 약과 괜찮다"를 확인한 뒤 바로 살 수 있게 해 준다. 하지만 사용자가 이미 필요 없는 영양제 광고에 지쳐 있고(대안 2), 영양제 추천 광고는 규제를 확인해야 한다는 멘토 의견이 있었다. 규제를 확인한 뒤 다시 정한다. 그래서 영양제 추천(F9)은 특정 제품·판매처가 아니라 성분 단위로만 추천하고 구매 링크를 두지 않는다.
insight:
  claim: |-
    흔한 비타민제 설명서에도 "칼슘염과 함께 복용하지 마십시오"라고 적혀 있고(R7), 식약처도 함께 먹을 때 주의할 성분을 알린다(R15). 그런데 이 안내가 실제 행동을 얼마나 바꾸는지는 불분명하다(R16).
    사람들은 영양제는 같이 먹어도 안전하다고 여겨 경고를 찾아볼 생각조차 하지 않는다(R2, E2). 부모님께 영양제를 사 드리는 자녀조차 복용 시간만 묻고, 부모님 약과 같이 드셔도 되는지는 묻지 않는다(E4). 직접 만난 30대 자녀는 부모님 약을 지금도 모르고, 영양제면 다 괜찮은 줄 알아 확인 없이 사 드린 뒤에야 걱정이 되어 약국에 갔다(E17). 직접 들은 경험의 공통점도 위험한 조합을 먹었다는 것이 아니라, 확인해야 한다는 생각도 확인할 방법도 없었다는 것이다(E2, E16, E17).
    걱정이 돼서 묻는 사람도 "몇 분 텀을 둬야 하는지"처럼 어떻게 먹으면 되는지를 알고 싶어 하지만(E7), AI의 답이 애매하거나 출처가 없어 찜찜함이 남는다(E1, E3). 성분표를 읽는 부모님도 결국 유튜브·AI에 묻고(E15), 20대는 브랜드와 광고가 너무 많아 무엇을 골라야 할지 판단하지 못한다(E16).
    자녀가 앱을 여는 이유는 위험을 알아서가 아니라 무엇을 사 드릴지 정하려고다(팀 가설, E17·E13·E14가 뒷받침). 위험을 모르는 사람에게 경고만 내밀면 들어오지 않으므로, 고르기를 돕는 과정에서 부모님 약을 등록하게 하고 그 목록에 대어 묻지 않아도 주의할 조합을 먼저 보여 준다.
  # 확인하지 못한 가정: 약사가 이 복용 리포트를 실제 상담에 쓸모 있다고 볼지는 아직 약사에게 직접 확인하지 못했다(멘토 연락 안 됨). 공개 자료(R20, R21)로만 뒷받침한다.
  # 근거의 한계(발표에서 과장하지 않는다): R3은 건강한 성인 8명 한 번 복용 연구, R2는 2014년 일본 온라인 패널 조사, R4는 약사 단체의 146명 조사, R10은 1991년 한 끼 식사 연구, R11은 학회 회장의 인터뷰 발언, R19는 상호작용만이 아닌 건강기능식품 이상사례 전체 신고 수다. R20은 판매 업체의 자체 조사다.
  evidence: 자주 쓰는 일반의약품 중 e약은요 원문이 있는 36개 중 13개에 영양제 성분 병용 금지 문구가 있었다(R22). 영양제를 먹는 사람 86.1% 중 부작용까지 아는 사람은 15.3%이고(R1), 환자 70.3%는 안전하다고 여겨 말하지 않는다(R2). 만성질환자 72%는 영양제를 약국 밖에서 산다(R4). 경고를 직접 본 사람도 판단하지 못해 AI에 물었고(E3), 실제로 처방약과 영양제가 부딪치는 조합도 나왔다(E5). 공개 질문 글 12건 중 9건은 AI가 답했다(E3~E14). 약을 먹는 사람은 경고에서 그치지 않고 "같이 먹어도 되는 영양제"를 추천해 달라고 묻는다(E13, E14). 팀원도 AI 답을 듣고 찜찜한 채 먹었고(E1), 팀원 아버지는 확인 없이 한꺼번에 드신다(E2).
  design_decision: |-
    사용자가 달라져야 할 행동: "괜찮지 않을까?" 하고 그냥 먹거나 애매한 답에 찜찜한 채 먹던 사람이, 영양제를 사거나 목록에 추가하기 전에 주의할 조합과 근거를 확인하고, 복용 간격을 지키거나 리포트를 들고 약사·의사와 상의한다(E1, E2, E17).
    사용 순서: 가입 → 지금 먹는 약·영양제 등록(검색·사진, 처음에는 경고 없이) → '검진하기'로 한 번에 점검하고 리포트 확인 → 이후 추가하면 따로 묻지 않아도 자동 점검 → 근거 확인 → 기존 복용 목록과 부딪히지 않는 비타민 추천(F3·F8 → F5 → F4 → F6 → F9).
    원칙: 공식 경고와 논문만 복용 목록에 연결하고, 조합 판정은 같은 조합에 항상 같은 결과가 나오는 DB로만 한다(AI는 사진 읽기와 DB 안 추천 후보 고르기에만 쓴다). 처방·진단은 하지 않고, 자료에 없는 조합도 "안전"이라 단정하지 않는다.
features:
  - id: F1
    name: 회원가입·로그인·로그아웃 (근거 — 매번 약국에 갈 수 없으니 한 번 등록한 목록을 계속 써야 한다. 영양제는 약국 밖에서 사고 R4, 약국에 가도 바빠서 다 봐 주지 못한다 E6)
    input: 이메일, 비밀번호(8자 이상), 가입할 때 비밀번호 확인
    output: 가입할 때 "복용 중인 약·영양제(건강 정보) 수집·이용 동의"를 받고, 동의해야 가입된다. 복용자 계정이 만들어지고 복용 목록이 그 계정에만 저장된다. '탈퇴'하면 목록이 함께 지워진다. 이미 가입한 이메일이면 "이미 가입한 이메일이에요", 틀린 이메일·비밀번호면 "이메일 또는 비밀번호가 맞지 않아요"가 보인다. 로그아웃하면 첫 화면으로 가고, 로그인 없이 복용 목록·검진하기에 들어가면 로그인 화면으로 간다.
    done: 다시 로그인해도 등록한 약·영양제와 하루 복용량이 그대로 보이고, 다른 계정에서는 보이지 않는다. 틀린 비밀번호로는 로그인되지 않는다.
  - id: F2
    name: 첫 화면 서비스 소개 (근거 — 문제가 있다는 것 자체를 모른 채 먹는다 R1·R2·E2)
    input: 로그인 없이 첫 화면 열기
    output: 서비스 이름, "약과 영양제를 함께 먹을 때 해로운 조합을 출처와 함께 알려 줘요", 사용 방법 4단계(지금 먹는 약·영양제를 검색이나 사진으로 등록한다 → '검진하기'로 한 번에 점검한다 → 이후 추가하면 자동으로 점검되고 경고와 출처를 확인한다 → 내 약과 부딪히지 않는 비타민을 추천받는다), "이 서비스는 처방이나 진단을 하지 않아요. 복용을 바꾸기 전에 약사·의사와 상담하세요", '회원가입'·'로그인' 버튼이 보인다. 로그인 후 홈에는 '복용 목록'과 '검진하기' 두 칸이 있고, 그 아래 '영양제 추천받기' 버튼이 있다. 화면은 처음 보는 사람이 설명 없이 쓸 수 있게, 아래 탭은 '홈'·'복용 목록'·'검진하기'로 고정하고, 할 일 버튼은 하나만 크게 눈에 잘 띄는 곳에 두며, 본문 글자는 16px 이상, 경고는 색만이 아니라 아이콘과 글자로도 구분한다. 빈 목록·검색 실패·오류에는 다음에 누를 버튼을 함께 보여 준다.
    done: 첫 화면이 로그인 화면으로 넘어가지 않고 소개·사용 방법 4단계·안내·버튼이 보인다. 가입 직후 홈에 '복용 목록'·'검진하기'와 "먹고 있는 약이나 영양제를 추가해 보세요"가 보인다.
  - id: F3
    name: 검색으로 약·영양제 등록·삭제 (근거 — 약은 병원에서, 영양제는 인터넷·마트에서 따로 들어온다 R4, 경고가 성분 이름으로만 적혀 있다 R7·E3, e약은요에는 처방약이 없다 R6, 부모님은 성분 이름 대신 흔히 부르는 이름으로 기억한다 P3)
    input: 약 봉투·약 상자에 적힌 제품명 일부(일반의약품과 전문의약품 모두, 예 비맥스·씬지로이드), 성분 이름(예 레보티록신)이나 흔히 부르는 이름(예 갑상선약), 영양제 성분 이름(칼슘, 철분, 오메가3 등) 2글자 이상, 하루에 먹는 개수(정·알), 영양제는 한 알 함량(mg, 선택)
    output: 약은 식약처 품목 데이터(drug.csv, 일반의약품 6,541개·전문의약품 20,316개)에서 찾고, 이름에 '수출'이 들어간 수출용 품목 2,437개는 검색에서 뺀다. 검색 결과는 이름이 검색어로 시작하는 것부터 최대 20개, 항목마다 이름·회사·쉬운 이름·종류(일반약/처방약/영양제)·주요 성분과 함께 보인다. 고른 뒤 하루에 먹는 개수를 넣고 '등록'하면 내 목록에 추가된다. 처음 목록을 만들 때(첫 '검진하기' 전)는 경고 없이 바로 추가되고, 첫 검진 뒤부터는 F4 점검을 거쳐 추가된다. 2글자 미만이면 "2글자 이상 입력해 주세요", 결과가 없으면 "찾는 제품이 없어요. 성분 이름(예 칼슘)으로 검색해 보세요", 이미 목록에 있으면 "이미 내 목록에 있어요"가 보인다. 목록은 약 / 영양제 칸으로 나뉘어 이름·성분·하루 복용량이 보이고, '삭제'를 누르면 "삭제할까요?" 확인 뒤 지워진다.
    done: 비맥스를 검색하면 비맥스제트정이 주성분과 함께 보인다. '갑상선약'으로 찾으면 레보티록신이 나온다. 씬지로이드를 검색하면 씬지로이드정이 '처방약'으로 보인다. 칼슘을 하루 2알, 한 알 1500mg으로 등록하면 영양제 칸에 칼슘 하루 3000mg이 생긴다. '수출용' 품목은 결과에 나오지 않는다. 없는 제품명(예 해외 직구 제품, E15)을 찾으면 성분 이름 안내가 보이고, 성분 이름으로 등록할 수 있다. 삭제하면 "등록된 약·영양제가 목록에서 삭제되었습니다."가 보이고 목록과 검진 리포트에서 사라진다.
  - id: F4
    name: 더하는 순간 조합 점검 — 약×영양제, 영양제×영양제, 과다 섭취 (근거 — 영양제는 안전하다고 여겨 묻지 않는다 R2·E2·E4, 경고를 보고도 판단하지 못했다 E3, AI 답은 애매하다 E1)
    input: 첫 '검진하기' 뒤 검색이나 사진으로 항목 하나를 등록하는 순간의 새 항목·하루 복용량과 내 기존 목록
    output: |-
      판정 규칙: (1) 새 항목의 성분 × 목록 모든 항목의 성분으로 짝을 전부 만들어 DB에서 찾는다((A,B)와 (B,A)는 같은 짝). (2) 같은 성분의 하루 합계를 출처의 기준량과 비교한다(기준량 숫자가 출처에 있는 성분만). (3) 찾은 기록은 '함께 먹지 마세요' → '시간을 띄워 드세요' → '하루 기준량을 넘어요' 순으로 모두 보여 준다. (4) 같은 목록이면 언제나 같은 결과이고 랜덤·AI 생성은 없다. 숫자(시간·기준량)는 출처에 적힌 것만 보여 준다.
      기록이 있으면 묻지 않아도 경고 창이 먼저 뜬다. 맨 위에 단계("함께 먹지 마세요" / "시간을 띄워 드세요" / "하루 기준량을 넘어요")와 출처에 있을 때만 대처 방법(예 "레보티록신과 최소 4시간 띄워 드세요")이 크게 보이고, 그 아래 어떤 성분끼리인지("레보티록신(갑상선약) ↔ 철분"), 근거 원문 문장, 출처 제목과 링크, 약사에게 물을 질문 한 줄, "복용을 바꾸기 전에 약사·의사와 상담하세요", '자세히'·'그래도 추가'·'취소'가 보인다. '취소'하면 등록되지 않는다.
      성분은 이름 글자가 아니라 성분 정규화 표(F7)로 맞춘다. 예를 들어 '칼슘(보충용)'은 탄산칼슘·침강탄산칼슘·시트르산칼슘 같은 칼슘 보충 성분만 뜻하고, 판토텐산칼슘(비타민 B5)·로수바스타틴칼슘·아토르바스타틴칼슘·폴리스티렌설폰산칼슘처럼 칼슘이 염으로만 붙은 성분은 칼슘으로 보지 않는다. 같은 제품 안 성분끼리는 비교하지 않는다.
      기록이 없으면 "확인한 자료에서는 보고된 문제가 없어요. 걱정되면 약사에게 확인하세요"와 함께, 몇 개 성분 짝을 어떤 자료(식약처 e약은요·식품안전나라·논문)에서 확인했는지와 DB 확인 날짜, 약사에게 물을 질문 한 줄을 보여 주고 바로 등록된다. 출처 없는 "괜찮을 것 같다"는 말은 하지 않는다. 점검이 실패하면 "지금은 점검할 수 없어요. 잠시 뒤 다시 시도하세요"가 보이고 등록하지 않는다. 성분 정보가 없는 항목은 등록되지만 "성분 정보가 없어 점검하지 못했어요"가 보인다.
    done: 비맥스제트정이 있는 목록에 칼슘을 더하면 "칼슘염… 함께 복용하지 마십시오" 원문과 출처 링크(R7), 약사에게 물을 질문이 뜬다. 레보티록신이 있는 목록에 철분을 더하면 "시간을 띄워 드세요", 최소 4시간 안내, 출처 MedlinePlus(R12)가 뜨고, 칼슘이 있는 목록이면 칼슘 ↔ 철분 흡수 방해 경고와 R10 링크도 함께 뜬다. 판토텐산칼슘이 든 비타민B군 제품(예 비맥스제트정 자체, 삐콤정)을 더해도 칼슘 경고는 뜨지 않는다. 칼슘 합계가 하루 2,000mg을 넘으면 "하루 기준량을 넘어요"와 함께 출처의 기준량 두 개(19~50세 2,500mg, 50세 초과 2,000mg)와 R13 링크가 뜬다(나이는 받지 않으므로 낮은 기준으로 판정하고 두 기준을 모두 보여 준다). 같은 조합은 몇 번을 해도 같은 경고가 뜨고, 기록 없는 조합에는 "안전"이라는 단정이 나오지 않는다.
  - id: F5
    name: 검진하기 — 한 번에 점검하는 약사·의사용 복용 리포트 (근거 — 환자 70.3%가 영양제를 말하지 않는다 R2, 약국은 바빠서 다 봐 주지 못한다 E6, 어떻게 먹으면 되는지 묻는다 E7, 자녀가 부모님께 보여 드릴 근거가 필요하다 P2, 약사 상담은 복용 중인 약과 보충제를 하나씩 확인하는 데서 시작한다 R21, 약사 단체는 처방약과 영양제를 함께 먹으면 약사 상담을 권한다 R20)
    input: 처음 등록한 목록 전체 또는 지금 내 목록에 등록된 약과 영양제, 하루 복용량
    output: DB로만 판정해 목록 전체에서 해로운 성분 조합과 같은 성분의 하루 합계가 기준량을 넘는 경우를 "주의할 항목 N개"와 함께 맨 위에 보여 준다. 항목마다 해야 할 행동·이유·출처 링크·약사에게 물을 질문·'자세히'가 있고, 아래에 복용 중인 약·영양제 전체와 하루 복용량이 한 화면에 모여 약사·의사에게 그대로 보여 줄 수 있다. 하나도 없으면 "확인한 자료에서는 보고된 문제가 없어요. 걱정되면 약사에게 확인하세요"가 보인다. 리포트 맨 아래에 '영양제 추천받기' 버튼이 있다(F9).
    done: 갑상선약과 칼슘을 경고 없이 등록한 뒤 검진하기를 누르면 맨 위에 그 조합 경고, 최소 4시간 띄워 먹으라는 안내, 출처 링크, 약사에게 물을 질문이 보이고, 아래에 복용 중인 약·영양제가 모두 보인다. 칼슘을 하루 3000mg(2알 × 1500mg)으로 등록하면 과다 섭취 경고와 기준량 두 개(19~50세 2,500mg, 50세 초과 2,000mg)·출처 링크가 뜬다. 같은 목록으로 다시 검진해도 결과가 같다.
  - id: F6
    name: 근거 보기(조합 상세) (근거 — 출처를 밝히지 않는 AI·앱 답 대신 사용자와 약사가 직접 확인할 수 있어야 한다 R9·E3)
    input: 경고 창이나 리포트의 '자세히'
    output: 두 성분(또는 과다 섭취 성분), 단계, 이유, 원문 문장, 해야 할 행동, 출처 목록(제목·자료 종류 공식 자료/논문·연구 조건·링크), DB 확인 날짜가 보이고 '출처 보기'는 새 창으로 열린다.
    done: 레보티록신 ↔ 칼슘 상세에 R3 제목·"논문"·"건강한 성인 8명 연구"와 R12 "공식 자료"·"최소 4시간"이 보이고, 링크가 각각 PMC·MedlinePlus 원문이다.
  - id: F7
    name: 원문 근거 조합 DB와 성분 정규화 시드 (근거 — 출처 없는 SNS·AI·앱 답 대신 고정된 공식 근거, "보고된 문제가 없어요"만 되풀이하지 않으려면 DB가 넓어야 한다 E1·E2)
    input: |-
      저장소에 커밋한 시드 파일 세 가지.
      (1) 품목: 식약처 품목 데이터 database/drug.csv·drug_ingredient.csv(제품, 회사, 일반/전문, 성분과 한 알 함량)와 영양제 성분 목록(칼슘, 철분, 오메가3, 마그네슘, 비타민B군, 비타민C, 비타민D, 유산균, 인삼, 밀크씨슬, 알로에, 녹차추출물 등과 쉬운 이름).
      (2) 성분 정규화 표: 데이터의 성분 이름 → 판정용 성분. 예 탄산칼슘·침강탄산칼슘·시트르산칼슘수화물·인산수소칼슘·글루콘산칼슘 → 칼슘(보충용), 푸마르산철·건조황산제일철·폴리사카리드철착염·글루콘산제일철 → 철분, 레보티록신나트륨수화물 → 레보티록신. 판토텐산칼슘·스타틴 계열 칼슘염·폴리스티렌설폰산칼슘·도베실산칼슘은 칼슘(보충용)으로 보지 않는다.
      (3) 조합·기준량 규칙: 성분, 상대 성분, 단계, 원문 문장, 해야 할 행동, 약사에게 물을 질문, 출처 URL·자료 종류·연구 조건·확인 날짜.
    output: |-
      빈 DB에서 앱이 처음 뜰 때 세 시드가 자동으로 들어간다. 주최 측 실행(docker compose)은 컨테이너 안 DB에 같은 CSV를 넣고, 배포 환경은 같은 CSV를 Supabase에 올린다. 출처 URL이 없는 규칙은 들어가지 못한다.
      첫 배포 규칙(목표 20개 이상): 비맥스제트정 ↔ 칼슘(R7), 레보티록신 ↔ 칼슘(R3, R12), 레보티록신 ↔ 철분(R12), 칼슘 ↔ 철분(R10), 칼슘 하루 기준량(R13), 팀이 e약은요에서 찾은 영양제 성분 병용 금지 13개 품목(R22, database/eyak_supplement_warnings.csv) 전부, 식품안전나라 병용 섭취 주의사항(R16, R18)과 식약처 안내(R15)의 인삼·유산균·오메가3·밀크씨슬·녹차추출물·알로에 규칙(예 유산균 ↔ 항생제 — E8의 록시트로마이신, 오메가3 ↔ 항응고제).
      넣는 절차: 원문 페이지를 열어 문장을 그대로 옮기고 → 성분을 정규화 표로 맞추고 → 다른 팀원이 원문과 대조해 확인 날짜를 적은 것만 넣는다.
      복용자 시드 계정 목록에는 레보티록신(씬지로이드정 0.1mg) 하루 1정과 칼슘 하루 1000mg이 들어 있다.
    done: 빈 DB에서 docker compose up만 하고 복용자 계정으로 검진하기를 누르면 레보티록신 ↔ 칼슘 경고가 실제로 뜬다. 시드의 모든 규칙에 원문 문장과 열리는 출처 URL이 있고 20개 이상이다. 성분 정규화 표 때문에 판토텐산칼슘 제품에는 칼슘 경고가 뜨지 않는다.
  - id: F8
    name: 사진으로 약·영양제 등록 — 동의, 촬영 안내, 다시 찍기 (근거 — 부모님 약을 모르는 자녀는 부모님께 약 봉투·처방전 사진을 받아 등록해야 한다 E17, 약 봉투에 적힌 이름을 그대로 넣을 수 있어야 한다 R17, 부모님은 성분 이름보다 흔히 부르는 이름으로 기억한다 P3)
    input: 처방전·약 봉투·약 상자·영양제 상표 사진, 하루에 먹는 개수, 영양제는 한 알 함량(선택)
    output: |-
      처음 '사진으로 등록'을 누르면 "사진을 AI로 보내 글자를 읽어요. 읽은 뒤 사진은 바로 지우고 저장하지 않아요"와 '동의하고 찍기'·'검색으로 등록'이 보인다. 동의하지 않으면 사진은 보내지 않는다.
      찍기 전에 촬영 안내 네 줄이 보인다: "플래시를 켜 주세요", "처방전이 보이게 찍어 주세요", "상표명이 보이게 찍어 주세요", "흐리지 않게 찍어 주세요".
      사진을 올리면 AI가 글자를 읽어 DB(drug.csv 제품명, 영양제 성분 목록)에서 후보를 최대 5개 보여 준다. 사용자가 후보를 직접 고르고 개수를 넣어 '등록'하면 목록에 추가된다(첫 검진 뒤라면 F4 점검을 거친다). 고르기 전에는 등록되지 않는다.
      너무 흐리거나 어두워 읽지 못하면 "사진이 흐려서 읽지 못했어요. 다시 찍어 주세요"와 '다시 찍기'·'검색으로 등록'이 보인다. 읽었지만 DB에 없으면 "사진에서 찾지 못했어요. 이름으로 검색해 보세요"가 보인다. AI 호출이 실패하면 "지금은 사진을 읽을 수 없어요. 검색으로 등록해 주세요"가 보인다.
    done: 동의하기 전에는 사진이 AI로 보내지지 않는다. 사진은 서버와 DB 어디에도 저장되지 않는다. 흐린 사진을 올리면 다시 찍어 달라는 안내가 보이고 아무것도 등록되지 않는다. 훼로바-유서방정 상자 사진을 올리면 후보에 훼로바-유서방정(건조황산제일철)이 보이고, 고르고 1을 넣어 등록하면 레보티록신 ↔ 철분 경고가 뜬다. AI 키는 서버 환경변수 AI_GATEWAY_API_KEY에서 읽는다.
  - id: F9
    name: 설문 기반 비타민 추천 (근거 — 약을 먹는 사람이 같이 먹어도 되는 영양제를 추천해 달라고 묻는다 E13·E14, 영양제를 새로 챙길 때 내 약과 괜찮은지부터 묻는다 E12, 여러 제품 중 무엇이 좋은지 유튜브·AI에 묻는다 E15, 광고가 많아 고를 수가 없다 E16, 자녀는 부모님 약과 같이 드셔도 되는 영양제를 추천받으려고 약국에 직접 간다 E17, 일반 AI 답은 내 약을 모르고 출처가 없다 E1·E3)
    input: 검진 리포트의 '영양제 추천받기' 또는 홈의 '영양제 추천받기'에서 설문 — ① 좋아지고 싶은 부분(피로·눈·뼈·피부·면역·기타 직접 입력, 여러 개 고르기) ② 하루에 먹을 수 있는 알 수(1알·2~3알·상관없어요) ③ 더 알려 주고 싶은 점(자유 입력), 그리고 이미 등록된 내 약·영양제 목록
    output: |-
      LLM이 DB의 비타민 등 영양제 성분 안에서만 추천 후보를 고르고(약은 추천하지 않는다), 하루에 먹을 수 있는 알 수에 맞춰 개수를 정하며, 각 추천에 왜 골랐는지(설문의 어떤 답 때문인지)와 DB에 출처와 함께 넣은 그 성분의 효과 문장·출처 링크를 붙인다. 효과 문장이 DB에 없는 성분은 추천하지 않는다. 고른 후보는 F4와 같은 판정 규칙으로 내 목록과 다시 점검해, 부딪히는 성분은 '추천'이 아니라 "지금 드시는 ○○과 함께 주의가 필요해요" 경고와 출처로 보여 준다.
      추천은 성분 단위로만 하고 특정 제품·구매 링크는 두지 않는다. 화면 맨 위와 아래에 "이 추천은 진단이나 처방이 아니에요. 새로 드시기 전에 약사·의사와 상담하세요"가 보인다.
      설문 답은 추천을 만들 때만 쓰고 저장하지 않는다. AI 호출이 실패하면 "지금은 추천을 만들 수 없어요. 잠시 뒤 다시 시도하세요"가 보인다.
    done: 레보티록신과 칼슘이 있는 목록에서 '영양제 추천받기' → 좋아지고 싶은 부분 '피로' → 하루에 먹을 수 있는 알 수 '1알' → '추천 보기'를 누르면, 추천은 1개이고 추천 비타민마다 추천 이유와 효과 문장의 출처 링크가 보이고, 철분처럼 지금 목록과 부딪히는 성분이 나오면 추천이 아니라 경고와 출처(R12)로 보인다. "진단이나 처방이 아니에요" 안내가 보인다. 생활 습관 리포트는 없다. 추천에 DB에 없는 성분이나 제품명·구매 링크는 나오지 않는다.
