# 종이 문제정의 캔버스(2026-10-29, 팀 늘크크)와 팀 대화·멘토링 내용을 옮긴 기록입니다.
# 외부 수치는 sources에 적은, 실제로 연 자료의 표현과 표본을 그대로 옮겼습니다.

statement: 영양제와 약을 함께 먹는 사람은, 매일 둘을 같이 먹을 때 그 조합을 점검해 주는 사람도 도구도 없기 때문에, 약효를 떨어뜨리거나 몸에 해로운 조합을 모른 채 먹는다. 지금은 SNS·약사·생성형 AI에 물어 버티지만, 믿기 어렵거나 번거롭거나 답이 매번 달라진다.
canvas:
  context: 매일 영양제와 약을 함께 먹을 때. 영양제를 새로 시작하거나, 감기약·진통제를 사 먹거나, 병원에서 약을 새로 받을 때.
  customer: 건강해지려고 영양제를 챙겨 먹으면서 약(처방약·일반의약품)도 함께 먹는 사람.
  root_problem: 약과 영양제를 한자리에서 보는 사람이 없다. 의사·약사는 환자가 먹는 영양제를 모르고, 약 점검 제도(DUR)에는 건강기능식품이 없다(R4). 복용자도 성분과 해로운 조합을 알기 어렵다.
  impact:
    feeling: 잘못 먹어 온 걸 알면 찝찝하고 걱정된다. 건강해지려고 먹었는데 더 나빠지면 당혹스럽다.
    measurable: 영양제를 먹는 사람은 86.1%지만 효능·부작용을 모두 안다는 응답은 15.3%뿐이다(R1). 일본 조사에서 약과 영양제를 함께 먹는 환자의 70.3%는 의사·약사에게 알리지 않았다(R2).
  alternatives:
    - how_used: 유튜브·SNS에서 찾아본다.
      shortcoming: 비전문가 의견이라 잘못된 정보를 믿을 수 있다.
      why_ours: 모든 판정에 공식 자료 출처 링크가 붙는다.
    - how_used: 약사에게 하나하나 물어본다.
      shortcoming: 영양제를 살 때마다 물어보기 번거롭다.
      why_ours: 한 번 등록해 두면 추가할 때마다 집에서 바로 확인된다.
    - how_used: 생성형 AI에게 물어본다.
      shortcoming: 틀린 정보를 사실처럼 말하고, 물을 때마다 답이 달라진다.
      why_ours: 팀이 만든 DB로만 판정해 같은 조합에는 항상 같은 답과 출처가 나온다.
personas:
  - id: P1
    description: 건강을 위해 영양제를 챙겨 먹고 약도 함께 먹지만, 영양제에 깊은 지식은 없는 사람
    source: 종이 캔버스 뒷면 P1
experiences:
  - id: E1
    when: null
    what_happened: 자료 조사 중, 갑상선약을 칼슘과 함께 먹으면 흡수가 줄어 시간을 띄워 먹어야 한다는 연구를 찾았다(R3).
    workaround: null
    feeling: null
    quote: null
    source: 팀 자료 조사(팀원 본인 경험 아님)
sources:
  - id: R1
    url: https://www.etoday.co.kr/news/view/2237180
    title: 영양제 복용하는 10명 중 8명 "효능‧부작용 잘 몰라" (이투데이, 2023, 인크루트 944명 설문)
    claim: 1종 이상 영양제를 먹는 응답자는 86.1%였고, '효능과 부작용까지 모두 알고 있다'는 응답자는 15.3%였다.
  - id: R2
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4425182/
    title: Concomitant Use of Dietary Supplements and Medicines in Patients due to Miscommunication with Physicians in Japan (Nutrients, 2015)
    claim: 일본 온라인 조사에서 약과 영양제를 함께 먹는 환자(1,508명)의 70.3%가 의사·약사에게 영양제 복용을 알리지 않았다.
  - id: R3
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3092723/
    title: Absorption of Levothyroxine When Coadministered with Various Calcium Formulations (Thyroid, 2011)
    claim: 건강한 성인 8명 연구에서 칼슘제를 레보티록신과 함께 먹으면 흡수가 약 20~25% 줄었다.
  - id: R4
    url: https://www.data.go.kr/data/15059486/openapi.do
    title: 식품의약품안전처_의약품안전사용서비스(DUR)품목정보 (공공데이터포털)
    claim: 의약품의 병용금기·연령금기 등 9가지 항목을 제공하며, 공개된 항목에 건강기능식품은 없다(팀 확인).
  - id: R5
    url: https://www.data.go.kr/data/15075057/openapi.do
    title: 식품의약품안전처_의약품개요정보(e약은요) (공공데이터포털)
    claim: 일반의약품마다 '이 약을 사용하는 동안 주의해야 할 약 또는 음식' 항목을 공식 문장으로 제공한다.
five_whys:
  symptom: 갑상선약과 칼슘 영양제를 같이 먹었더니 약효가 떨어졌다. (R3 기반 가상 사례)
  whys:
    - 갑상선약이 몸에 덜 흡수됐다.
    - 칼슘과 함께 먹으면 흡수가 약 20~25% 준다(R3).
    - 아침 식후에 약과 영양제를 한꺼번에 먹었다.
    - 약과 영양제를 다른 때에 따로 시작했다.
    - 둘을 함께 점검해 주는 사람이 없었다.
solution_paths:
  - path: 공식 자료와 논문으로 출처가 붙은 약·영양제 조합 DB(AI 위키)를 만들고, 사용자가 먹는 약과 영양제를 등록하면 DB로 점검해 알려 준다.
    status: chosen
    reason: 공식 자료로만 판정해 정확하고 답이 일정하며, 집에서 바로 확인할 수 있다.
  - path: 약과 약 사이의 병용 금기까지 다룬다.
    status: rejected
    reason: 위험이 크고 처방 단계 DUR이 이미 점검한다. 점검 공백인 약+영양제만 다룬다.
insight:
  claim: 상호작용 정보는 이미 있지만(R5), 약을 받는 곳과 영양제를 사는 곳이 달라 아무도 둘을 함께 보지 않는다.
  evidence: 환자 70.3%가 영양제 복용을 알리지 않고(R2), DUR에는 건강기능식품이 없다(R4). 실제로 갑상선약+칼슘처럼 해로운 조합이 있다(R3).
  design_decision: 약과 영양제를 한 번 등록하면 추가할 때마다 출처와 함께 경고한다. 처방은 하지 않고, DB에 없는 조합도 "안전"이라 단정하지 않고 약사 상담을 권한다.
features:
  - id: F1
    name: 회원가입·로그인
    input: 이메일·비밀번호
    output: 내 복용 목록이 계정에 저장된다
    done: 다시 로그인해도 등록한 약·영양제가 그대로 보인다.
  - id: F2
    name: 약·영양제 검색해서 등록·삭제
    input: 약 이름 또는 영양제 성분 이름
    output: 찾은 제품과 성분이 보이고, 고르면 내 목록에 추가·삭제된다
    done: 칼슘을 검색해 추가하면 목록에 생기고, 결과가 없으면 "찾는 제품이 없어요"가 보인다.
  - id: F3
    name: 추가할 때 조합 점검
    input: 내 목록에 약이나 영양제 하나 추가
    output: 위험 조합이면 이유·출처 링크·약사 상담 안내가 담긴 경고가 뜨고, DB에 없으면 "확인한 자료에서는 보고된 문제가 없어요. 약사에게 확인하세요"가 뜬다
    done: 갑상선약 등록 후 칼슘을 추가하면 경고와 출처 링크가 뜬다. 기록 없는 조합에는 "안전"이라는 단정이 나오지 않는다.
  - id: F4
    name: 출처 확인된 조합 시드 데이터
    input: 저장소에 커밋한 시드 파일(조합, 설명, 출처 URL)
    output: 빈 DB에서 앱이 처음 뜰 때 시드가 자동으로 들어간다
    done: 빈 DB에서 docker compose up만 하고 F3 흐름을 따라가면 경고가 실제로 뜬다.
