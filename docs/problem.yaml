  - id: E15
    when: 2026-10-29 인터뷰
    what_happened: 50대 어머니는 오메가3·글루타치온·칼슘-마그네슘을 해외 직구로 사 드신다. 병원과 약국은 약만 묻고 영양제는 묻지 않는다. 성분표는 읽고, 사기 전에 효능을 찾아본다.
