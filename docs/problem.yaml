five_whys:
  symptom: 갑상선약과 칼슘, 철분 영양제 복용시 흡수 저하, 피로 상승
  whys:
    - 빈혈은 개선되지만 갑상선 기능 저하 악화.
    - 동시 복용시 흡수를 약 20~25% 줄임
    - 장 안에서 두 약이 달라붙음
    - 아침 식후 한꺼번에 복용
    - 약과 영양제가 다른 시점에 추가, 점검 인원이 없었다.
  # 종이의 근본 문제 칸: "약+영양제 조합을 모름" (앞면 ③ 반영 여부는 학생 확인 대기)
# solution_paths는 종이 3번 칸을 2026-10-29 대화에서 학생이 말한 내용으로 채웠습니다.
solution_paths:
  - path: |-
      자체 DB를 구축해 LLM 위키백과를 구현한다.
      팀이 Claude로 논문과 공식 자료를 미리 모아 DB를 완성해 둔다. DB에는 성분 정보와 어떤 성분끼리 나쁜 영향을 주는지가 들어간다.
      사용자가 먹는 약과 영양제를 저장해 두고, 새로 추가하면 LLM API로 DB를 찾아보고 판단해서 조언해 준다.
      DB에 없는 조합을 추가하면 "현재 논문과 공신력 있는 저널을 봤을 때는 문제가 없어요. 잘하고 있어요."라고 보여 준다.
    status: chosen
    reason: |-
      논문과 관련 자료를 기반으로 DB를 만들어 그걸 기반으로 답해 주기 때문에 다른 방법보다 정확하고 집에서 간단히 확인할 수 있다.
      예상 반론 대비: 아직 발견되지 않은 조합도 해로울 수 있으므로 답변에 "현재 기준"임을 명시하고, 위키백과는 주기적으로 업데이트한다.
      제외: 아직 세상에 발견되지 않은 부작용은 판단할 수 없으므로 제외한다. 이미 알려져 있지만 팀 DB에서 빠진 부작용도 지금 기준으로 자료를 모아 DB를 만들기 때문에 드물 것이라 제외한다.
  - path: |-
      건강보조식품 회사의 후원을 받아 운영한다.
      후원 회사 제품은 사용자가 먹는 약과 좋은 조합일 때만 보여 주고, 나쁜 조합이면 후원 회사 제품이라도 그대로 알려 준다.
    status: chosen
    reason: 앱 운영비를 충당할 수 있다.
insight:
  claim: 영양제와 약을 같이 섭취하는데 오히려 건강에 해가 되는 경우가 있었음
  evidence: 실제로 논문에 근거가 있어서 해가 되는 경우가 있음
  design_decision: |-
    약과 영양제를 같이 섭취하려고 등록했고 이러한 조합이 건강에 해가 되는 성분이 있을 때 서비스에서 경고를 줌
    하지만 그렇다고 직접 약을 처방하거나 영양제를 처방하진 않음
