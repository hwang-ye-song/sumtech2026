# 종이 문제정의 캔버스(2026-10-29, 팀 늘크크)와 팀 대화·멘토링·자료 조사 내용을 옮긴 기록입니다.
# 외부 수치와 인용은 sources에 적은, 실제로 연 자료의 표현과 표본을 그대로 옮겼습니다.

statement: |-
  더 건강해지려고 매일 영양제를 챙겨 먹는 사람들은 영양제는 다 몸에 좋다고 믿는다.
  그래서 함께 먹는 약이나 다른 영양제와 겹쳐 오히려 약효를 깎거나 몸에 해가 될 수 있다는 걸 모른 채 매일 먹는다.
canvas:
  context: |-
    집에서 하루 한 번 정해진 때, 약과 영양제를 한꺼번에 먹는다. 영양제는 매일 먹는 것이라, 잘못된 조합이 한 번 생기면 알아챌 때까지 매일 반복된다.
    그 조합은 보통 따로따로 생긴다. 먹던 영양제가 있는데 감기약이나 병원 약이 새로 생기거나, 먹던 약이 있는데 인터넷·마트에서 영양제를 새로 산다.
    영양제는 대부분 약국 밖에서 사서(약 72%, R4), 더해지는 순간마다 전체 조합을 맞춰 봐 주는 사람이 없다.
  customer: |-
    고혈압·갑상선 질환처럼 약을 매일 먹어야 하는 50~60대와, 그 부모님께 영양제를 사 드리는 30~40대 자녀.
    부모님은 병원에서 약만 받고, 영양제는 자녀가 인터넷에서 골라 보내거나 홈쇼핑·마트에서 직접 산다. 부모님은 성분표를 읽기 어렵고 약사에게 영양제 이야기를 꺼내지 않는다.
    자녀는 부모님이 무슨 약을 드시는지 정확히 몰라서, 사 드린 영양제가 그 약과 부딪칠 수 있다는 생각을 못 한다.
  root_problem: |-
    부모님은 병원에서 약을 받아 오고, 영양제는 자식이 인터넷에서 사 보내거나 마트에서 산다. 약과 영양제가 이렇게 따로따로 들어오다 보니, 둘을 같이 놓고 봐 주는 사람이 아무도 없다.
    부모님은 영양제를 밥처럼 안전한 거라 생각해서 의사한테 굳이 말하지 않고(R2), 자식은 부모님이 무슨 약을 드시는지 잘 모른다.
    "같이 먹지 마세요"라는 경고는 약 설명서 안에만 적혀 있고(R7), 영양제는 약국 밖에서 사니 약사가 볼 일도 없다(R4). 병원과 처방 점검 시스템도 약만 보고 영양제는 따지지 않는다(R5, R8).
  impact:
    feeling: |-
      부모님은 건강해지려고 챙겨 먹은 영양제가 오히려 약을 방해했다는 걸 알면 당혹스럽다.
      자식도 마찬가지다. 건강하시라고 사 드린 비타민이 부모님 건강을 나쁘게 하고 있었다면 당혹스러울 것 같다(팀원 생각).
    measurable: |-
      영양제를 하나라도 먹는 사람은 86.1%인데, 효능과 부작용을 다 안다는 사람은 15.3%뿐이다(R1).
      약과 영양제를 같이 먹는 환자의 70.3%는 의사·약사에게 말하지 않았고, 가장 많이 꼽은 이유는 영양제를 그냥 음식으로 여긴 것이었다(R2).
      건강한 성인 8명 연구에서 갑상선약(레보티록신)을 칼슘과 함께 먹으면 흡수가 약 20~25% 줄었다(R3).
      팀이 2026-10-29 식약처 e약은요에서 해열진통제·감기약·비타민제 등 자주 쓰는 일반의약품 58개를 조회하니, 9개에 칼슘·철분 같은 영양제 성분과 "함께 복용하지 마십시오", 3개에 "상의하십시오" 문구가 있었다(R6, R7).
      영양제끼리도 부딪친다. 126명 연구에서 칼슘을 함께 먹으면 철분 흡수가 줄었고, 300~600mg에서는 약 50~60% 줄었다(R11).
  alternatives:
    - how_used: |-
        대부분은 문제가 있을 수 있다는 것 자체를 모른 채 그냥 먹는다.
        자식은 "눈에 좋다", "뼈에 좋다"는 말을 듣고 인터넷에서 영양제를 주문해 부모님 댁으로 보낸다. 부모님은 받은 영양제를 원래 드시던 혈압약이나 갑상선약 옆에 두고, 아침을 드신 뒤 한꺼번에 삼킨다.
        병원에 가도 영양제 이야기는 꺼내지 않고, 약을 새로 받아 와도 영양제는 그대로 계속 드신다.
      shortcoming: 안 좋은 조합이어도 아무도 모른 채 매일 먹는다.
      why_ours: 묻지 않아도 알려 준다. 부모님 약과 영양제를 목록에 넣어 두면, 새 영양제를 더하는 순간 경고가 먼저 뜬다. 자녀가 영양제를 사기 전에 넣어 봐도 된다.
    - how_used: 걱정이 될 때는 유튜브나 블로그에서 "OO이랑 같이 먹어도 되나"를 검색해 본다.
      shortcoming: 비전문가 말이라 틀린 정보를 믿을 수 있다. 나한테 필요도 없는데 좋다고 사라는 광고가 많다.
      why_ours: 모든 경고에 식약처 원문 문장과 링크가 그대로 붙는다.
    - how_used: 약국에 갈 일이 있을 때 약사에게 "이거 같이 먹어도 돼요?" 하고 묻는다.
      shortcoming: 영양제는 약국 밖에서 사서(R4) 살 때마다 물어보기 번거롭고, 약사도 부모님이 먹는 영양제를 다 모른다.
      why_ours: 한 번 등록하면 추가할 때마다 자동으로 점검되고, 약사에게는 물어볼 질문이 정리된 복용 리포트를 보여 주면 된다.
    - how_used: 챗GPT 같은 AI에게 먹는 약과 영양제 이름을 적고 같이 먹어도 되는지 묻는다(E1).
      shortcoming: 틀린 말도 사실처럼 하고, 설명서 문구를 확인하지 못한 채 답하며(E1), 같은 걸 물어도 답이 매번 다르다.
      why_ours: 식약처 원문과 논문에서 뽑은 DB로만 판정해, 같은 조합에는 항상 같은 답과 같은 출처가 나온다.
    - how_used: 필라이즈 같은 건강 앱에 먹는 약과 영양제를 넣어 부작용 위험 성분을 확인한다(R10).
      shortcoming: 위험 성분을 알려 준다고 하지만, 그 판단이 어떤 공식 자료에서 왔는지 앱 소개에 밝히지 않는다(R10).
      why_ours: 경고마다 근거가 된 식약처 원문 문장과 출처 링크를 보여 줘, 사용자와 약사가 직접 확인할 수 있다.
    - how_used: 약 상자나 설명서의 주의사항을 직접 읽어 보거나, 식약처 e약은요에서 약 이름을 검색한다.
      shortcoming: 약 하나씩의 긴 설명이라 내 영양제와 맞춰 보는 건 스스로 해야 하고, 병원 약(처방약)은 나오지 않는다(R6).
      why_ours: 내 약과 영양제를 한 목록에 두고 추가하는 순간 서로 맞춰 보며, 처방약은 성분 이름으로 등록한다.
personas:
  - id: P1
    description: 혈압약이나 갑상선약을 매일 먹는 50~60대 부모님. 영양제는 자식이 사 준 것과 홈쇼핑에서 산 걸 같이 먹는다. 성분표는 글씨가 작고 어려워 안 읽는다.
    source: 팀 논의(종이 캔버스 P1을 고객에 맞춰 좁힘), R3, R4
  - id: P2
    description: 부모님께 영양제를 인터넷으로 사 보내는 30~40대 자녀. 부모님이 무슨 약을 드시는지 정확히 모른다.
    source: 팀 논의, E2 (닥터나우 공개 질문, 2024-11-05)
  - id: P3
    description: 종합비타민·오메가3·칼슘을 매일 먹다가 아플 때 약을 같이 먹는 직장인. 걱정되면 온라인 AI 상담에 물어본다.
    source: E1 (닥터나우 공개 질문, 2026-10-07)
experiences:
  - id: E1
    when: 2026-10-07
    what_happened: 포텐비정·오메가3(EPA·DHA 900mg)·칼슘·마그네슘·비타민K2&D 제품을 하루 한 알씩 함께 먹으려다, 포텐비정 주의사항의 칼슘염 병용 금지 문구와 세 제품의 비타민D 총량을 짚으며 같이 먹어도 되는지 물었다.
    workaround: 온라인 의료 상담 서비스에 질문을 올렸고, 의사·약사가 아닌 AI의 참고용 답변을 받았다. 답변은 그 문구를 허가사항에서 확인하지 못했다며 포장을 다시 보고 약사와 상담하라고 했다.
    feeling: null
    quote: 포텐비정과 칼슘·오메가3 제품 동시 복용 가능할까요?
    source: R9
  - id: E2
    when: 2024-11-05
    what_happened: 부모님께 뇌영양제·관절영양제·비타민·오메가3를 사 드리는 자녀가, 언제 드시게 하면 좋은지 복용 시간만 물었다. 부모님이 드시는 약이 있는지, 그 약과 같이 드셔도 되는지는 묻지 않았다.
    workaround: 온라인 의료 상담 서비스에 질문을 올렸고, 닥터나우 AI의 참고용 답변을 받았다.
    feeling: null
    quote: 부모님 건강보조제를 사드리는데 복용시간 등 방법이 궁금합니다.
    source: R13
  - id: E3
    when: 2025-05-13
    what_happened: 병원에서 기넥신(은행잎 추출물 약)과 아로나민씨플러스를 처방받은 직장인이, 원래 먹던 멀티비타민·오메가3+비타민D·히알루론산·유산균·밀크씨슬·바나바잎 캡슐을 다 같이 먹어도 되는지 물었다.
    workaround: 온라인 의료 상담 서비스에 질문을 올렸다. 의료진은 기넥신과 오메가3를 같이 먹으면 출혈 위험이 다소 높아질 수 있고, 아로나민씨플러스와 멀티비타민은 성분이 겹쳐 하나만 고르는 게 안전하다고 답했다.
    feeling: null
    quote: 기존에 영양제를 … 먹고있는데 다 먹어도되나요?
    source: R14
  - id: E4
    when: 2024-05-28
    what_happened: 신경정신과 약·혈압약·고지혈증약·위장약 등 여러 약과 오메가3·비타민D·마그네슘·간·눈 영양제를 함께 먹는 사람이, 약국에서는 바빠서 이걸 다 봐 주지 않는다며 같이 먹어도 되는지 물었다.
    workaround: 약국 상담을 제대로 받지 못해 온라인 의료 상담 서비스에 질문을 올렸고, 닥터나우 AI의 참고용 답변을 받았다.
    feeling: null
    quote: 약국가서 이렇게 만을걸 상당 안해줘요 너무바빠서요
    source: R15
