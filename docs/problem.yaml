# 종이 문제정의 캔버스(2026-10-29, 팀 늘크크)와 팀 대화·멘토링 내용을 옮긴 기록입니다.
# 외부 수치는 sources에 적은, 실제로 연 자료의 표현과 표본을 그대로 옮겼습니다.
# 2026-10-29 학생 답(친구 사례, 화면 구성, 사진 등록, 분석 보고서, AI는 사진 인식에만, 복용량 직접 입력)을 반영했습니다.
# 괄호 안의 E·R 번호는 그 내용의 근거가 되는 experiences·sources 항목입니다.

# 한 문장: (② 고객)은 (① 상황)에서 (③ 근본 문제) 때문에 (④ 영향)을 겪는다. 지금은 (⑤ 현재 대안)으로 버티지만 (⑥ 단점)이 남는다.
statement: 건강해지려고 영양제를 챙겨 먹으면서 약도 함께 먹는 사람은, 매일 영양제와 약을 함께 먹을 때, 둘을 한자리에서 점검해 주는 사람도 도구도 없고 본인도 해로운 조합을 알기 어렵기 때문에, 약효가 떨어지거나 몸에 해로운 조합을 모른 채 먹다가 뒤늦게 알고 놀라고 불안해 영양제를 끊기도 한다. 지금은 SNS·약사·생성형 AI에 물어 버티지만, 잘못된 정보를 믿을 수 있고, 매번 묻기 번거롭고, 답이 부정확하거나 매번 달라지는 문제가 남는다.
canvas:
  context: 매일 영양제와 약을 함께 먹을 때. 영양제를 새로 시작하거나, 감기약·진통제를 사 먹거나, 병원에서 약을 새로 받을 때.
  customer: 건강해지려고 영양제를 챙겨 먹으면서 약(처방약·일반의약품)도 함께 먹는 사람.
  root_problem: 약과 영양제를 한자리에서 보는 사람이 없다. 의사·약사는 환자가 먹는 영양제를 모르고(R2), 약 점검 제도(DUR)에는 건강기능식품이 없다(R4). 복용자도 성분과 해로운 조합을 알기 어렵다(R1, E1).
  impact:
    feeling: 잘못 먹어 온 걸 알면 깜짝 놀라고, 앞으로 어떤 약과 영양제를 함께 먹어도 되는지 몰라 불안하다. 친구는 "그럼 어떤 영양제랑 약을 같이 먹어도 되는 거지..?"라고 말했다(E1). 건강해지려고 먹었는데 더 나빠지면 당혹스럽다.
    measurable: 친구는 무엇을 같이 먹어도 되는지 몰라 먹던 영양제를 끊었다(E1). 영양제를 먹는 사람은 86.1%지만 효능·부작용을 모두 안다는 응답은 15.3%뿐이다(R1). 일본 조사에서 약과 영양제를 함께 먹는 환자의 70.3%는 의사·약사에게 알리지 않았다(R2).
  alternatives:
    - how_used: 유튜브·SNS에서 찾아본다(E1).
      shortcoming: 비전문가 의견이라 잘못된 정보를 믿을 수 있다.
      why_ours: 모든 판정에 공식 자료 출처 링크가 붙는다.
    - how_used: 약사에게 하나하나 물어본다(E1).
      shortcoming: 영양제를 살 때마다 물어보기 번거롭다.
      why_ours: 한 번 등록해 두면 집에서 바로 분석 보고서로 확인된다.
    - how_used: 생성형 AI에게 물어본다.
      shortcoming: 틀린 정보를 사실처럼 말하고, 물을 때마다 답이 달라진다.
      why_ours: 팀이 만든 DB로만 판정해 같은 조합에는 항상 같은 답과 출처가 나온다.
personas:
  - id: P1
    description: 건강을 위해 영양제를 챙겨 먹고 약도 함께 먹지만, 영양제에 깊은 지식은 없는 사람
    source: 종이 캔버스 뒷면 P1
experiences:
  - id: E1
    when: 2026년 9월
    what_happened: 친구가 갑상선약과 칼슘, 철분 영양제 복용 시에 흡수 저하, 피로 상승이라는 SNS 글을 보고 실제로 약사를 찾아가 보니 건강에 해가 되는 게 맞았다.
    workaround: 약사를 찾아가 확인했고, 그 뒤 영양제를 끊었다.
    feeling: 깜짝 놀랐고, 앞으로 어떤 약과 영양제를 함께 먹어도 되는지 몰라 불안했다.
    quote: 그럼 어떤 영양제랑 약을 같이 먹어도 되는 거지..?
    source: 친구에게 들은 사례(팀원 본인 경험 아님)
  - id: E2
    when: null
    what_happened: 자료 조사 중, 갑상선약을 칼슘과 함께 먹으면 흡수가 줄어 시간을 띄워 먹어야 한다는 연구를 찾았다(R3).
    workaround: null
    feeling: null
    quote: null
    source: 팀 자료 조사(팀원 본인 경험 아님)
sources:
  - id: R1
    url: https://www.etoday.co.kr/news/view/2237180
    title: 영양제 복용하는 10명 중 8명 "효능‧부작용 잘 몰라" (이투데이, 2023, 인크루트 944명 설문)
    claim: 1종 이상 영양제를 먹는 응답자는 86.1%였고, '효능과 부작용까지 모두 알고 있다'는 응답자는 15.3%였다.
  - id: R2
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4425182/
    title: Concomitant Use of Dietary Supplements and Medicines in Patients due to Miscommunication with Physicians in Japan (Nutrients, 2015)
    claim: 일본 온라인 조사에서 약과 영양제를 함께 먹는 환자(1,508명)의 70.3%가 의사·약사에게 영양제 복용을 알리지 않았다.
  - id: R3
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3092723/
    title: Absorption of Levothyroxine When Coadministered with Various Calcium Formulations (Thyroid, 2011)
    claim: 건강한 성인 8명 연구에서 칼슘제를 레보티록신과 함께 먹으면 흡수가 약 20~25% 줄었다. 레보티록신은 칼슘제와 시간을 충분히 띄워 먹도록 안내해야 한다.
  - id: R4
    url: https://www.data.go.kr/data/15059486/openapi.do
    title: 식품의약품안전처_의약품안전사용서비스(DUR)품목정보 (공공데이터포털)
    claim: 의약품의 병용금기·연령금기 등 9가지 항목을 제공하며, 공개된 항목에 건강기능식품은 없다(팀 확인).
  - id: R5
    url: https://www.data.go.kr/data/15075057/openapi.do
    title: 식품의약품안전처_의약품개요정보(e약은요) (공공데이터포털)
    claim: 일반의약품마다 '이 약을 사용하는 동안 주의해야 할 약 또는 음식' 항목을 공식 문장으로 제공한다.
  - id: R6
    url: https://medlineplus.gov/druginfo/meds/a682461.html
    title: Levothyroxine (MedlinePlus, 미국 국립의학도서관)
    claim: 탄산칼슘이나 황산제일철(철분 보충제)을 먹는다면 레보티록신보다 최소 4시간 전이나 4시간 뒤에 먹으라고 안내한다.
  - id: R7
    url: https://medlineplus.gov/ency/article/002412.htm
    title: Calcium in diet (MedlinePlus Medical Encyclopedia)
    claim: 음식과 보충제를 합한 칼슘은 19~50세 성인은 하루 2,500mg, 50세 초과는 하루 2,000mg까지가 안전한 것으로 보인다. 오랫동안 많이 먹으면 일부 사람에게 신장결석 위험이 커진다.
  - id: R8
    url: https://medlineplus.gov/ency/article/002659.htm
    title: Iron overdose (MedlinePlus Medical Encyclopedia)
    claim: 철분은 많은 양을 먹으면 해로울 수 있고, 특히 어린이에게 위험하다. 과다 복용 2~5일 뒤 심한 간 손상이 생길 수 있다.
five_whys:
  symptom: 갑상선약과 칼슘, 철분 영양제를 먹던 친구가 흡수 저하, 피로 상승이라는 SNS 글을 보고 약사를 찾아가 보니 건강에 해가 되는 조합이 맞았다(E1).
  whys:
    # 종이 안내대로, 친구 사례에서 확인하지 못한 원인 끝에는 ?를 붙였습니다.
    - 갑상선약이 몸에 덜 흡수됐다?
    - 칼슘과 함께 먹으면 흡수가 약 20~25% 준다(R3).
    - 아침 식후에 약과 영양제를 한꺼번에 먹었다?
    - 약과 영양제를 다른 때에 따로 시작했다?
    - 둘을 함께 점검해 주는 사람이 없었다?
solution_paths:
  - path: 공식 자료와 논문으로 출처가 붙은 약·영양제 조합 DB(AI 위키)를 만들고, 사용자가 먹는 약과 영양제를 사진이나 검색으로 등록하면 '분석하기'에서 DB로 점검해 해로운 조합과 과다 복용을 보고서로 알려 준다.
    status: chosen
    reason: 공식 자료로만 판정해 정확하고 답이 일정하며, 집에서 바로 확인할 수 있다.
  - path: 약과 약 사이의 병용 금기까지 다룬다.
    status: rejected
    reason: 위험이 크고 처방 단계 DUR이 이미 점검한다. 점검 공백인 약+영양제만 다룬다.
  - path: 약·영양제 사진을 AI가 인식해 후보를 보여 주고, 복용자가 직접 골라 등록한다.
    status: chosen
    reason: 사진을 찍어 등록하는 것이 휴대폰에서 쓰기 편하다. AI는 사진 인식에만 쓰고, 과다 복용·함께 먹으면 안 좋은 성분 판단은 AI 위키(조합 DB)에서만 한다.
insight:
  claim: 상호작용 정보는 이미 공개되어 있지만(R5), 약 점검 제도에는 건강기능식품이 없고(R4) 환자 다수가 영양제 복용을 의사·약사에게 알리지 않아(R2), 약과 영양제를 함께 점검하는 곳이 없다.
  evidence: 환자 70.3%가 영양제 복용을 알리지 않고(R2), DUR에는 건강기능식품이 없다(R4). 갑상선약은 칼슘과 함께 먹으면 흡수가 줄어 시간을 띄워 먹으라고 하고(R3), 칼슘·철분 보충제와는 최소 4시간 띄우라고 안내한다(R6). 칼슘·철분은 너무 많이 먹어도 해롭다(R7, R8). 친구도 약사에게 묻고서야 알았고, 그 뒤 무엇을 같이 먹어도 되는지 몰라 영양제를 끊었다(E1).
  design_decision: 복용자가 약과 영양제를 등록하고 '분석하기'를 누르면, 함께 먹었을 때 해로운 성분과 한 가지를 너무 많이 먹는 경우를 출처와 함께 보고서로 알려 준다. 처방은 하지 않고, DB에 없는 조합도 "안전"이라 단정하지 않고 약사 상담을 권한다.
features:
  - id: F1
    name: 회원가입·로그인
    input: 이메일·비밀번호
    output: 복용자 계정이 만들어지고, 내 복용 목록이 계정에 저장된다
    done: 다시 로그인해도 등록한 약·영양제가 그대로 보인다.
  - id: F2
    name: 복용 목록에 약·영양제 등록·삭제
    input: 약·영양제 사진 또는 약 이름·영양제 성분 이름 검색, 하루 복용량
    output: 사진은 AI가 인식해 약·영양제 후보를 보여 주고, 복용자가 직접 고른 뒤 하루 복용량을 넣으면 내 목록에 추가된다. 검색으로도 같은 방법으로 추가된다. 목록에서 삭제할 수 있다
    done: 칼슘 영양제를 하루 복용량과 함께 등록하면 목록에 이름과 복용량이 생기고, 결과가 없으면 "찾는 제품이 없어요"가 보인다. 삭제하면 "등록된 약,영양제가 목록에서 삭제되었습니다."가 보이고 목록에서 사라진다.
  - id: F3
    name: 복용 중인 약·영양제 분석하기
    input: 내 목록에 등록된 약과 영양제, 하루 복용량
    output: AI 위키(조합 DB)로만 판정해, 함께 먹었을 때 해로운 성분 조합과, 같은 성분의 하루 복용량 합계가 DB의 하루 기준량을 넘는 경우가 이유·출처 링크·약사 상담 안내와 함께 보고서로 보인다. DB에 없으면 "확인한 자료에서는 보고된 문제가 없어요. 약사에게 확인하세요"가 보인다(R3, R5, R6, R7, R8, E1)
    done: 갑상선약과 칼슘을 등록하고 분석하기를 누르면 보고서에 경고, 4시간 띄워 먹으라는 안내, 출처 링크가 뜬다. 칼슘을 하루 2,500mg보다 많이 등록하면 과다 섭취 경고와 기준량·출처 링크가 뜬다. 기록 없는 조합에는 "안전"이라는 단정이 나오지 않는다.
  - id: F4
    name: 출처 확인된 조합 시드 데이터
    input: 저장소에 커밋한 시드 파일(조합, 설명, 출처 URL)
    output: 빈 DB에서 앱이 처음 뜰 때 시드가 자동으로 들어간다
    done: 빈 DB에서 docker compose up만 하고 F3 흐름을 따라가면 경고가 실제로 뜬다.
