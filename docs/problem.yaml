five_whys:
  symptom: 갑상선약과 칼슘, 철분 영양제를 먹던 친구가 흡수 저하, 피로 상승이라는 SNS 글을 보고 약사를 찾아가 보니 건강에 해가 되는 조합이 맞았다(E1).
  whys:
    # 종이 안내대로, 친구 사례에서 확인하지 못한 원인 끝에는 ?를 붙였습니다.
    - 갑상선약이 몸에 덜 흡수됐다?
    - 칼슘과 함께 먹으면 흡수가 약 20~25% 준다(R3).
    - 아침 식후에 약과 영양제를 한꺼번에 먹었다?
    - 약과 영양제를 다른 때에 따로 시작했다?
    - 둘을 함께 점검해 주는 사람이 없었다?
solution_paths:
  - path: 공식 자료와 논문으로 출처가 붙은 약·영양제 조합 DB(AI 위키)를 만들고, 사용자가 먹는 약과 영양제를 하루 복용량과 함께 등록해 두면, 새로 추가하는 순간 DB로 점검해 경고하고, '분석하기'에서 목록 전체의 해로운 조합과 과다 복용을 보고서로 알려 준다.
    status: chosen
    reason: 공식 자료·논문으로만 판정해 SNS보다 믿을 수 있고, DB로만 판정해 같은 조합엔 항상 같은 답이 나오며(AI와 다름), 한 번 등록하면 집에서 바로 확인할 수 있다(약사보다 편함). 목록을 기억하므로 위험이 생기는 '추가하는 순간'에 먼저 알려 줄 수 있다.
  - path: 약·영양제 사진을 AI가 인식해 후보를 보여 주고, 복용자가 직접 골라 등록한다.
    status: chosen
    reason: 사진을 찍어 등록하는 것이 휴대폰에서 쓰기 편하다. 인식이 틀리면 판정도 틀어지므로 AI는 후보만 보여 주고 복용자가 직접 고른 뒤 등록한다. 과다 복용·함께 먹으면 안 좋은 성분 판단은 AI 위키(조합 DB)에서만 한다. 사진 인식이 안 되면 검색으로 등록한다.
  - path: 범용 생성형 AI 챗봇이 DB 없이 그때그때 조합을 판정한다.
    status: rejected
    reason: 만들기는 가장 쉽지만 생성형 AI 대안의 문제(틀린 정보를 사실처럼 말함, 답이 매번 달라짐)를 그대로 반복한다. AI는 DB 자료 정리를 돕는 데만 쓰고, 판정은 사람이 출처를 확인한 DB로 한다.
  - path: 두 개를 골라 비교하는 조합 계산기(목록 저장 없음).
    status: rejected
    reason: 한 쌍씩만 확인되고 목록을 기억하지 못해 4~5개를 먹는 사람은 모든 짝을 직접 입력해야 하고, 새로 추가하는 순간에 먼저 알려 주지 못한다. 목록 등록과 추가 시 점검이 이를 포함한다.
  - path: 약과 약 사이의 병용 금기까지 다룬다.
    status: rejected
    reason: 위험이 크고 처방 단계 DUR이 이미 점검한다(R4). 점검 공백인 약+영양제만 다룬다.
  - path: 경고 결과를 들고 근처 약국·비대면 약사 상담으로 연결한다.
    status: deferred
    reason: 정확도는 가장 높지만 약사 섭외·운영이 해커톤 범위 밖이다. 대신 모든 경고에 약사·의사 상담 안내와 보여 줄 수 있는 근거 화면을 둔다.
  - path: "'시간을 띄워 드세요' 경고에 맞춘 복용 시간 알림."
    status: deferred
    reason: 경고를 행동으로 바꾸는 데 도움이 되지만, 먼저 '알게 하는' 핵심 가치를 검증한 뒤 붙인다.
  - path: 가족 목록 관리(부모님 목록을 자녀가 관리).
    status: deferred
    reason: 부모님 약을 챙기는 자녀라는 두 번째 대상에 맞는 기능이다. 실제 인터뷰로 수요를 확인한 뒤 결정한다.
insight:
  claim: 상호작용 정보는 이미 공개되어 있지만(R5), 약 점검 제도에는 건강기능식품이 없고(R4) 환자 다수가 영양제 복용을 의사·약사에게 알리지 않아(R2), 약과 영양제를 함께 점검하는 곳이 없다. 필요한 건 새로운 정보가 아니라 흩어진 정보를 내 조합에 대어 보는 자리다. 그리고 위험을 안 뒤에도 무엇을 하면 되는지 모르면 친구처럼 영양제를 끊어 버린다(E1). 그래서 경고만큼 '출처가 말하는 대처 방법'을 함께 보여 주는 것이 중요하다.
  evidence: 환자 70.3%가 영양제 복용을 알리지 않고(R2), DUR에는 건강기능식품이 없다(R4). 갑상선약은 칼슘과 함께 먹으면 흡수가 줄어 시간을 띄워 먹으라고 하고(R3), 칼슘·철분 보충제와는 최소 4시간 띄우라고 안내한다(R6). 칼슘·철분은 너무 많이 먹어도 해롭다(R7, R8). 친구도 약사에게 묻고서야 알았고, 그 뒤 무엇을 같이 먹어도 되는지 몰라 영양제를 끊었다(E1).
  design_decision: |-
    복용자가 약과 영양제를 하루 복용량과 함께 등록하면, 추가하는 순간과 '분석하기'에서 같은 판정 규칙으로 해로운 조합과 과다 복용을 출처와 함께 알려 준다.
    판정 규칙: (1) 새 항목의 성분 × 목록 모든 항목의 성분으로 짝을 전부 만들고((A,B)와 (B,A)는 같은 짝, 같은 제품 안 성분끼리는 비교 안 함) 조합 DB에서 찾는다. (2) 같은 성분의 하루 복용량 합계를 DB 기준량과 비교한다(출처에 기준량이 있는 성분만). (3) 찾은 기록은 '함께 먹지 마세요' → '시간을 띄워 드세요' → '과다 섭취' 순으로 모두 보여 준다. (4) 같은 목록이면 언제나 같은 결과(랜덤·AI 생성 없음).
    문구 규칙: 기록이 없으면 "확인한 자료에서는 보고된 문제가 없어요. 걱정되면 약사에게 확인하세요"라고만 하고 "안전해요", "문제없어요", "먹어도 돼요"는 쓰지 않는다. 숫자(시간·기준량)는 출처에 적힌 것만 보여 준다. 모든 경고에 "복용을 바꾸기 전에 약사·의사와 상담하세요"를 붙인다.
    경고 문장 순서: 무엇을 하면 되는지(출처에 있을 때, 예 "레보티록신과 최소 4시간 띄워 드세요") → 왜 그런지 → 출처. 성분 이름 옆에는 쉬운 이름을 붙인다(예 "레보티록신(갑상선약)").
    화면 규칙: 처음 보는 사람이 설명 없이 쓸 수 있게 한다. 아래 탭은 '홈'·'복용 목록'·'분석하기' 세 개로 고정하고, 화면마다 할 일 버튼은 하나만 크게 엄지가 닿는 아래쪽에 둔다. 본문 글자는 16px 이상, 여백을 넉넉히 두고, 경고는 색만이 아니라 아이콘과 글자로도 구분한다. 빈 목록·검색 실패·오류에는 다음에 누를 버튼을 함께 보여 준다.
    처방하지 않는다: 경고해도 막지 않고 '그래도 추가'·'취소'는 복용자가 고른다. 처방·진단·복용 중단 지시·용량 조언은 하지 않는다.
features:
  - id: F1
    name: 회원가입·로그인·로그아웃
    input: 이메일, 비밀번호(8자 이상), 가입할 때 비밀번호 확인
    output: 복용자 계정이 만들어지고 복용 목록이 그 계정에만 저장된다. 이미 가입한 이메일이면 "이미 가입한 이메일이에요", 틀린 이메일·비밀번호면 "이메일 또는 비밀번호가 맞지 않아요"가 보인다. 로그아웃하면 첫 화면으로 가고, 로그인 없이 복용 목록·분석하기에 들어가면 로그인 화면으로 간다.
    done: 다시 로그인해도 등록한 약·영양제와 하루 복용량이 그대로 보이고, 다른 계정에서는 보이지 않는다. 틀린 비밀번호로는 로그인되지 않는다.
  - id: F2
    name: 첫 화면 서비스 소개
    input: 로그인 없이 첫 화면 열기
    output: 서비스 이름, "약과 영양제를 함께 먹을 때 해로운 조합을 출처와 함께 알려 줘요", 사용 방법 3단계(등록한다 → 추가할 때 점검한다 → 경고와 출처를 확인한다), "이 서비스는 처방이나 진단을 하지 않아요. 복용을 바꾸기 전에 약사·의사와 상담하세요", '회원가입'·'로그인' 버튼이 보인다. 로그인 후 홈에는 '복용 목록'과 '분석하기' 두 칸이 있다.
    done: 첫 화면이 로그인 화면으로 넘어가지 않고 소개·안내·버튼이 보인다. 가입 직후 홈에 '복용 목록'·'분석하기'와 "먹고 있는 약이나 영양제를 추가해 보세요"가 보인다.
  - id: F3
    name: 검색으로 약·영양제 등록·삭제
    input: 약 이름·제품 이름·성분 이름·흔히 부르는 이름(예 갑상선약) 2글자 이상, 하루 복용량(숫자 + 단위 정·mg)
    output: 검색 결과가 최대 20개, 항목마다 이름·쉬운 이름·종류(약/영양제)·주요 성분과 함께 보이고(성분 이름을 몰라도 '갑상선약'으로 레보티록신을 찾는다), 고른 뒤 하루 복용량을 넣고 '등록'하면 F5 점검을 거쳐 목록에 추가된다. 2글자 미만이면 "2글자 이상 입력해 주세요", 결과가 없으면 "찾는 제품이 없어요. 성분 이름(예 칼슘)으로 검색해 보세요", 이미 목록에 있으면 "이미 내 목록에 있어요"가 보인다. 목록은 약 / 영양제 칸으로 나뉘어 이름·성분·하루 복용량이 보이고, '삭제'를 누르면 "삭제할까요?" 확인 뒤 지워진다.
    done: 칼슘을 하루 3000mg으로 등록하면 영양제 칸에 칼슘 3000mg이 생긴다. '갑상선약'으로 찾으면 레보티록신이 나온다. 없는 제품명을 찾으면 성분 이름 안내가 보인다. 삭제하면 "등록된 약,영양제가 목록에서 삭제되었습니다."가 보이고 목록과 분석 보고서에서 사라진다.
  - id: F4
    name: 사진으로 약·영양제 등록
    input: 약 봉투·약 상자·영양제 성분표 사진, 하루 복용량
    output: AI가 사진을 인식해 약·영양제 후보를 보여 주고, 복용자가 후보 중 하나를 직접 고른 뒤 하루 복용량을 넣고 '등록'하면 F5 점검을 거쳐 목록에 추가된다. 고르기 전에는 등록되지 않는다. 인식하지 못하면 "사진에서 찾지 못했어요. 이름으로 검색해 보세요"와 '검색으로 등록'이 보인다.
    done: 갑상선약 사진을 올리면 후보에 레보티록신이 보이고, 고르고 1정을 넣어 등록하면 약 칸에 레보티록신 1정이 생긴다.
  - id: F5
    name: 추가할 때 점검
    input: 검색이나 사진으로 항목 하나를 등록하는 순간의 새 항목·하루 복용량과 기존 목록
    output: insight의 판정 규칙대로 점검한다. 기록이 있으면 경고 창 맨 위에 단계("함께 먹지 마세요" / "시간을 띄워 드세요" / "하루 기준량을 넘어요")와 출처에 있을 때만 대처 방법("레보티록신과 최소 4시간 띄워 드세요")이 크게 보이고, 그 아래 조합("레보티록신(갑상선약) ↔ 철분"), 이유, 출처 제목, "복용을 바꾸기 전에 약사·의사와 상담하세요", '자세히'·'그래도 추가'·'취소'가 보인다. '취소'하면 등록되지 않는다. 기록이 없으면 "확인한 자료에서는 보고된 문제가 없어요. 걱정되면 약사에게 확인하세요"와 함께 바로 등록된다. 점검이 실패하면 "지금은 점검할 수 없어요. 잠시 뒤 다시 시도하세요"가 보이고 등록하지 않는다. 성분 정보가 없는 항목은 등록되지만 "성분 정보가 없어 점검하지 못했어요"가 보인다.
    done: 레보티록신이 있는 목록에 철분을 등록하면 "시간을 띄워 드세요", 최소 4시간 안내, 출처 MedlinePlus(R6)가 보이고, 두 번 해도 같은 경고가 나온다. '취소'하면 목록에 철분이 없다. 기록 없는 조합에는 "안전"이라는 단정이 나오지 않는다.
  - id: F6
    name: 복용 중인 약·영양제 분석하기
    input: 내 목록에 등록된 약과 영양제, 하루 복용량
    output: AI 위키(조합 DB)로만 판정해, 목록 전체에서 함께 먹었을 때 해로운 성분 조합과 같은 성분의 하루 복용량 합계가 DB 기준량을 넘는 경우를 "주의할 항목 N개"와 함께 이유·출처 링크·약사 상담 안내·'자세히'가 있는 보고서로 보여 준다. 하나도 없으면 "확인한 자료에서는 보고된 문제가 없어요. 걱정되면 약사에게 확인하세요"가 보인다(R3, R5, R6, R7, R8, E1).
    done: 갑상선약과 칼슘이 등록된 목록에서 분석하기를 누르면 보고서에 경고, 최소 4시간 띄워 먹으라는 안내, 출처 링크가 뜬다. 칼슘을 하루 2,500mg보다 많이 등록하면 과다 섭취 경고와 기준량·출처 링크가 뜬다. 같은 목록으로 다시 분석해도 결과가 같다. 기록 없는 조합에는 "안전"이라는 단정이 나오지 않는다.
  - id: F7
    name: 근거 보기(조합 상세)
    input: 경고 창이나 분석 보고서의 '자세히'
    output: 두 성분(또는 과다 섭취 성분), 단계, 이유, 복용 안내, 출처 목록(제목·자료 종류 공식 자료/논문·연구 조건·링크), DB 확인 날짜가 보이고 '출처 보기'는 새 창으로 열린다. 약사에게 그대로 보여 줄 수 있는 화면이다.
    done: 레보티록신 ↔ 칼슘 상세에 R3 제목·"논문"·"건강한 성인 8명 연구"와 R6 "공식 자료"·"최소 4시간"이 보이고, 링크가 각각 PMC·MedlinePlus 원문이다.
  - id: F8
    name: 출처 확인된 시드 데이터
    input: 저장소에 커밋한 시드 파일(약·영양제와 성분, 조합·하루 기준량과 이유·출처 URL·자료 종류·연구 조건·확인 날짜, 시드 계정)
    output: 빈 DB에서 앱이 처음 뜰 때 시드가 자동으로 들어간다. 출처 URL이 없는 조합·기준량은 들어가지 못한다. 시드 조합은 레보티록신 ↔ 칼슘(R3, R6), 레보티록신 ↔ 철분(R6), 칼슘 하루 기준량(R7)이고, e약은요(R5) 문장에서 원문·URL을 확인한 조합을 더한다. 복용자 시드 계정 목록에는 레보티록신 하루 1정과 칼슘 하루 1000mg이 들어 있다.
    done: 빈 DB에서 docker compose up만 하고 복용자 계정으로 분석하기를 누르면 레보티록신 ↔ 칼슘 경고가 실제로 뜬다. 모든 조합·기준량에 출처 URL이 있다.
