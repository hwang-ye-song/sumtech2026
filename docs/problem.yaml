# 종이 문제정의 캔버스(2026-10-29, 팀 늘크크)와 팀 대화·멘토링 내용을 옮긴 기록입니다.
# 외부 수치는 sources에 적은, 실제로 연 자료의 표현과 표본을 그대로 옮겼습니다.
# 2026-10-29 학생 답(친구 사례, 화면 구성, 사진 등록, 분석 보고서, AI는 사진 인식에만, 복용량 직접 입력)을 반영했습니다.
# 2026-10-29 팀 기획서(해법 경로·기능 명세·사용자 흐름)를 합쳤습니다: 검토한 해법 경로, 추가할 때 점검, 판정·문구 규칙, 근거 보기, 예외 처리.
# 괄호 안의 E·R 번호는 그 내용의 근거가 되는 experiences·sources 항목입니다.

# 한 문장: (② 고객)은 (① 상황)에서 (③ 근본 문제) 때문에 (④ 영향)을 겪는다. 지금은 (⑤ 현재 대안)으로 버티지만 (⑥ 단점)이 남는다.
statement: 건강해지려고 영양제를 챙겨 먹으면서 약도 함께 먹는 사람은, 매일 영양제와 약을 함께 먹을 때, 둘을 한자리에서 점검해 주는 사람도 도구도 없고 본인도 해로운 조합을 알기 어렵기 때문에, 약효가 떨어지거나 몸에 해로운 조합을 모른 채 먹다가 뒤늦게 알고 놀라고 불안해 영양제를 끊기도 한다. 지금은 SNS·약사·생성형 AI에 물어 버티지만, 잘못된 정보를 믿을 수 있고, 매번 묻기 번거롭고, 답이 부정확하거나 매번 달라지는 문제가 남는다.
canvas:
  context: 매일 영양제와 약을 함께 먹을 때. 영양제를 새로 시작하거나, 감기약·진통제를 사 먹거나, 병원에서 약을 새로 받을 때.
  customer: 건강해지려고 영양제를 챙겨 먹으면서 약(처방약·일반의약품)도 함께 먹는 사람.
  root_problem: 약과 영양제를 한자리에서 보는 사람이 없다. 의사·약사는 환자가 먹는 영양제를 모르고(R2), 약 점검 제도(DUR)에는 건강기능식품이 없다(R4). 복용자도 성분과 해로운 조합을 알기 어렵다(R1, E1).
  impact:
    feeling: 잘못 먹어 온 걸 알면 깜짝 놀라고, 앞으로 어떤 약과 영양제를 함께 먹어도 되는지 몰라 불안하다. 친구는 "그럼 어떤 영양제랑 약을 같이 먹어도 되는 거지..?"라고 말했다(E1). 건강해지려고 먹었는데 더 나빠지면 당혹스럽다.
    measurable: 친구는 무엇을 같이 먹어도 되는지 몰라 먹던 영양제를 끊었다(E1). 영양제를 먹는 사람은 86.1%지만 효능·부작용을 모두 안다는 응답은 15.3%뿐이다(R1). 일본 조사에서 약과 영양제를 함께 먹는 환자의 70.3%는 의사·약사에게 알리지 않았다(R2).
  alternatives:
    - how_used: 유튜브·SNS에서 찾아본다(E1).
      shortcoming: 비전문가 의견이라 잘못된 정보를 믿을 수 있다.
      why_ours: 모든 판정에 공식 자료·논문 출처 링크와 연구 조건이 붙고, 출처 없는 조합은 DB에 들어가지 못한다.
    - how_used: 약사에게 하나하나 물어본다(E1).
      shortcoming: 영양제를 살 때마다 물어보기 번거롭다.
      why_ours: 한 번 등록해 두면 새로 추가할 때마다 자동으로 점검되고, 집에서 바로 분석 보고서로 확인된다. 약사에게 보여 줄 근거 화면도 있다.
    - how_used: 생성형 AI에게 물어본다.
      shortcoming: 틀린 정보를 사실처럼 말하고, 물을 때마다 답이 달라진다.
      why_ours: 팀이 만든 DB로만 판정해 같은 조합에는 항상 같은 답과 출처가 나온다.
personas:
  - id: P1
    description: 건강을 위해 영양제를 챙겨 먹고 약도 함께 먹지만, 영양제에 깊은 지식은 없는 사람
    source: 종이 캔버스 뒷면 P1
experiences:
  - id: E1
    when: 2026년 9월
    what_happened: 친구가 갑상선약과 칼슘, 철분 영양제 복용 시에 흡수 저하, 피로 상승이라는 SNS 글을 보고 실제로 약사를 찾아가 보니 건강에 해가 되는 게 맞았다.
    workaround: 약사를 찾아가 확인했고, 그 뒤 영양제를 끊었다.
    feeling: 깜짝 놀랐고, 앞으로 어떤 약과 영양제를 함께 먹어도 되는지 몰라 불안했다.
    quote: 그럼 어떤 영양제랑 약을 같이 먹어도 되는 거지..?
    source: 친구에게 들은 사례(팀원 본인 경험 아님)
  - id: E2
    when: null
    what_happened: 자료 조사 중, 갑상선약을 칼슘과 함께 먹으면 흡수가 줄어 시간을 띄워 먹어야 한다는 연구를 찾았다(R3).
    workaround: null
    feeling: null
    quote: null
    source: 팀 자료 조사(팀원 본인 경험 아님)
sources:
  - id: R1
    url: https://www.etoday.co.kr/news/view/2237180
    title: 영양제 복용하는 10명 중 8명 "효능‧부작용 잘 몰라" (이투데이, 2023, 인크루트 944명 설문)
    claim: 1종 이상 영양제를 먹는 응답자는 86.1%였고, '효능과 부작용까지 모두 알고 있다'는 응답자는 15.3%였다.
  - id: R2
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4425182/
    title: Concomitant Use of Dietary Supplements and Medicines in Patients due to Miscommunication with Physicians in Japan (Nutrients, 2015)
    claim: 일본 온라인 조사에서 약과 영양제를 함께 먹는 환자(1,508명)의 70.3%가 의사·약사에게 영양제 복용을 알리지 않았다.
  - id: R3
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3092723/
    title: Absorption of Levothyroxine When Coadministered with Various Calcium Formulations (Thyroid, 2011)
    claim: 건강한 성인 8명 연구에서 칼슘제를 레보티록신과 함께 먹으면 흡수가 약 20~25% 줄었다. 레보티록신은 칼슘제와 시간을 충분히 띄워 먹도록 안내해야 한다.
