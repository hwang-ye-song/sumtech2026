five_whys:
  symptom: 약과 영양제를 밥 먹고 한꺼번에 먹는다. 아무도 확인하지 않는다(E2, E18).
  whys:
    - 왜 확인하지 않나? 영양제는 약이 아니라고 생각해서 병원에서 말하지 않는다(E19, R2).
    - 왜 병원·약국에서도 안 걸러지나? 먹는 약만 묻는다(E15). DUR에는 영양제가 없다(R5).
    - 왜 가족도 못 챙기나? 영양제는 따로 사고(E15, R4), 자녀는 부모님 약을 모른다(E17).
    - 왜 찾아봐도 모르나? 설명서에 성분 이름으로만 적혀 있어서 직접 맞춰 봐야 한다(E3, R7).
    - 왜 반복되나? 약과 영양제가 다른 때, 다른 곳에서 더해진다. 둘을 한곳에 모아 맞춰 볼 곳이 없다.

solution_paths:
  - path: |-
      약과 영양제를 한 목록에 모은다. 새로 더할 때마다 목록 전체와 맞춰 본다.
      약×영양제, 영양제×영양제, 하루 기준량을 본다. 걸리면 원문과 출처를 보여 준다.
      판정은 원문을 확인한 DB로만 한다. 이름을 모르면 약 상자 사진으로 찾는다.
    status: chosen
    reason: |-
      하나 늘 때마다 설명서를 맞춰 보는 수고를 덜고 싶었다(E3).
      처방약 3개에 영양제 9개를 먹는 사람도 있어서(E10) 두 개 비교가 아니라 목록 저장으로 정했다.
      부모님은 이름을 기억 못 하셔서(E20) 사진 등록을 넣었다. 식약처도 영양제끼리 겹치지 않게 하라고 해서(R18) 영양제끼리도 본다.
  - path: 설문으로 비타민을 추천한다. 후보는 출처 있는 DB 안에서만 고르고, 내 목록과 부딪히는 성분은 경고로 돌린다.
    status: chosen
    reason: 광고마다 다 좋다고 해서 고르기 어렵다는 말을 들었다(E16). AI는 DB 후보 안에서 고르기만 한다.
  - path: 생성형 AI가 조합을 직접 판정한다.
    status: rejected
    reason: 답이 애매하고 물을 때마다 달라질 수 있다(E1, E16). AI는 사진 글자 읽기와 추천 후보 고르기에만 쓴다.
  - path: 약끼리 조합까지 점검한다.
    status: rejected
    reason: 약끼리는 DUR이 이미 본다(R5). 우리는 영양제 쪽에 집중한다.
  - path: 특정 영양제 제품을 추천한다.
    status: deferred
    reason: 제품 데이터가 부족하고, 고를 기준도 아직 없다. 잘못 사게 될 수 있어서 지금은 성분까지만 추천한다.
  - path: 부모님과 자녀가 한 목록을 같이 보는 가족 그룹.
    status: deferred
    reason: 누가 무엇을 고칠지, 개인정보를 어떻게 다룰지 먼저 정해야 한다. 지금은 자녀가 부모님 것을 자기 목록에 넣어 본다.

insight:
  claim: |-
    사람들은 약과 영양제를 따로 사고 따로 챙긴다. 그래서 같이 확인할 계기가 없다.
    확인하려 해도 근거 있는 답을 얻기 어렵다. 새로 하나 생기면 처음부터 다시 해야 한다.
  evidence: |-
    아버지는 병원에서 영양제를 말하지 않는다(E19). 어머니는 확인 없이 한꺼번에 드신다(E18). 자녀는 부모님 약을 모른 채 사 드렸다(E17).
    확인한 사람도 AI의 애매한 답에서 멈췄다(E1, E16). 설명서의 칼슘염 문구가 내 영양제에 해당하는지 몰랐다(E3, R7).
    일본 조사에서도 70.3%가 의사·약사에게 말하지 않았다(R2).
  design_decision: |-
    한 번 등록하면, 더할 때마다 알아서 점검하는 복용 목록을 만든다.
    경고에는 원문 문장과 출처 링크를 붙인다. 판정은 출처를 확인한 DB로만 한다.
    AI는 사진 글자 읽기와 추천 후보 고르기에만 쓴다. 자료에 없다고 "괜찮다"고 단정하지 않는다.
    만들지 않는 것: 약끼리 점검(DUR이 본다), 처방·복용 지시, 특정 제품 추천, 가족 그룹(다음 버전).

features:
  - id: F1
    name: 회원가입·로그인
    input: 이메일, 비밀번호(8자 이상), 비밀번호 확인
    output: 계정이 생기고 홈으로 간다. 홈에는 '복용 목록'·'검진하기'와 '영양제 추천받기' 버튼이 있다. 목록은 계정마다 따로 저장된다. 로그인 화면에서 시연 계정으로 바로 들어갈 수도 있다.
    done: 가입하면 홈에 '복용 목록'·'검진하기'·'영양제 추천받기'가 보인다. 다시 로그인해도 목록이 그대로다. 다른 사람 목록은 볼 수 없다. 이메일 형식이 틀리거나, 비밀번호가 8자 미만이거나, 확인이 다르면 가입되지 않고 이유가 보인다.
  - id: F2
    name: 약·영양제 등록(검색·사진)
    input: 제품 이름, '갑상선약' 같은 흔한 이름, 성분 이름으로 검색해 고르기. 또는 약 상자·봉투 사진. '하루에 먹는 개수'(필수), '한 알 함량'(mg, 선택).
    output: 목록에 약과 영양제가 나뉘어 저장된다. 사진은 AI가 글자를 읽고 DB에서 후보를 찾는다. 사진은 읽은 뒤 바로 지우고 저장하지 않는다.
    done: |-
      '비맥스'를 검색해 비맥스제트정을 하루 1개로 등록하면 목록에 생긴다.
      '삭제' → '삭제할까요?' 창에서 '삭제'를 누르면 사라진다.
      이미 있는 항목은 다시 넣지 않고 알려 준다. 찾는 제품이 없으면 성분 이름으로 찾으라고 안내한다.
      사진은 '동의하고 찍기'를 누르기 전엔 보내지 않는다. 흐린 사진에는 "사진이 흐려서 읽지 못했어요. 다시 찍어 주세요"가 뜬다. 사진 후보는 사람이 골라야 등록된다.
  - id: F3
    name: 더할 때 자동 점검
    input: 새로 등록하려는 약·영양제와 지금 내 목록
    output: |-
      첫 검진 뒤부터는 '등록'을 누를 때마다 목록 전체와 맞춰 본다. 걸리면 목록에 넣기 전에 경고 창이 뜬다.
      경고 창에는 할 일("함께 먹지 마세요", "시간을 띄워 드세요" 등), 원문 문장, 출처, 약사에게 물을 질문, '자세히'·'그래도 추가'·'취소'가 있다.
      처음 등록할 때는 경고 없이 넣고, 점검은 '검진하기'에서 한 번에 한다.
    done: |-
      칼슘이 있는 목록에 비맥스제트정을 더하면 "함께 먹지 마세요"와 식약처 원문이 출처와 함께 뜬다. '취소'하면 목록에 안 들어간다.
      레보티록신이 있는 목록에 철분을 더하면 "레보티록신과 최소 4시간 띄워 드세요"가 뜬다.
      같은 두 항목의 근거가 여럿이면 경고 하나로 합치고 출처를 모은다.
      걸리는 게 없으면 "확인한 자료에서는 보고된 문제가 없어요. 걱정되면 약사에게 확인하세요"가 뜬다.
      같은 목록은 몇 번을 점검해도 결과가 같다.
  - id: F4
    name: 검진하기와 리포트
    input: 홈이나 아래 탭에서 '검진하기' → '검진 시작'
    output: 목록 전체를 점검한 리포트가 나온다. 주의할 항목 수, 조합별 경고와 할 일, 하루 기준량을 넘는 성분, 먹는 약·영양제 표, 약사에게 물을 질문, 출처 모음이 있다. '자세히'를 누르면 원문, 링크, DB 확인 날짜가 보인다.
    done: |-
      레보티록신과 칼슘이 있는 목록을 검진하면 "주의할 항목 1개"와 "레보티록신과 최소 4시간 띄워 드세요"가 보인다. '자세히'에서 논문과 MedlinePlus 링크가 열린다.
      칼슘을 하루 2알, 한 알 1500mg으로 넣으면 "하루 기준량을 넘어요"와 출처의 기준량이 보인다.
      처방·진단이 아니라는 안내와 약사 상담 안내가 같이 보인다.
  - id: F5
    name: 영양제 추천
    input: 좋아지고 싶은 부분(피로·눈·뼈·피부·면역 중 하나 이상), 하루에 먹을 알 수(1~3알)
    output: 알 수만큼 비타민을 추천한다. 이유와 식약처 기능성 출처를 붙인다. 후보는 출처 있는 DB 안에서만 고른다. 내 목록과 부딪히는 성분은 빼고 '주의' 칸에 경고로 보여 준다. 제품명과 구매 링크는 없다. AI 키가 없으면 설문과 기능성이 맞는 후보로 고른다.
    done: |-
      레보티록신과 칼슘을 먹는 사람이 '피로'와 '1알'을 고르면 비타민 1개가 이유·출처와 함께 나온다. 철분은 '주의' 칸에 경고로 나온다.
      "이 추천은 진단이나 처방이 아니에요. 새로 드시기 전에 약사·의사와 상담하세요"가 보인다.
  - id: F6
    name: 약·영양제 알아보기
    input: 로그인 없이 성분이나 약 이름으로 찾기
    output: 그 성분이나 약에 DB로 기록된 조합 주의사항과 출처
    done: 로그인하지 않아도 상단 메뉴의 '약·영양제 알아보기'가 열린다. 칼슘을 찾으면 칼슘이 걸리는 조합과 출처 링크가 보인다. 처방·진단이 아니라는 안내가 보인다.
