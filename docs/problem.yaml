five_whys:
  symptom: 비타민제와 오메가3·칼슘 제품을 함께 먹으려던 사용자가, 설명서의 칼슘염 병용 금지 문구를 보고도 같이 먹어도 되는지 판단하지 못했다(E1).
  whys:
    - 왜 판단하지 못했나? 경고는 약 설명서에 "칼슘염" 같은 성분 이름으로만 적혀 있고, 내 영양제 중 무엇이 거기 해당하는지 같이 맞춰 봐 줄 사람이 없었다(R7, E1).
    - 왜 맞춰 봐 줄 사람이 없나? 영양제는 대부분 약국 밖에서 사서, 살 때 옆에 약사가 없다(R4).
    - 왜 산 뒤에도 묻지 않나? 영양제를 그냥 음식으로 여겨 의사·약사에게 말하지 않고, 의사·약사도 묻지 않는다(R2).
    - 왜 병원에서도 걸러지지 않나? 처방 점검(DUR)은 약끼리만 보고, 의료 현장은 영양제 섭취를 알아도 약물 사용에 고려하지 않는다(R5, R8).
    - 그래서 약과 영양제가 서로 다른 곳에서 따로 들어오는데, 둘을 같이 보는 사람이 구조적으로 없다. 남는 건 출처를 밝히지 않는 AI·앱의 답뿐이다(E1, R10). 경고를 직접 본 E1도 판단하지 못했으니, 설명서를 읽지 않는 부모님은 경고가 있다는 것조차 모른다.
solution_paths:
  - path: |-
      식약처 원문(R6, R7)과 논문(R3)에서 '약×영양제' 위험 조합을 뽑아, 원문 문장과 대조해 확인된 것만 출처와 함께 DB에 넣는다.
      사용자가 먹는 약(처방약은 성분 이름)과 영양제를 한 목록에 등록하면, 추가할 때마다 서로 맞춰 보고 원문 인용·해야 할 행동·약사에게 물을 질문을 함께 보여 준다.
      결과는 약사·의사에게 보여 줄 복용 리포트로 정리한다. 자녀와 부모님은 참여 코드로 같은 가족 그룹에 들어와 한 목록을 함께 본다.
    status: chosen
    reason: 근본 원인을 하나씩 푼다. 따로 들어오던 약과 영양제를 가족이 함께 보는 한 목록에 모으고(F2·F6), 흩어진 경고는 그 목록에서 맞춰 보고(F3), 판단하지 못하는 사용자에게는 원문이 말하는 행동과 약사에게 물을 질문을 주며(F3), 말하지 않는 문제는 리포트로 대화를 열고(F4), 출처 없는 답 대신 원문 근거로만 판정한다(F5).
  - path: 영양제끼리 부딪치는 조합도 점검한다. 칼슘과 철분처럼 출처가 있는 조합만 DB에 넣는다.
    status: chosen
    reason: 영양제는 다 좋다는 믿음 때문에 생기는 문제는 영양제끼리 먹을 때도 같다. 칼슘은 철분 흡수를 막는다는 연구(R11)와 전문의 발언(R12)이 있다. 다만 영양제끼리 조합은 식약처 공식 문장이 약만큼 정리돼 있지 않아, 출처를 확인한 조합만 넣는다.
  - path: 약과 약 사이의 병용 금기까지 다룬다.
    status: rejected
    reason: 약끼리 조합은 처방 단계 DUR이 이미 점검하고(R5) 잘못 안내하면 위험이 크다. 아무도 점검하지 않는 약+영양제 조합에만 집중한다.
  - path: 영양제 회사의 후원을 받거나, 사용자의 약과 부딪치지 않는 영양제의 판매 사이트를 연결해 수수료를 받아 운영한다. 후원사·판매 제품은 사용자의 약과 좋은 조합일 때만 보여 주고, 나쁜 조합이면 그 제품이라도 그대로 경고한다.
    status: deferred
    reason: 운영비를 마련할 수 있고, 판매 사이트 연결은 "이 영양제는 부모님 약과 괜찮다"를 확인한 뒤 바로 살 수 있게 해 준다. 하지만 사용자가 이미 필요 없는 영양제 광고에 지쳐 있고(대안 A2), 영양제 추천 광고는 규제를 확인해야 한다는 멘토 의견이 있었다. 규제를 확인한 뒤 다시 정한다.
  - path: 약 봉투나 영양제 통을 사진으로 찍으면 자동으로 목록에 등록한다.
    status: deferred
    reason: 성분표를 읽기 어려운 부모님(P1)에게는 처음 등록이 가장 큰 벽이라 꼭 필요하다. 다만 대회 시간 안에 정확도를 확인하기 어려워, 이번에는 검색 등록으로 하고 다음 버전에서 고도화한다.
  - path: 약과 영양제를 띄워 먹어야 할 때 복용 시간을 알려 준다.
    status: deferred
    reason: 갑상선약과 칼슘처럼 "띄워 먹으라"는 조합(R3)은 시간 안내가 있어야 실제 행동으로 이어진다. 먼저 경고와 리포트를 완성한 뒤 다음 버전에서 고도화한다.
  - path: 나이·질환·알레르기 같은 개인 건강 정보를 반영해 점검한다.
    status: deferred
    reason: 이번에는 약과 함께 먹을 때 생기는 문제에만 집중하기로 했다. 개인 건강 정보는 민감 정보라 다루는 기준도 따로 정해야 해서 다음 버전에서 고도화한다.
insight:
  claim: |-
    정보가 없는 게 아니다. 흔한 비타민제 설명서에도 이미 "칼슘염과 함께 복용하지 마십시오"라고 적혀 있다(R7).
    그런데 사람들은 영양제는 다 좋다고 믿어서 그 경고를 찾아볼 생각조차 하지 않는다. 부모님께 영양제를 사 드리는 자녀조차 복용 시간만 묻고, 부모님 약과 같이 드셔도 되는지는 묻지 않는다(E2).
  evidence: 자주 쓰는 일반의약품 58개 중 12개에 영양제 성분 병용 경고가 있었다(R6, R7). 영양제를 먹는 사람 86.1% 중 부작용까지 아는 사람은 15.3%이고(R1), 환자 70.3%는 영양제를 음식으로 여겨 말하지 않는다(R2). 경고를 직접 본 사람도 판단하지 못해 AI에 물었고(E1), 실제로 처방약과 영양제가 부딪치는 조합도 나왔다(E3).
  design_decision: |-
    사람이 묻길 기다리지 않는다. 약이나 영양제를 목록에 더하는 순간 경고가 먼저 뜨게 한다(F2·F3).
    새 정보를 지어내지 않고, 이미 있는 공식 경고와 논문을 '내 복용 목록'에 연결한다(F5). 경고만 띄우지 않고 원문이 말하는 행동과 약사에게 물을 질문까지 주며, 그 질문은 리포트에 모아 약사와의 대화를 연다(F3·F4).
    처방·복용 지시는 하지 않는다. DB에 없는 조합도 "안전"이라 단정하지 않는다. 약끼리 조합은 다루지 않는다.
features:
  - id: F1
    name: 회원가입·로그인 (근거 — 한 번 등록한 목록을 계속 써야 약사에게 매번 묻지 않아도 된다 E4)
    input: 이메일·비밀번호
    output: 계정이 만들어지고, 처음 가입하면 내 이름의 가족 그룹이 하나 자동으로 생긴다
    done: 다시 로그인해도 등록한 약·영양제가 그대로 보인다. 로그인하지 않고 복용 목록을 열면 로그인 화면으로 안내된다. 비밀번호가 틀리면 로그인되지 않고 이유가 보인다.
  - id: F2
    name: 가족 목록에 약·영양제 등록 (근거 — 약은 병원에서, 영양제는 자녀·인터넷에서 따로 들어온다 R4, 경고가 설명서마다 흩어져 있다 R7, e약은요에는 처방약이 없다 R6)
    input: 일반의약품 제품 이름 일부, 처방약 성분 이름(예 레보티록신), 영양제 성분 이름(칼슘, 철분, 오메가3 등)
    output: 일반의약품은 제품과 주성분, 처방약과 영양제는 성분으로 찾아지고, 고르면 지금 고른 가족 그룹의 목록에 추가되며 삭제하면 빠진다
    done: 비맥스를 검색하면 비맥스제트정이 보이고 추가하면 목록에 생긴다. 레보티록신을 검색해 추가할 수 있다. 결과가 없으면 "찾는 제품이 없어요"가 보인다.
  - id: F3
    name: 더하는 순간 조합 점검 — 약×영양제, 영양제×영양제 (근거 — 영양제는 다 좋다고 믿어 묻지 않는다 R2·E2, 경고를 보고도 판단하지 못했다 E1)
    input: 가족 목록에 약이나 영양제 하나 추가
    output: |-
      위험 조합이면 어떤 성분끼리인지, 근거 원문 문장과 출처 링크, 원문이 말하는 행동(함께 먹지 말 것·시간 띄우기·상의할 것), 약사에게 물을 질문 한 줄이 담긴 경고가 묻지 않아도 먼저 뜬다.
      DB에 없는 조합이면 "확인한 자료에서는 보고된 문제가 없어요. 약사에게 확인하세요"가 뜬다.
    done: 비맥스제트정이 있는 목록에 칼슘을 추가하면 "칼슘염… 함께 복용하지 마십시오" 원문, 출처 링크, 약사에게 물을 질문이 뜬다. 레보티록신과 칼슘이면 흡수 감소 경고와 R3 링크가, 칼슘과 철분이면 철분 흡수 방해 경고와 R11 링크가 뜬다. 같은 조합은 몇 번을 해도 같은 경고가 뜨고, 기록 없는 조합에는 "안전"이라는 단정이 나오지 않는다.
  - id: F4
    name: 약사·의사에게 보여 줄 복용 리포트 (근거 — 환자 70.3%가 영양제를 말하지 않는다 R2, 약국은 바빠서 다 봐 주지 못한다 E4)
    input: 가족 목록
    output: 먹는 약과 영양제 전체, 조심할 조합과 원문 출처, F3에서 나온 약사에게 물을 질문을 한 화면에 모아 보여 준다
    done: 위험 조합이 있는 목록에서 리포트를 열면 맨 위에 그 조합·출처·질문이 보이고, 아래에 복용 중인 약·영양제가 모두 보인다.
  - id: F5
    name: 원문 근거 조합 DB 시드 (근거 — 출처 없는 SNS·AI·앱 답 대신 고정된 공식 근거)
    input: 식약처 e약은요 원문(R6, R7)과 논문(R3, R11)에서 뽑아 원문 문장과 대조한 뒤 저장소에 커밋한 시드 파일(성분, 상대 성분, 원문 문장, 해야 할 행동, 출처 URL)
    output: 빈 DB에서 앱이 처음 뜰 때 시드가 자동으로 들어간다
    done: 빈 DB에서 docker compose up만 하고 F3 흐름을 따라가면 경고가 실제로 뜬다. 시드의 모든 규칙에 원문 문장과 열리는 출처 URL이 있다.
  - id: F6
    name: 참여 코드로 들어오는 가족 그룹 (근거 — 영양제를 사 드리는 자녀는 부모님 약을 모르고 E2, 약과 영양제를 같이 보는 사람이 없다)
    input: 그룹을 만들 때는 그룹 이름, 들어올 때는 6자리 참여 코드
    output: 그룹을 만들면 참여 코드가 나온다. 코드를 입력한 사람은 그 그룹 멤버가 되어 그룹의 복용 목록을 함께 보고 약·영양제를 더하거나 뺄 수 있다. 여러 그룹에 속하면 목록 화면에서 그룹을 골라 본다.
    done: 자녀가 "우리 가족" 그룹을 만들어 코드를 받고, 부모가 그 코드를 입력하면 둘 다 같은 목록이 보인다. 자녀가 칼슘을 더하면 부모 화면에서도 칼슘과 경고가 보인다. 틀린 코드면 "없는 코드예요"가 보이고 그룹에 들어가지지 않는다. 그룹 멤버가 아닌 사람은 그 목록을 볼 수 없다.
