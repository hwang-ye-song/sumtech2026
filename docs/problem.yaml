# 종이 문제정의 캔버스(2026-10-29, 팀 늘크크)와 팀 대화·멘토링·자료 조사·팀원 인터뷰를 옮긴 기록입니다.
# 외부 수치와 인용은 sources·experiences에 적은, 실제로 열어 확인한 자료의 표현과 표본을 그대로 옮겼습니다.
# 2026-10-29 두 팀원의 문제정의를 하나로 합쳤습니다. 팀 결정: 고객은 20~30대·30~40대·50~60대 세 세대 모두 핵심 고객,
#   가족 그룹은 고도화(보류, 구현 방법은 적어 둠), 과다 섭취 경고는 넣는다.
#   이어서 같은 날 팀 결정: 사진 등록(촬영 안내·다시 찍기 포함)은 보류에서 구현으로 옮기고, 설문 기반 영양제 추천을 넣는다.
#   추천 이유는 DB의 성분별 효과(팀이 출처와 함께 넣는 중)로만 쓰고, 생활 습관 리포트는 하지 않는다. 사진은 AI로 보내기 전에 동의를 받고, 읽은 뒤 지우며 저장하지 않는다.
# 2026-10-29 팀 피드백(가족 그룹 방향, 칼슘 기준량, 비맥스 흐름, 목록을 누가 채우나, DB 범위, 성분 정규화, 데이터와 문서 불일치, 복용량 입력, 개인정보)을 반영했습니다.
# 괄호 안의 E·R·F 번호는 그 내용의 근거가 되는 experiences·sources·features 항목입니다.
# 한 문장: (② 고객)은 (① 상황)에서 (③ 근본 문제) 때문에 (④ 영향)을 겪는다. 지금은 (⑤ 현재 대안)으로 버티지만 (⑥ 단점)이 남는다.
statement: |-
 이 문제는 약과 영양제를 함께 복용하는 20~30대 청년층, 부모님의 건강을 위해 영양제를 구매하는 30~40대 자녀, 여러 약과 영양제를 지속적으로 복용하는 50~60대 중장년층이 겪는다.
 약과 영양제를 서로 다른 경로에서 구매하고 관리하다 보니 함께 복용해도 안전한지 확인하기 어렵다. 또한 영양제는 안전하다는 인식 때문에 약과의 상호작용 가능성을 생각하지 못한 채 복용하기도 한다.
 일부는 별도의 확인 없이 복용하고, 일부는 SNS·약사·생성형 AI·건강관리 앱 등을 통해 안전성을 확인하려 한다. 그러나 새로운 약이나 영양제를 추가할 때마다 확인해야 하는 번거로움이 있고, 답변이 불명확하거나 판단 근거를 확인하기 어려워 확신을 얻지 못한다. 이 과정에서 부정확한 정보를 신뢰할 위험도 있다.
canvas:
  context: |-
    집에서 아침 식사 후 약과 영양제를 한꺼번에 먹는다. 어머니는 병원 약과 종합비타민·칼슘을(E18), 팀원은 잊지 않으려고 철분과 칼슘을 아침 식사 후 함께 먹었다. 영양제는 매일 먹는 것이라, 잘못된 조합이 한 번 생기면 알아챌 때까지 매일 반복될 수 있다.
    함께 복용하게 되는 계기도 다양하다. 기존에 영양제를 먹다가 감기약이나 처방약을 새로 복용하기도 하고(E1), 반대로 약을 복용하던 중 영양제를 추가로 구매하기도 한다. 실제로 국내 만성질환자 대상 조사에서는 약 72%가 영양제를 약국 외 경로에서 구매한 것으로 나타났다(R4). 이처럼 약과 영양제를 서로 다른 경로에서 구매하고, 주의가 필요한 조합을 알아차리지 못한 채 복용하다 보면 약효 감소나 부작용 위험에 노출될 수 있으며, 이러한 복용이 매일 반복될 수 있다.
  customer: |-
    약과 영양제를 함께 복용하거나 부모님의 영양제를 챙기는 사람들이 핵심 고객이다. 연령과 성별에 제한은 없지만, 실제 경험과 인터뷰를 바탕으로 다음 세 가지 고객 유형을 구분했다.
    (1) 20~30대 직장인·대학생
    유튜브나 광고를 참고해 영양제를 구매하지만, 제품마다 성분과 함량이 달라 자신에게 필요한 제품을 선택하기 어렵다. 평소 영양제를 복용하다가 감기약이나 처방약을 추가할 때 생성형 AI에 안전성을 질문하기도 하지만, 답변을 확신하지 못하면서도 큰 문제가 없을 것이라 생각해 복용을 지속한다(P1, E1, E3, E16).
    (2) 부모님의 영양제를 구매하는 30~40대 자녀
    부모님이 복용하는 약을 정확히 알지 못한 채 영양제를 구매하거나 선물한다. 영양제를 구매할 때 기존 약과의 상호작용을 확인하지 않았다가, 선물한 뒤 병용 가능성을 걱정하고 약사에게 상담한 사례가 있다(E17). 복용 시간만 질문한 별도 사례도 있다(E4).
    (3) 약을 꾸준히 복용하는 50~60대 중장년층
    고혈압·갑상선 질환·알레르기 등으로 약을 복용하면서 자녀가 선물하거나 직접 구매한 영양제를 함께 먹는다. 성분표를 확인하더라도 약과의 상호작용을 판단하기 어려워 유튜브나 생성형 AI에 의존하거나, 별다른 확인 없이 복용을 지속하기도 한다(E2, E15).
  root_problem: |-
    약은 병원에서 처방받지만, 영양제는 인터넷·마트·해외 직구 등 다양한 경로에서 구매한다(E15, E16). 이처럼 구매와 관리 경로가 분리되어 있어 복용 중인 약과 영양제를 종합적으로 확인하기 어렵다.
    또한 영양제를 약과 함께 복용해도 안전하다고 여겨 의료진에게 알리지 않는 경우가 보고되었으며(R2, E19), 별도의 확인 없이 함께 복용하기도 한다(E2, E17). 병원이나 약국에서 영양제 복용 여부를 묻지 않았다는 인터뷰 사례도 있으며(E15), 자녀 역시 부모님이 복용하는 약을 정확히 알지 못해 상호작용을 확인하지 못하는 경우가 있다(E17).
    의약품 설명서에는 특정 성분과의 병용 주의사항이 안내되어 있지만(R7), 사용자가 이를 자신이 복용하는 영양제의 성분과 직접 대조해야 하는 어려움이 있다(E3). 또한 공개된 DUR 품목정보는 의약품 중심으로 제공되며 건강기능식품 항목은 확인되지 않아(R5), 약과 영양제를 함께 확인하려면 별도의 정보 검색과 비교가 필요하다. 특히 새로운 약이나 영양제를 추가할 때마다 이러한 과정을 반복해야 하므로, 사용자가 복용 조합의 안전성을 지속적으로 점검하기에는 시간과 노력이 많이 든다.
  impact:
    feeling: |-
     약과 영양제를 함께 복용해도 안전한지 생성형 AI에 질문했지만, 답변의 정확성을 확신하지 못해 불안감이 해소되지 않은 사례가 있었다(E1). 실제로 온라인에서도 "씬지로이드빼고 다같이 먹어도 된다고해서 먹는데 괜찮나요??"(E11), "밥먹고 이 약들을 다먹으면 흡수율이라던지 떨어지나요?"(E7)와 같이 복용 중인 조합의 안전성을 걱정하는 질문이 나타났다. 이는 복용하는 제품이 많아질수록 성분별 주의사항을 확인하고 적절한 복용 방법을 판단하는 데 어려움을 겪을 수 있음을 보여준다.
     부모님의 복용 약을 모른 채 영양제를 선물한 자녀가 이후 병용 가능성을 걱정하고 약국을 방문한 사례가 있다(E17). 부모님의 불안감이나 자녀의 죄책감은 별도로 확인되지 않았다.
    measurable: |-
      직접 수집한 경험에서는 약과 영양제를 함께 복용하면서 별도 점검을 하지 않은 사례(E2, E18)와, AI에 질문하고도 불확실성을 느낀 사례(E1, E16)가 나타났다. 다만 실제로 위험한 조합을 복용했는지는 확인되지 않았으며, 병용에 따른 위험성은 식약처 공식 자료(R22)와 관련 연구(R3, R10)를 통해 별도로 확인했다.
      2023년 인크루트 설문조사(944명)에서는 응답자의 86.1%가 영양제를 한 가지 이상 복용했지만, 효능과 부작용을 모두 알고 있다고 답한 비율은 15.3%에 그쳤다(R1). 일본의 환자 대상 조사에서도 약과 영양제를 함께 복용하는 환자의 70.3%가 안전하다고 생각해 의사·약사에게 영양제 복용 사실을 알리지 않은 것으로 나타났다(R2). 국내 만성질환자 146명을 대상으로 한 조사에서는 약 72%가 영양제를 약국 외 경로에서 구매했으며, 처방약과의 복용 시간이나 용량을 충분히 검토하지 않는 사례도 보고되었다(R4). 이는 영양제를 복용하면서도 성분별 주의사항이나 적절한 복용 방법을 충분히 확인하지 못하는 경우가 있음을 보여준다.
      이러한 문제는 실제 약물이나 영양소의 흡수 저하로 이어질 수 있다. 건강한 성인을 대상으로 한 연구에서는 레보티록신과 칼슘을 함께 복용했을 때 약물 흡수가 약 20~25% 감소했으며(R3), 126명을 대상으로 한 식사 실험에서는 칼슘 300~600mg 섭취 시 철분 흡수가 약 50~60% 감소했다(R10). 즉, 건강을 위해 복용하는 약과 영양제라도 성분 조합과 복용 방법에 따라 약효가 감소하거나 영양소의 흡수가 방해되어, 치료 효과와 건강관리에 부정적인 영향을 줄 수 있다.
  alternatives:
    - how_used: 약과 영양제를 함께 복용해도 안전한지 궁금할 때 유튜브·블로그·SNS에서 관련 정보를 검색하거나, 챗GPT와 같은 생성형 AI에 복용 중인 제품을 입력해 질문한다(E1, E3, E15, E16). 영양제를 구매할 때도 추천 영상이나 광고를 참고한다(E16).
      shortcoming: 유튜브·블로그·SNS에는 전문성이 검증되지 않은 정보나 제품의 장점만 강조하는 광고가 있어, 자신에게 적합한 영양제를 선택하거나 현재 복용 중인 약과의 상호작용을 확인하기 어렵다(E1, E16). 생성형 AI가 질문에 언급된 의약품 주의 문구를 확인하지 못해 첨부문서 재확인과 약사 상담을 안내한 사례가 있으며(E3), "시간을 두고 복용하면 괜찮을 것 같다"는 식의 불확실한 답변으로 사용자의 불안감이 해소되지 않기도 한다(E1). 답변을 완전히 신뢰하지 못하면서도 복용을 지속하는 사례가 있고(E16), 질문에 따라 필요한 제품·성분 정보가 빠지면 답변의 적절성을 사용자가 판단하기 어렵다.
      why_ours: 식약처 공식 자료와 관련 학술논문 등 신뢰할 수 있는 근거를 확인하고, 사람이 직접 검토한 상호작용 정보만 데이터베이스에 등록한다. 사용자가 복용 중인 약과 영양제를 입력하면 제품에 포함된 성분을 기준으로 주의가 필요한 조합을 확인하고, 해당 조합이 발견되면 구체적인 주의사항과 함께 판단 근거 및 출처 링크를 제공한다. 이를 통해 사용자는 단순히 위험하다는 경고만 받는 것이 아니라, 어떤 성분이 문제가 되는지, 왜 주의해야 하는지를 직접 확인할 수 있다. 
    - how_used: 약과 영양제를 함께 복용해도 안전한지 확인하기 위해 약국을 방문하거나 약사에게 상담받는다(E17).
      shortcoming: 약사에게 정확한 상담을 받으려면 현재 복용 중인 약과 영양제의 제품명, 성분, 복용량 등을 미리 파악해야 하지만, 여러 제품을 복용하는 경우 모든 정보를 빠짐없이 확인하고 준비하기가 쉽지 않다. 특히 필요한 정보를 누락하면 전체 복용 조합에 대한 충분한 점검이 어려울 수 있다. 또한 새로운 약이나 영양제를 추가할 때마다 이러한 과정을 반복해야 하며, 상담을 위해 직접 약국을 방문해야 하는 시간적 부담도 있다(E17). 약국이 바빠 여러 복용 제품을 충분히 상담받지 못했다는 사례도 있어(E6), 복용 중인 모든 제품의 상호작용을 꼼꼼하게 확인하는 데 어려움을 겪을 수 있다.
      why_ours: 복용 중인 약과 영양제를 한 번 등록해 두면 새로운 항목을 추가할 때마다 기존 목록과의 상호작용을 자동으로 점검한다(F4). 또한 현재 구현 범위에서는 등록된 복용 목록을 확인하고(F3), 개별 상호작용의 주의사항과 근거를 열람할 수 있다(F5). 약사 상담용 리포트는 별도 기능 정의가 필요하다.
    - how_used: 필라이즈와 같은 영양제 분석·관리 앱에 복용 중인 약과 영양제를 등록하고, 성분 정보와 부작용 및 상호작용 가능성을 확인한다(R9).
      shortcoming: 부작용이나 상호작용 위험이 있는 성분을 안내하지만, 공개된 앱 소개만으로는 개별 판단에 사용된 공식 자료나 연구 결과를 구체적으로 확인하기 어렵다(R9). 따라서 사용자가 경고의 근거를 직접 검증하는 데 한계가 있다.
      why_ours: 주의가 필요한 성분 조합을 안내할 때 식약처 등 정부기관의 공식 자료와 관련 학술논문을 근거로 제시한다. 경고마다 원문과 출처 링크를 함께 제공해 사용자가 상호작용의 내용과 판단 근거를 직접 확인할 수 있도록 한다(F5).
    - how_used: 약 상자나 설명서의 주의사항을 직접 읽거나, 식약처 'e약은요'에서 의약품 정보를 검색해 함께 복용할 때 주의해야 할 성분을 확인한다(R7).
      shortcoming: 의약품별로 긴 주의사항을 확인한 뒤 자신이 복용하는 영양제의 성분과 직접 비교해야 하는 번거로움이 있다. 특히 '칼슘염'처럼 성분명으로 안내되는 경우 해당 성분이 자신이 복용하는 영양제에 포함되어 있는지 판단하기 어렵다(R7, E3). 또한 'e약은요'는 일반의약품 중심의 정보 서비스이므로 처방약의 주의사항은 별도로 확인해야 한다(R6).
      why_ours: 약과 영양제를 제품명으로 등록하면 포함된 성분을 기준으로 기존 복용 목록과 비교하여 주의가 필요한 조합을 알려 준다(F3, F4). 처방약도 제품명으로 등록할 수 있도록 해 여러 자료를 일일이 검색하고 대조하는 번거로움을 줄인다.
personas:
  - id: P1
    description: 평소 건강관리를 위해 비타민B군·마그네슘·오메가3 등의 영양제를 복용하다가 감기약이나 처방약을 추가로 복용한다. 두 제품을 함께 먹어도 안전한지 궁금해 생성형 AI에 질문하지만, 답변이 모호하거나 정확성을 확신하기 어려워 불안감을 느낀다. 그렇다고 매번 약사에게 상담받기는 번거로워, 큰 문제가 없을 것이라 생각하고 복용을 지속하기도 한다. 약이나 영양제가 추가될 때마다 복용 중인 제품과의 상호작용을 간편하게 확인하고, 신뢰할 수 있는 근거를 통해 안전성을 판단하고 싶어 한다.
    source: E1(팀원 본인), E3(닥터나우 공개 질문, 2026-10-07), E12(하이닥 공개 질문, 31세), E16(20대 팀원 인터뷰)
  - id: P2
    description: |-
      부모님께 영양제를 구매하는 30~40대 자녀.
      부모님의 건강을 위해 유튜브나 인터넷에서 영양제를 찾아 구매하거나 선물한다. 그러나 부모님이 현재 어떤 약을 복용하는지 정확히 알지 못하고, 영양제는 안전할 것이라는 생각에 기존 약과의 상호작용을 확인하지 않는다. 선물한 뒤에야 함께 복용해도 괜찮은지 걱정되어 약국을 방문하지만, 정확한 상담을 위해서는 부모님이 복용 중인 약과 영양제의 정보를 먼저 파악해야 하는 어려움이 있다. 부모님의 복용 정보를 한곳에서 관리하고, 영양제를 구매하기 전에 기존 약과의 상호작용을 미리 확인하고 싶어 한다.
    source: E17(30대 자녀 인터뷰), E4(닥터나우 공개 질문, 2024-11-05), 팀 논의
  - id: P3
    description: |-
      약과 영양제를 지속적으로 복용하는 50~60대 중장년층.
      고혈압·갑상선 질환·알레르기 등으로 처방약을 꾸준히 복용하면서 직접 구매하거나 선물받은 영양제를 함께 먹는다. 약과 영양제를 서로 다른 경로에서 구매하다 보니 전체 복용 조합을 종합적으로 확인하지 못하고, 별다른 점검 없이 한꺼번에 복용하기도 한다. 의약품 설명서나 영양제 성분표를 확인하더라도 복잡한 성분명을 이해하고 서로 비교하기 어려우며, 새로운 제품을 추가할 때마다 모든 주의사항을 다시 확인하는 것도 부담스럽다. 복용 중인 제품을 일일이 비교하지 않아도 주의가 필요한 조합을 쉽게 확인하고, 필요한 경우 약사에게 정확한 복용 정보를 전달하고 싶어 한다.
    source: E2(팀원 아버지), E15(팀원 어머니 인터뷰), R3, R4, 팀 논의
experiences:
  # E1·E2는 팀원 인터뷰(2026-10-29)에서 들은 실제 경험이다. AI 답과 아버지 말은 기억에 의한 인용이다.
  - id: E1
    when: 2026년 여름 시작할 때
    what_happened: 팀원이 감기약을 먹으면서 비타민B군과 마그네슘도 함께 먹었다. 같이 먹어도 되는지 궁금해 생성형 AI에게 물었고, AI는 시간을 좀 띄워서 먹으면 문제없을 것 같다고 답했다. 영양제는 유튜브 추천을 보고 샀는데, 영상은 약과 같이 먹어도 되는지는 알려 주지 않았다.
    workaround: AI 답을 믿고 시간을 좀 띄워서 그냥 먹었다.
    feeling: 괜찮은지 몰라서 찜찜했다.
    quote: “감기약이랑 비타민B이랑 마그네슘 같이 먹어도 돼?”
    source: 팀원 본인 경험(2026-10-29 인터뷰)
  - id: E2
    when: 2026.
    what_happened: 팀원의 아버지가 알레르기약과 비타민B군·마그네슘·유산균을 매번 밥 먹고 한꺼번에 다 드신다. 팀원이 다 같이 한 번에 먹어도 되냐고 물었지만, 아버지도 팀원도 확인해 보지 않았다.
    workaround: 확인하지 않고 그대로 드신다.
    feeling: 모름.
    quote: 머 괜찮지 않을까?
    source: 팀원 가족(아버지) 경험, 팀원이 직접 보고 들음(2026-10-29 인터뷰)
  # E3~E12(E12 포함)는 공개 Q&A에서 실제로 열어 확인한 다른 사람의 질문 글이다(팀원 경험 아님). 인용은 원문 그대로.
  - id: E3
    when: 2026-10-07
    what_happened: 직장인이 포텐비정·오메가3(EPA·DHA 900mg)·칼슘·마그네슘·비타민K2&D 제품을 하루 한 알씩 함께 먹으려다, 포텐비정 주의사항의 칼슘염 병용 금지 문구와 세 제품의 비타민D 총량을 짚으며 같이 먹어도 되는지 물었다.
    workaround: 닥터나우 Q&A에 질문했고 닥터나우 AI의 참고용 답변을 받았다. 답변은 그 문구를 허가사항에서 확인하지 못했다며 첨부문서를 다시 보고 약사와 상담하라고 했다.
    feeling: 질문에서 주의 문구에 대한 의문을 드러냄.
    quote: 포텐비정과 칼슘·오메가3 제품 동시 복용 가능할까요?
    source: https://doctornow.co.kr/content/qna/417f698127734632bb49611f15bc3bdc
  - id: E4
    when: 2024-11-05
    what_happened: 부모님께 뇌영양제·관절영양제·비타민·오메가3를 사 드리는 자녀가 언제 드시게 하면 좋은지 복용 시간만 물었다. 부모님이 드시는 약이 있는지, 그 약과 같이 드셔도 되는지는 묻지 않았다.
    workaround: 닥터나우 Q&A에 질문했고 닥터나우 AI의 참고용 답변을 받았다.
    feeling: 아무것도 모름. 
