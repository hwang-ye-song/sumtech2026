# 종이 문제정의 캔버스(2026-10-29, 팀 늘크크)와 팀 대화·멘토링·자료 조사·팀원 인터뷰를 옮긴 기록입니다.
# 외부 수치와 인용은 sources·experiences에 적은, 실제로 열어 확인한 자료의 표현과 표본을 그대로 옮겼습니다.
# 2026-10-29 두 팀원의 문제정의를 하나로 합쳤습니다. 팀 결정: 고객은 20~30대·30~40대·50~60대 세 세대(이후 대표 고객을 30~40대 자녀로 정함, 아래 참고),
#   가족 그룹은 고도화(보류, 구현 방법은 적어 둠), 과다 섭취 경고는 넣는다.
#   이어서 같은 날 팀 결정: 사진 등록(촬영 안내·다시 찍기 포함)은 보류에서 구현으로 옮기고, 설문 기반 영양제 추천을 넣는다.
#   추천 이유는 DB의 성분별 효과(팀이 출처와 함께 넣는 중)로만 쓰고, 생활 습관 리포트는 하지 않는다. 사진은 AI로 보내기 전에 동의를 받고, 읽은 뒤 지우며 저장하지 않는다.
# 2026-10-29 팀 피드백(가족 그룹 방향, 칼슘 기준량, 비맥스 흐름, 목록을 누가 채우나, DB 범위, 성분 정규화, 데이터와 문서 불일치, 복용량 입력, 개인정보)을 반영했습니다.
# 2026-10-29 PRD·데모 담당과 맞춤: 데모와 주최 측 실행은 웹사이트(PC 화면), '분석하기'는 '검진하기'로, 처음 목록을 만들 때는 경고 없이 등록하고 '검진하기'로 한 번에 점검한 뒤부터 추가하면 자동 점검, 추천은 약이 아닌 비타민 추천이고 설문은 좋아지고 싶은 부분·하루에 먹을 수 있는 알 수·더 알려 주고 싶은 점. 역할 이름(복용자)과 "안전이라 단정하지 않는다" 원칙은 유지.
# 2026-10-29 E18~E35(팀 메모 T1~T18)는 실제 경험이 아니라 리뷰어가 만든 가상 예시로 확인되어 모두 지우고, 그 번호를 인용한 문장은 실제 근거로 되돌렸습니다.
# 2026-10-29 리뷰 반영: 한 고객의 한 상황을 끝까지 설명하도록 대표 고객을 30~40대 자녀로 정하고, 50~60대 부모님과 20~30대는 확장 고객으로 둔다. "위험을 모르는 사람이 왜 앱을 여는가"에 대한 팀 가설(무엇을 사 드릴지 정하려고 연다)을 통찰에 적었다.
# 괄호 안의 E·R·F 번호는 그 내용의 근거가 되는 experiences·sources·features 항목입니다.

# 한 문장: (② 고객)은 (① 상황)에서 (③ 근본 문제) 때문에 (④ 영향)을 겪는다. 지금은 (⑤ 현재 대안)으로 버티지만 (⑥ 단점)이 남는다.
statement: |-
  부모님께 영양제를 사 드리는 30~40대 자녀는, 부모님이 기운이 없다고 하실 때 영양제를 골라 사 드리면서, 부모님이 무슨 약을 드시는지 모르고 영양제면 다 괜찮다고 여겨 그 조합이 괜찮은지 확인할 생각도 방법도 없다(E17).
  그래서 사 드린 뒤에야 "이거 근데 같이 먹어도 되나?" 걱정하고 약국까지 찾아간다(E17). 지금은 유튜브·AI·약사에게 묻지만, 부모님 약을 모르는 채로 묻게 되고 매번 약국에 가야 한다.
canvas:
  context: |-
    부모님이 기운이 없다고 하실 때, 자녀는 유튜브를 보고 영양제를 골라 사 드린다(E17). 부모님은 그 영양제를 원래 드시던 약과 함께 보통 밥을 드신 뒤 한꺼번에 드신다(E2, E17). 영양제는 매일 먹는 것이라, 잘못된 조합이 한 번 생기면 알아챌 때까지 매일 반복된다.
    함께 먹게 되는 계기는 서로 다르다. 먹던 영양제가 있는데 감기약이나 병원 약이 새로 생기거나(E1), 먹던 약이 있는데 자녀가 영양제를 사 드리거나(E17) 해외 직구·광고를 보고 새로 산다(E15, E16).
    영양제는 대부분 약국 밖에서 사서(약 72%, R4), 새로 살 때 기존에 먹는 것까지 함께 확인해 주는 사람이 없다.
  customer: |-
    대표 고객은 부모님께 영양제를 사 드리는 30~40대 자녀다(P2). 부모님이 기운이 없다고 하실 때, 부모님 건강에 도움이 되는 영양제를 사 드리려고 유튜브를 보고 고르지만, 부모님이 무슨 약을 드시는지 몰라 그 영양제가 괜찮은지 판단하지 못하고 사 드린 뒤에야 걱정한다(E17). 영양제의 복용 시간은 물어도 부모님 약과 같이 드셔도 되는지는 묻지 않는다(E4).
    확장 고객: 약을 매일 드시고 밥을 드신 뒤 약과 영양제를 한꺼번에 드시는 50~60대 부모님(P3, E2, E15). 영양제를 고르기 어렵고 AI 답에 찜찜한 20~30대(P1, E1, E16).
  root_problem: |-
    약은 병원에서, 영양제는 자녀가 인터넷에서 사 보내거나 마트·해외 직구·광고·유튜브 추천으로 산다(E15, E16). 구매하는 곳이 달라, 지금 먹는 약과 영양제를 한꺼번에 확인하기 어렵다.
    사람들은 영양제를 같이 먹어도 안전한 것으로 여겨 의사·약사에게 말하지 않고(R2), 병원·약국도 약만 묻고 영양제는 묻지 않는다(E15). 자녀는 부모님이 무슨 약을 드시는지 잘 모르고(E17), "영양제면 다 괜찮은 줄 알았다"고 말한다(E17). 가족끼리도 "머 괜찮지 않을까?" 하고 넘긴다(E2).
    "같이 먹지 마세요"라는 경고는 약 설명서 안에만 적혀 있고(R7), 영양제는 약국 밖에서 사니 약사가 볼 일도 없다(R4). 병원과 처방 점검 시스템(DUR)도 약만 보고 영양제는 따지지 않는다(R5, R8).
  impact:
    feeling: |-
      함께 먹어도 되는지 물어봤지만, 답을 듣고도 확신이 없어 찜찜하다(E1).
      "씬지로이드빼고 다같이 먹어도 된다고해서 먹는데 괜찮나요??"(E11), "밥먹고 이약들을 다먹으면 흡수율이라던지 떨어지나요?"(E7)
      자녀는 "나이 드셔서 몸이 안 좋으신데, 약이랑 영양제를 잘못 드셔서 더 안 좋아지실까 봐" 걱정했고, "이거 근데 같이 먹어도 되나?"라고 말했다(E17).
    measurable: |-
      직접 들은 경험(E1, E2, E15~E17)에서 공통으로 보인 것은 확인하지 않는 행동이다. 그분들이 실제로 위험한 조합을 먹었는지는 확인하지 않았다. 위험할 수 있는 조합은 식약처 원문(R22), 연구(R3, R10), 공개 질문 글(E3, E5)로 보여 준다.
      영양제를 하나라도 먹는 사람은 86.1%인데, 효능과 부작용을 다 안다는 사람은 15.3%뿐이다(R1, 한국 인크루트 설문 944명, 2023년 4월 발표, 응답자 연령 구성은 공개되지 않음).
      약과 영양제를 같이 먹는 환자의 70.3%는 같이 먹어도 안전하다고 여겨 의사·약사에게 말하지 않았다(R2, 일본 온라인 패널 2014년 7월, 예비조사 40,170명 중 19.6%가 약과 영양제를 함께 먹었고 본조사 환자 1,508명, 한국 고객층과 다른 일본 표본).
      처방약을 먹는 만성질환자의 약 72%는 영양제를 약국이 아닌 곳에서 사고, 대부분 처방약과의 섭취 시간·용량 검토 없이 먹는다(R4, 한국 만성질환자 146명 설문, 2024년 학회 포스터, 영양제 소분 업체 연구센터 조사).
      갑상선약(레보티록신)을 칼슘과 함께 먹으면 흡수가 약 20~25% 줄었다(R3, 미국 갑상선 기능이 정상인 건강한 성인 8명이 한 번 먹은 연구, 2011년, 환자 대상 연구는 아님).
      영양제끼리도 부딪친다. 칼슘 300~600mg을 함께 먹으면 철분 흡수가 약 50~60% 줄었다(R10, 스웨덴 126명 한 끼 식사 실험, 1991년).
      팀이 2026-10-29 식약처 e약은요에서 해열진통제·감기약·소화제·제산제·비타민제·철분제 등 자주 쓰는 일반의약품을 다시 열어 보니, 원문이 있는 36개 중 13개의 '주의해야 할 약 또는 음식' 항목에 칼슘염·철염 같은 영양제 성분과 "함께 복용하지 마십시오" 문구가 있었다. 대부분 비타민·철분제(비맥스제트정, 임팩타민정, 아로나민씨플러스정 등 11개)였고, 제산제(개비스콘)와 칼슘제(칼디텍츄어블정)도 있었다(R22, 제품 목록과 원문은 database/eyak_supplement_warnings.csv).
      건강기능식품 이상사례 신고는 2022년 1,115건에서 2025년 3,547건으로 늘었다(R19, 한국 식약처 전국 신고 건수, 상호작용만이 아닌 이상사례 전체이고 신고가 곧 인과관계는 아니다).
      공개 질문 글의 질문자들은 처방약 2~5개 이상에 영양제를 3~9개 함께 먹거나 먹으려 하면서 그 조합을 따로 물어야 했다(E5, E6, E8~E10).
  alternatives:
    - how_used: |-
        대부분은 문제가 있을 수 있다는 것 자체를 모른 채 그냥 먹는다.
        자녀는 부모님이 기운이 없다고 하시면 유튜브를 보고 비타민을 사 드리지만, 부모님이 드시는 약은 모른다(E17). 부모님은 밥을 드신 뒤 약과 영양제를 한꺼번에 드신다(E2, E17).
        병원·약국은 약만 묻고 영양제는 묻지 않아 영양제 이야기는 나오지 않는다(E15, R2).
      shortcoming: 안 좋은 조합이어도 아무도 모른 채 매일 먹는다. 가족이 물어도 "머 괜찮지 않을까?" 하고 확인하지 않는다(E2).
      why_ours: 약과 영양제를 등록해 두면 새 항목을 추가할 때 주의할 조합을 알려 준다(F4). 자녀는 부모님이 드시는 약과 사 드릴 영양제를 자기 목록에 넣어, 사 드리기 전에 점검하고 리포트를 부모님·약사에게 보여 드릴 수 있다(F3·F5).
    - how_used: 걱정이 될 때는 유튜브·블로그·SNS에서 "OO이랑 같이 먹어도 되나"를 검색해 본다(E15). 영양제도 유튜브 추천이나 광고를 보고 산다(E1, E16).
      shortcoming: 비전문가 말이라 틀린 정보를 믿을 수 있다. 나한테 필요도 없는데 좋다고 사라는 광고가 많고 광고마다 다 좋다고 해서 고를 수가 없으며(E16), 추천 영상은 내 약과 같이 먹어도 되는지는 알려 주지 않는다(E1).
      why_ours: 경고에 식약처 원문·논문과 출처 링크를 붙인다. 출처를 확인한 조합만 DB에 넣는다(F6, F7).
    - how_used: 약국에 갈 일이 있을 때 약사에게 "이거 같이 먹어도 돼요?" 하고 묻는다.
      shortcoming: 영양제는 약국 밖에서 사서(R4) 살 때마다 물어보기 번거롭고, 약국이 바빠 다 봐 주지 못하며(E10), 추천을 받으려면 약국에 직접 가야 한다(E17). 약국도 약만 묻고 영양제는 묻지 않아(E15), 약사도 집에서 먹는 영양제를 다 알기 어렵다.
      why_ours: 한 번 등록하면 더할 때마다 자동으로 점검되고, 약사에게는 먹는 것 전체와 물어볼 질문이 정리된 복용 리포트를 보여 주면 된다(F5). 약사 상담도 복용 중인 약과 보충제를 하나씩 확인하는 데서 시작하므로(R21), 그 목록을 미리 정리해 가는 셈이다.
    - how_used: 챗GPT 같은 생성형 AI나 온라인 상담의 AI에게 먹는 약과 영양제 이름을 적고 같이 먹어도 되는지 묻는다(E1, E3, E15, E16). 공개 질문 글 12건 중 9건은 의사·약사가 아니라 AI가 답했다(E3~E14).
      shortcoming: 틀린 말도 사실처럼 하고, 설명서 문구를 확인하지 못한 채 답하며(E3), "띄워 먹으면 문제없을 것 같다"처럼 애매해 듣고도 찜찜하거나(E1), 믿어서가 아니라 "큰일이야 나겠어" 하고 넘기게 된다(E16).
      why_ours: 식약처 원문과 논문에서 뽑아 사람이 확인한 DB로만 판정해, 같은 조합에는 항상 같은 답과 같은 출처가 나온다(F4).
    - how_used: 필라이즈 같은 건강 앱에 먹는 약과 영양제를 넣어 부작용 위험 성분을 확인한다(R9).
      shortcoming: 위험 성분을 알려 준다고 하지만, 그 판단이 어떤 공식 자료에서 왔는지 앱 소개에 밝히지 않는다(R9).
      why_ours: 경고마다 근거가 된 원문 문장과 출처 링크를 보여 줘, 사용자와 약사가 직접 확인할 수 있다(F6).
    - how_used: 심평원 '내가 먹는 약 한눈에'(카카오톡 인증)에서 최근 1년 동안 병원·약국에서 처방받은 약 이력을 본다(R17).
      shortcoming: 처방받은 약의 이력을 보여 주는 서비스라(R17), 약국 밖에서 산 영양제(R4)와 맞춰 보거나 "같이 먹지 마세요" 경고를 알려 주지는 않는다. 영양제를 사 드리는 자녀는 부모님 인증이 없으면 볼 수 없다.
      why_ours: 처방 이력을 보고 복용 목록을 채울 수 있다. 여기서 본 약 이름을 그대로 검색해 넣으면(F3) 영양제와 함께 점검된다.
    - how_used: 약 상자나 설명서의 주의사항을 직접 읽어 보거나, 식약처 e약은요에서 약 이름을 검색한다.
      shortcoming: 약 하나씩의 긴 설명이라 내 영양제와 맞춰 보는 건 스스로 해야 하고, "칼슘염"처럼 성분 이름으로만 적혀 있어 내 영양제가 해당하는지 알기 어렵다(R7, E3). 병원 약(처방약)은 e약은요에 나오지 않는다(R6).
      why_ours: 내 약과 영양제를 한 목록에 두고 더하는 순간 서로 맞춰 보며, 처방약도 약 봉투에 적힌 제품명(예 씬지로이드정)이나 흔히 부르는 이름(예 갑상선약)으로 등록한다(F3).
personas:
  - id: P1
    description: 20~30대 직장인·대학생. 비타민B군·마그네슘·오메가3 같은 영양제를 유튜브 추천을 보고 사서 매일 먹다가, 감기에 걸리거나 아플 때 감기약·처방약을 같이 먹는다. 같이 먹어도 되는지 궁금하면 생성형 AI에게 묻지만, "띄워 먹으면 문제없을 것 같다" 같은 애매한 답에 찜찜한 채 먹거나 "큰일이야 나겠어" 하고 넘긴다. 영양제는 광고를 보고 구독으로 사는데, 브랜드와 함량이 너무 많아 무엇이 좋은지 판단하지 못한다. 위험을 크게 느끼지 않아 영양제를 고르거나 살 때 앱을 찾을 것으로 본다. 그때 먹는 약과 함께 주의할 성분을 확인하고, 출처를 보며 고르고 싶어 한다.
    source: E1(팀원 본인), E3(닥터나우 공개 질문, 2026-10-07), E12(하이닥 공개 질문, 31세), E16(20대 팀원 인터뷰)
  - id: P2
    description: 부모님께 영양제를 인터넷으로 사 보내는 30~40대 자녀. 부모님이 기운이 없다고 하시면 유튜브를 보고 비타민을 사 드린다. 부모님이 무슨 약을 드시는지 정확히 모르고, 영양제면 다 괜찮은 줄 알아 같이 드셔도 되는지 확인하지 않는다. 사 드린 뒤에야 "이거 근데 같이 먹어도 되나?" 하고 걱정하고, 그제야 약국에 직접 찾아가 묻는다.
    source: E17(30대 자녀 인터뷰), E4(닥터나우 공개 질문, 2024-11-05), 팀 논의
  - id: P3
    description: 혈압약·갑상선약·알레르기약처럼 약을 매일 먹는 50~60대 부모님. 영양제는 자녀가 사 준 것과 홈쇼핑에서 산 것을 같이 먹고, 밥 먹고 한꺼번에 삼킨다. 영양제는 해외 직구로 사기도 한다. 성분표를 읽는 분도 있지만 읽어도 내 약과 같이 먹어도 되는지는 판단하지 못해 유튜브 약사·의사나 AI에게 묻고, 읽지 않는 분은 "괜찮지 않을까" 하고 넘긴다. 성분 이름보다 "갑상선약"처럼 흔히 부르는 이름으로 기억한다. 병원·약국은 약만 묻고 영양제는 묻지 않는다.
    source: 팀 논의(종이 캔버스 P1을 고객에 맞춰 좁힘), E2(팀원 아버지), E15(팀원 어머니 인터뷰, 50대), R3, R4
