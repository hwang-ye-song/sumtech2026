  - id: E12
    when: 2022-09-25
    what_happened: 혈압약(아모디핀정 5mg)을 하루 1정 먹는 31세 남성이 영양제도 챙겨 먹으려고, 루테인·밀크시슬·오메가3·시트룰린(아르기닌)·마카·아연 중 혈압약과 같이 먹으면 안 되는 것이 있는지 물었다.
    workaround: 하이닥 건강Q&A에 질문했고, 약사는 아르기닌이 혈압을 낮출 수 있으니 처음에 어지럼증이 없는지 살피라고 답했다.
