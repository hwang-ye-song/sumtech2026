  # E15·E16·E17은 팀원이 2026-10-29 직접 인터뷰한 실제 경험이다(기록 동의 받음). 답은 들은 그대로 옮겼다.
  - id: E15
    when: 2026-10-29 인터뷰
    what_happened: 팀원의 50대 어머니는 오메가3·글루타치온·칼슘-마그네슘 영양제를 해외 직구로 사서 먹는다. 병원·약국은 복용 중인 약만 묻고 영양제는 묻지 않는다. 성분표는 읽어 보고, 영양제를 고르기 전에 인터넷에서 효능과 복용법을 찾아본다.
    workaround: 내가 먹는 약과 같이 먹어도 되는지, 여러 제품 중 무엇이 가장 좋은지는 유튜브의 약사·의사나 AI에게 묻는다.
    feeling: 모르겠음.
    quote: “이게 다 뭘까…”
    source: 팀원 가족(어머니, 50대) 인터뷰(2026-10-29)
  - id: E16
    when: 2026-10-29 인터뷰
    what_happened: 20대 팀원은 비타민·밀크씨슬·오메가3 종합영양제를 광고를 보고 골라 매달 구독으로 산다. 약과 영양제를 같이 먹은 적이 있고 생성형 AI에게 물었다. AI를 믿어서라기보다 큰일은 없겠다는 마음으로 그 답대로 먹었다.
    workaround: 생성형 AI에게 묻고 그대로 먹었다.
    feeling: 비타민만 해도 브랜드가 너무 많고 함량이 달라 뭐가 좋은지 모르겠고, 광고마다 다 좋다고 해서 고르기 어렵다.
    quote: 이 두 개를 같이 먹는다고 해서 큰일이야 나겠어
    source: 팀원 본인(20대) 인터뷰(2026-10-29)
  - id: E17
    when: 2026년 9월(인터뷰 2026-10-29)
    what_happened: 30대 자녀가 부모님이 기운이 없다고 하셔서 유튜브에서 찾아보고 비타민을 사 드렸다. 부모님이 무슨 약을 드시는지는 그때도 몰랐고 지금도 모른다. 영양제면 다 괜찮은 줄 알아서 사 드릴 때는 같이 드셔도 되는지 확인하지 않았다. 부모님은 보통 밥 먹고 드신다. 사 드린 뒤에야 "이거 근데 같이 먹어도 되나?" 하고 걱정이 됐다.
    workaround: 사 드린 뒤 걱정이 되어, 부모님 약과 같이 드셔도 되는 영양제를 추천받으려고 약국에 직접 가서 물어봤다.
    feeling: 나이 드셔서 몸이 안 좋으신데, 약이랑 영양제를 잘못 드셔서 더 안 좋아지실까 봐 걱정했다.
    quote: 이거 근데 같이 먹어도 되나?
    source: 30대 자녀 인터뷰(2026-10-29, 기록 동의 받음). 순서는 확인 없이 사 드림 → 나중에 걱정 → 약국 방문.
