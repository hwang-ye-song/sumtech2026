# 팀 늘크크의 문제정의다. 종이 캔버스(2026-10-29)에서 시작해 지금 앱(TwoPills) 기준으로 다시 썼다.
# 괄호 안 번호는 근거다. E는 경험, R은 자료, P는 페르소나, F는 기능이다.

statement: |-
  약과 영양제를 같이 먹는 사람과 부모님께 영양제를 사 드리는 자녀는 매일 둘을 한꺼번에 먹는다.
  그런데 둘을 같이 봐 주는 곳이 없어서, 괜찮은지 모른 채 넘어간다.
  지금은 유튜브·AI·약사에게 묻는다. 하지만 답의 근거를 알 수 없고, 하나 더할 때마다 다시 물어야 한다.

canvas:
  context: |-
    밥 먹고 약과 영양제를 한꺼번에 먹을 때다. 매일 반복된다.
    어머니는 아침 식사 뒤 병원 약과 종합비타민·칼슘을 같이 드신다(E18).
    아버지는 알레르기약과 비타민B·마그네슘·유산균을 같이 드신다(E2).
    조합은 어느 날 바뀐다. 감기약이 생기거나(E1), 자녀가 영양제를 사 드린다(E17).
  customer: |-
    약과 영양제를 같이 먹는 사람과, 부모님 영양제를 챙기는 자녀다.
    - 20~30대 직장인·대학생(P1): 광고를 보고 영양제를 산다. 약이 생기면 AI에게 묻고 그냥 먹는다(E1, E16).
    - 30~40대 자녀(P2): 부모님 약을 모른 채 영양제를 사 드린다. 그 뒤에 걱정한다(E17).
    - 50~60대 부모님(P3): 혈압·갑상선·알레르기 약과 영양제를 같이 드신다. 제품 이름을 기억 못 하시기도 한다(E2, E15, E20).
  root_problem: |-
    약과 영양제가 따로 들어온다. 약은 병원에서, 영양제는 인터넷·마트·직구로 산다(E15, E16, R4).
    병원과 약국은 먹는 약만 묻는다(E15). 먹는 사람도 영양제는 약이 아니라며 말하지 않는다(E19, R2).
    같이 먹지 말라는 말은 약 설명서에만 있다. 그것도 '칼슘염' 같은 성분 이름이다(R7). 내 영양제가 해당하는지는 직접 맞춰 봐야 한다(E3).
    약끼리는 DUR이 걸러 주지만, 영양제는 대상이 아니다(R5).
    그래서 새로 하나 생길 때마다 처음부터 다시 확인해야 한다. 결국 확인 없이 먹는다(R2, R4).
  impact:
    feeling: |-
      괜찮은지 몰라서 찜찜하다. AI 답도 애매해서 마음이 안 놓인다(E1).
      어머니는 “이게 다 뭘까…” 하신다(E15).
      자녀는 부모님이 잘못 드셔서 더 안 좋아지실까 봐 걱정한다(E17).
    measurable: |-
      - 영양제를 먹는 사람은 86.1%, 효능·부작용까지 다 안다는 사람은 15.3%다(R1, 944명 설문).
      - 일본에서 약과 영양제를 같이 먹는 환자 1,508명 중 70.3%가 의사·약사에게 말하지 않았다(R2).
      - 갑상선약(레보티록신)을 칼슘제와 같이 먹으면 흡수가 약 20~25% 줄었다(R3, 건강한 성인 8명).
      - 칼슘 300~600mg은 철분 흡수를 약 50~60% 줄였다(R10, 126명).
      - 미국 국립의학도서관은 칼슘제·철분제를 레보티록신과 최소 4시간 띄우라고 한다(R12).
      - 자주 쓰는 일반의약품 원문 36개 중 13개에 영양제 성분과 같이 먹지 말라는 문구가 있었다(R22).
      우리가 들은 사례에서 실제로 몸이 나빠졌는지는 확인하지 못했다.
  alternatives:
    - how_used: 유튜브·블로그·SNS를 찾아본다(E15, E16).
      shortcoming: 광고와 비전문가 의견이 섞여 있다. 영상은 내가 먹는 약을 모른다(E1, E16).
      why_ours: 내 목록의 약과 바로 맞춰 보고, 식약처 원문과 논문 출처를 보여 준다(F3, F4).
    - how_used: 생성형 AI에게 먹는 약과 영양제를 적고 묻는다(E1, E16).
      shortcoming: 답이 애매해서 찜찜한 채로 먹는다(E1). 물을 때마다 다시 적어야 한다.
      why_ours: 판정은 AI가 아니라 사람이 원문을 확인한 DB로 한다. 같은 조합엔 늘 같은 답이 나온다. 한 번 등록하면 다시 적지 않는다(F2, F3).
    - how_used: 약국에 가서 약사에게 묻는다(E17).
      shortcoming: 매번 가기 번거롭다. 부모님은 제품 이름을 기억 못 하시고(E20), 약국이 바쁘면 다 봐 주지 못한다(E6).
      why_ours: 검진 리포트에 먹는 것, 주의할 조합, 약사에게 물을 질문이 정리돼 있다. 약국에서 보여 주면 된다(F4).
    - how_used: 약 설명서나 식약처 e약은요를 직접 찾아본다(R7).
      shortcoming: 성분 이름으로만 적혀 있어 일일이 맞춰 봐야 한다(E3). e약은요에는 처방약이 없다(R6).
      why_ours: 제품 이름이나 '갑상선약' 같은 말로 등록하면, 성분까지 풀어서 목록 전체와 맞춰 본다(F2, F3).
    - how_used: 필라이즈 같은 영양제 앱에 등록한다(R9).
      shortcoming: 무슨 자료로 판단했는지 앱 소개에 나오지 않는다(R9).
      why_ours: 경고마다 원문 문장, 출처 링크, DB 확인 날짜를 붙인다(F3, F4).

personas:
  - id: P1
    description: |-
      영양제를 챙겨 먹는 20~30대 직장인·대학생.
      비타민B·마그네슘·오메가3를 먹다가 감기약이나 처방약이 생긴다. AI에게 묻지만 확신이 없다. 약국은 번거로워서 그냥 먹는다.
    source: E1(팀원 본인), E3(닥터나우 공개 질문), E16(20대 팀원 인터뷰)
  - id: P2
    description: |-
      부모님께 영양제를 사 드리는 30~40대 자녀.
      유튜브를 보고 사 드리지만 부모님 약은 모른다. 사 드린 뒤에야 걱정돼서 약국에 묻는다.
    source: E17(30대 자녀 인터뷰)
  - id: P3
    description: |-
      약을 매일 드시는 50~60대 부모님.
      혈압·갑상선·알레르기 약과 영양제를 밥 먹고 한꺼번에 드신다. 성분표를 봐도 약과 맞는지 모른다. 제품 이름을 기억 못 하시기도 한다.
    source: E2(팀원 아버지), E15(팀원 어머니 인터뷰), E18·E19·E20(팀원 가족)

experiences:
  # E1·E2·E15~E20은 팀원 본인·가족·직접 인터뷰한 사람의 경험이다(기록 동의 받음).
  # E3·E6·E10·E11은 공개 Q&A에서 직접 열어 본 질문 글이다. 인용은 원문 그대로다.
  - id: E1
    when: 2026년 여름 시작할 때
    what_happened: 팀원이 감기약과 비타민B군·마그네슘을 같이 먹었다. AI에게 물으니 시간을 좀 띄우면 문제없을 것 같다고 했다. 영양제는 유튜브 추천으로 샀는데, 영상은 약과 같이 먹어도 되는지 알려 주지 않았다.
    workaround: AI 답대로 시간을 좀 띄워 그냥 먹었다.
    feeling: 괜찮은지 몰라서 찜찜했다.
    quote: “감기약이랑 비타민B이랑 마그네슘 같이 먹어도 돼?”
    source: 팀원 본인 경험(2026-10-29 인터뷰)
  - id: E2
    when: 2026년
    what_happened: 팀원 아버지가 알레르기약과 비타민B군·마그네슘·유산균을 밥 먹고 한꺼번에 드신다. 같이 먹어도 되는지 아무도 확인하지 않았다.
    workaround: 확인하지 않고 그대로 드신다.
    feeling: 모름
    quote: 머 괜찮지 않을까?
    source: 팀원 가족(아버지) 경험, 팀원이 직접 보고 들음(2026-10-29 인터뷰)
  - id: E3
    when: 2026-10-07
    what_happened: 직장인이 포텐비정·오메가3·칼슘·마그네슘·비타민K2&D를 같이 먹으려 했다. 포텐비정의 칼슘염 병용 금지 문구와 비타민D 총량을 짚으며 같이 먹어도 되는지 물었다.
    workaround: 닥터나우 Q&A에 물었다. AI 답변은 그 문구를 확인하지 못했다며 첨부문서를 다시 보고 약사와 상담하라고 했다.
    feeling: 의아함
    quote: 포텐비정과 칼슘·오메가3 제품 동시 복용 가능할까요?
    source: https://doctornow.co.kr/content/qna/417f698127734632bb49611f15bc3bdc
  - id: E6
    when: 2024-05-28
    what_happened: 정신과 약·혈압약·고지혈증약·위장약과 오메가3·비타민D·마그네슘 등 영양제를 같이 먹는 사람이 물었다. 약국은 바빠서 다 봐 주지 않는다고 했다.
    workaround: 닥터나우 Q&A에 물었다.
    feeling: null
    quote: 약국가서 이렇게 만을걸 상당 안해줘요 너무바빠서요
    source: https://doctornow.co.kr/content/qna/751ea9049dc5459a8037476cfdc55ef2
  - id: E10
    when: 2026-02-21
    what_happened: 처방약 3개와 영양제 9개를 먹는 사람이 조합에 문제가 없는지 물었다.
    workaround: 닥터나우 Q&A에 물었다.
    feeling: 제대로 해소되지 않음
    quote: 복용 중인 약과 영양제 조합에 문제 없나요?
    source: https://doctornow.co.kr/content/qna/d7784efca716475882bc2f2ea7a32a6d
  - id: E11
