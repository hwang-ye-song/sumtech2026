five_whys:
  # 대표 페르소나 P3(약을 매일 드시는 50~60대 부모님) 한 사람의 장면에서 시작해 끝까지 파고들었다.
  symptom: 50~60대 부모님이 아침 식사 뒤 병원 약과 종합비타민·칼슘을 한꺼번에 드신다. 새 약을 처방받으셔도 전에 자녀가 사 드린 영양제는 그대로 드신다. 같이 드셔도 되는지는 아무도 확인하지 않았다(P3, E18, E25).
  whys:
    - 왜 확인하지 않으셨나? 확인해야 한다는 생각이 없으셨다. 영양제는 약이 아니라고 여겨 병원에서도 말하지 않으시고(E19), 가족도 "머 괜찮지 않을까?" 하고 넘긴다(E2). 일본 조사에서도 환자 70.3%가 같이 먹어도 안전하다고 여겨 말하지 않았다(R2).
    - 왜 병원·약국에서도 걸러지지 않나? 병원과 약국은 먹는 약만 묻는다(E15). 처방 점검(DUR)은 약끼리만 보고, 의료 현장은 영양제 섭취를 알아도 약 쓰는 데 고려하지 않는다(R5, R8). 영양제는 72%가 약국 밖에서 사서 살 때 옆에 약사도 없다(R4).
    - 왜 사 드린 자녀도 확인하지 못했나? 자녀는 부모님이 드시는 약 이름을 모른다. "영양제면 다 괜찮은 줄" 알고 사 드린 뒤에야 걱정이 됐다(E17, E22). 후기와 가격은 비교해도 약과 맞는지는 찾아보지 않는다(E24). 부모님도 요일별 약통에 담아 두셔서 제품 이름을 기억 못 하신다(E20).
    - 왜 마음먹고 찾아봐도 판단이 안 되나? 경고는 이미 있다. 그런데 약 설명서 안에 '칼슘염' 같은 성분 이름으로만 적혀 있어서, 내 영양제가 거기 해당하는지 직접 맞춰 봐야 한다(R7, E3). 그 문구를 직접 본 사람도 판단하지 못해 AI에 물었고, AI는 애매하게 답했다(E3, E1).
    - 왜 이 일이 계속 반복되나? 약은 병원에서, 영양제는 자녀·지인·직구로 서로 다른 때 들어오는데(E21, E25, R4), 그때마다 둘을 한곳에 모아 맞춰 보는 단계가 없다. 근본 문제는 부모님의 약과 영양제를 한곳에 모아 맞춰 볼 곳이 없다는 것이다. 경고를 본 사람(E3)도 판단하지 못했으니, 설명서를 읽지 않는 부모님은 경고가 있다는 것조차 모르신다(E2). 이 답은 관찰에서 나왔고, 해법이 통하는지는 아직 검증 전이다.

solution_paths:
  - path: |-
      약과 영양제를 한 목록에 모은다. 첫 검진 뒤에는 새로 더할 때마다 목록 전체와 맞춰 본다.
      걸리면 할 일, 원문과 출처, 약사에게 물을 질문을 보여 준다(F2, F3, F4).
    status: chosen
    reason: |-
      근본 문제(약과 영양제를 한곳에 모아 맞춰 볼 곳이 없다)를 바로 푼다. 5 Whys 5단계에서 약과 영양제는 서로 다른 때 들어오는데 맞춰 보는 단계가 없었다(E21, E25, R4). 이 목록이 그 단계가 된다.
      더할 때마다 목록 전체와 맞춰 보니, 하나 바뀔 때마다 처음부터 다시 확인하는 수고가 사라진다(E3, E15).
      5 Whys 4단계(경고가 '칼슘염' 같은 성분 이름으로만 있다, R7, E3)는 제품을 성분까지 풀어 맞추는 판정으로 푼다(F3).
      5 Whys 1단계처럼 확인할 생각이 없는 사람에게도, 따로 묻지 않아도 경고가 먼저 뜬다(E2, E19).
      쓰지 못하는 경우: 목록에 넣지 않은 것은 점검하지 못한다. 제품 이름을 기억 못 하시면 등록부터 막힌다(E20). DB에 없는 조합은 '보고된 문제가 없다'고만 알린다. 지금은 PC 웹 화면이라 식탁에서 바로 보시기는 어렵다.
      검증할 것: 부모님이 목록을 직접 만들고 계속 고쳐 쓰실 수 있는지, 약사가 리포트를 쓸모 있다고 보는지.
  - path: 영양제끼리 부딪치는 조합도 본다. 출처가 있는 조합만 DB에 넣는다(F3).
    status: chosen
    reason: |-
      근본 문제의 다른 절반이다. 영양제끼리 같은 성분이 겹쳐도 이름이 달라 모른다(E30, E33).
      철분과 칼슘을 한꺼번에 먹거나(E31), 집과 회사에 따로 둔 영양제를 같은 날 먹는다(E32, E34).
      칼슘은 철분 흡수를 막는다(R10, R11). 식약처도 영양제끼리 겹치지 않게 하고, 약과 같이 먹을 때 주의하라고 한다(R15, R16, R18). DUR은 영양제를 보지 않으니(R5) 아무도 보지 않는 칸이다.
      쓰지 못하는 경우: 출처가 있는 조합만 넣어서, 자료가 없는 영양제끼리는 경고가 나오지 않는다.
  - path: 같은 성분의 하루 양을 합쳐 출처의 기준량과 비교한다(F4).
    status: chosen
    reason: |-
      제품끼리 성분이 겹쳐도 모르고 넘어간다(E3, E5, E30, E35). 칼슘은 하루 기준량이 있고(R13), 철분은 많이 먹으면 해롭다(R14).
      제품마다 권장량은 지켜도 합친 양은 계산하지 않는다(E35). 5 Whys 4단계처럼 정보는 있는데 내 경우로 맞춰 보지 못하는 문제라서, 합계를 대신 내 준다.
      약은 DB 함량으로, 영양제는 사용자가 넣은 함량으로 계산한다. 함량이나 기준이 없으면 계산하지 않고 넣어 달라고 안내한다.
      쓰지 못하는 경우: 영양제 함량을 넣지 않으면 계산하지 않는다. 성분표를 읽기 어려운 부모님(P3)은 함량을 넣기 어려울 수 있다. 출처에 기준량 숫자가 없는 성분은 보지 않는다.
  - path: 사진에서 제품 후보를 찾고, 사용자가 골라 등록한다(F2).
    status: chosen
    reason: |-
      5 Whys 3단계의 벽이다. 부모님은 이름을 기억 못 하시고(E20), 자녀는 부모님 약 이름을 모른다(E17, E22). 이름을 모르면 목록을 만들 수 없고, 목록이 없으면 근본 문제도 풀리지 않는다.
      약 상자·봉투 글자를 AI가 읽고 DB에서 후보를 찾는다. 인식이 틀리면 판정도 틀리므로 사람이 고르기 전에는 등록하지 않는다(F2).
      보내기 전에 동의를 받고, 흐리면 다시 찍게 한다. 사진은 저장하지 않는다.
      쓰지 못하는 경우: 흐리거나 글자가 안 보이는 사진은 읽지 못한다. AI 키가 없으면 검색으로만 등록한다.
      검증할 것: 얼마나 잘 읽는지.
  - path: 설문으로 비타민을 추천한다. 후보는 출처 있는 DB 안에서만 고르고, 내 목록과 부딪히는 성분은 경고로 돌린다(F5).
    status: chosen
    reason: |-
      근본 문제를 새로 살 때 쪽에서 막는다. 자녀는 확인 없이 사 드린 뒤에야 걱정했다(E17, E24). 추천 후보를 내 목록과 F3와 같은 규칙으로 맞춰 보니, 사기 전에 부딪히는 성분이 걸러진다.
      광고마다 다 좋다고 해서 고르기 어렵다(E16, E26, E27, E28, E29). 약을 먹는 사람이 같이 먹어도 되는 영양제를 직접 묻기도 한다(E12, E13, E14).
      일반 AI 답과 다른 점은, 내 목록을 이미 알고 DB 안에서만 고른다는 것이다(E1, E3).
      쓰지 못하는 경우: 제품명과 구매 링크가 없어 바로 사지는 못한다. 부딪히지 않는 후보가 없으면 약사와 상의하라고만 한다.
      검증할 것: 부모님에게도 필요한 기능인지.
  - path: 생성형 AI가 DB 없이 조합을 판정한다.
    status: rejected
    reason: |-
      만들기는 가장 쉽지만 근본 문제를 풀지 못한다. 물을 때마다 다시 적어야 해서 목록이 남지 않는다.
      AI 대안의 단점도 그대로 남는다. 답이 애매하고 설명서 문구를 확인 못 한 채 답하기도 한다(E1, E3). 믿어서가 아니라 큰일 없겠다며 넘기게 된다(E16).
      그래서 판정은 DB로만 하고, AI는 사진 글자 읽기(F2)와 추천 후보 고르기(F5)에만 쓴다.
  - path: 목록 저장 없이 두 제품씩 비교한다.
    status: rejected
    reason: 영양제를 8~9개 먹는 사람은 모든 짝을 다시 넣어야 한다(E8, E10). 새로 더하는 순간에 먼저 알려 주지도 못한다. 5 Whys 5단계의 '바뀔 때마다 처음부터 다시 확인'이 그대로 남는다.
  - path: 약끼리 조합까지 점검한다.
    status: rejected
    reason: 약끼리는 DUR이 이미 본다(R5). 5 Whys 2단계에서 걸러지지 않던 칸은 약×영양제와 영양제끼리다(R5, R8). 우리는 그 칸에 집중한다.
  - path: 부모님과 자녀가 한 목록을 같이 보는 가족 그룹.
    status: deferred
    reason: 자녀(P2)와 부모님(P3)이 같은 목록을 보면 사 드린 영양제와 부모님 약이 한자리에 모여 근본 문제를 더 직접 푼다. 하지만 실제로 구현하는 데 시간이 걸려 이번 해커톤 범위에서 뺐다. 지금은 자녀가 부모님 것을 자기 목록에 넣어 본다(E17, E24).
  - path: 띄워 먹어야 하는 조합에 복용 시간을 알려 준다.
    status: deferred
    reason: 갑상선약과 칼슘처럼 띄워 먹으라는 조합(R3, R12)은 시간을 알려 줘야 행동으로 이어진다. 몇 분 띄워야 하냐는 질문도 있었다(E7, E11). 경고와 리포트를 먼저 마친 뒤 한다.
  - path: 근처 약국이나 비대면 약사 상담으로 연결한다.
    status: deferred
    reason: 약사 섭외와 운영이 해커톤 범위 밖이다. 지금은 상담 때 보여 줄 리포트를 준다(F4).
  - path: 나이·질환·알레르기를 반영해 점검한다.
    status: deferred
    reason: 이번에는 같이 먹을 때 생기는 문제만 본다. 복용 목록도 건강 정보라서 계정마다 따로 저장하고 남이 못 보게 한다(F1).
  - path: 특정 영양제 제품을 추천하거나, 후원·판매 연계로 운영비를 마련한다.
    status: deferred
    reason: 제품 데이터와 고를 기준이 아직 없다. 광고마다 다 좋다고 해서 고르기 어렵다는 말도 있었고(E16), 추천 광고는 규제를 먼저 확인하라는 멘토 의견이 있었다. 지금은 성분까지만 추천하고 구매 링크를 넣지 않는다(F5).

insight:
  claim: |-
    경고는 이미 있다. 흔한 비타민제 설명서에도 칼슘염과 함께 먹지 말라고 적혀 있고(R7), 식약처도 약과 함께 먹을 때 조심할 영양제 성분을 알린다(R15). 그런데 이 안내가 실제 행동을 바꾸는지는 불분명하다(R16).
    사람들은 영양제는 같이 먹어도 괜찮다고 여겨 경고를 찾아볼 생각조차 하지 않는다(R2, E2, E19). 부모님께 영양제를 사 드리는 자녀도 복용 시간만 묻고, 부모님 약과 같이 드셔도 되는지는 묻지 않는다(E4). 직접 만난 30대 자녀는 부모님 약을 지금도 모르고, 확인 없이 사 드린 뒤에야 걱정이 돼 약국에 갔다(E17).
    그러니 문제는 "위험한 조합을 먹었다"가 아니라 "확인해야 한다는 생각도, 확인할 방법도 없었다"는 것이다(E18, E21, E24, E25, E30). 걱정이 돼서 묻는 사람도 "몇 분 텀을 둬야 하는지"처럼 어떻게 먹으면 되는지를 알고 싶어 하지만(E7), 답이 애매하거나 출처가 없어 찜찜함이 남는다(E1, E3).
  evidence: |-
    자주 쓰는 일반의약품 원문 36개 중 12개에 영양제 성분과 같이 먹지 말라는 문구가 있었다(R22). 영양제를 먹는 사람은 86.1%인데 효능과 부작용까지 아는 사람은 15.3%였고(R1), 환자 70.3%는 같이 먹어도 안전하다고 여겨 말하지 않았다(R2). 만성질환자 72%는 영양제를 약국 밖에서 산다(R4).
    경고 문구를 직접 본 사람도 판단하지 못해 AI에 물었다(E3). 우리가 열어 본 공개 질문 12건 중 9건은 의사·약사가 아니라 AI가 답했다(E3~E14). 약을 먹는 사람은 경고에서 그치지 않고 "같이 먹어도 되는 영양제"를 추천해 달라고 묻는다(E13, E14).
    팀원은 AI 답을 듣고 찜찜한 채 먹었고(E1), 팀원 아버지는 확인 없이 한꺼번에 드신다(E2).
  design_decision: |-
    앱을 여는 계기: ① 이미 묻고 있는 순간이다. 사 드린 뒤 걱정이 됐을 때(E17), 생성형 AI에 물을 때(E1, E16), Q&A에 질문을 올릴 때(E3, E5~E14). ② 영양제를 사거나 사 드리기 직전이다(E16, E22, E24, E26, E28).
    사용자가 달라져야 할 행동: "괜찮지 않을까?" 하고 그냥 드시던 부모님과 애매한 답에 찜찜한 채 먹던 사람이, 영양제를 사거나 목록에 더하기 전에 주의할 조합과 근거를 확인한다. 그리고 복용 간격을 지키거나, 리포트를 들고 약사·의사와 상의한다(E1, E2, E17).
    그래서 만드는 것: 한 번 등록하면 더할 때마다 알아서 점검하는 복용 목록이다. 사용 순서는 등록(F2) → 따로 묻지 않아도 경고(F3) → 검진 리포트와 근거 확인(F4) → 내 약과 부딪히지 않는 영양제 추천(F5)이다. 사기 전에는 로그인 없이 알아보기(F6)로 먼저 볼 수 있다.
    원칙: 공식 경고와 논문만 복용 목록에 연결하고, 판정은 같은 조합에 늘 같은 결과가 나오는 DB로만 한다. AI는 사진 읽기와 DB 안 추천 후보 고르기에만 쓴다. 처방·진단은 하지 않고, 자료에 없는 조합도 괜찮다고 단정하지 않는다.
    만들지 않는 것: 약끼리 점검(DUR이 본다), 처방·복용 지시, 특정 제품 추천, 가족 그룹(다음 버전).

# ── 구현 설계(전체) ──
# 로그인: 목록이 사람마다 따로 남아야 해서 필요하다. 이메일·비밀번호로 가입한다. 역할은 하나, '복용자'다.
# 첫 화면(/): 로그인 없이도 서비스 이름 TwoPills, "약과 영양제를 함께 먹을 때 해로운 조합을 출처와 함께 알려 줘요", 경고 예시, 처방·진단이 아니라는 안내, '회원가입'·'로그인'이 보인다.
# 주 사용 플랫폼: desktop(데모와 주최 측 실행은 PC 웹 화면). 휴대폰 화면은 다음 단계다.
# AI: 사진에서 이름 읽기(F2), DB 후보 안에서 비타민 고르기(F5) 두 곳에만 쓴다. 조합 판정(F3·F4)에는 쓰지 않는다.
# 우선순위: F1 → F2(검색) → F4 → F3 → F2(사진) → F5 → F6. 뺀 것: 약끼리 조합, 처방·복용 지시, 제품 추천. 다음 버전: 가족 그룹, 휴대폰 화면.
# 아직 확인 못 한 가정: 부모님이 직접 목록을 관리할 수 있는지, 약사가 리포트를 쓸모 있다고 보는지, 사진 인식이 얼마나 정확한지.
features:
  - id: F1
    name: 회원가입·로그인 (근거 — 매번 약국에 갈 수 없으니 한 번 등록한 목록을 계속 써야 한다. 영양제는 약국 밖에서 사고 R4, 약국에 가도 바빠서 다 봐 주지 못한다 E6)
    input: 이메일, 비밀번호(8자 이상), 비밀번호 확인
    output: |-
      계정이 생기고 홈으로 간다. 홈에는 '복용 목록'·'검진하기'와 '영양제 추천받기' 버튼이 있다. 로그인 화면에서 가상 페르소나 시연 계정으로 바로 들어갈 수도 있다.
      저장: 이메일, 비밀번호(bcrypt로 바꿔 저장), 첫 검진 시각. 로그인 상태는 서명한 쿠키로 유지한다.
      읽기·바꾸기: 본인만. 다른 사람의 계정과 목록은 볼 수 없다.
    done: |-
      가입하면 홈에 '복용 목록'·'검진하기'·'영양제 추천받기'가 보인다. 로그아웃했다 다시 로그인해도 목록이 그대로다.
      실패하면: 이메일 형식이 틀리거나, 비밀번호가 8자 미만이거나, 확인이 다르면 가입되지 않고 이유가 보인다. 이미 가입한 이메일이면 "이미 가입한 이메일이에요"가 보인다.
  - id: F2
    name: 약·영양제 등록(검색·사진) (근거 — 약과 영양제가 따로 들어온다 R4, 경고가 성분 이름으로만 적혀 있다 R7·E3, e약은요에는 처방약이 없다 R6, 부모님은 제품 이름을 기억 못 하시고 성분표를 읽기 어렵다 E20·P3)
    input: 제품 이름, '갑상선약' 같은 흔히 부르는 이름, 칼슘 같은 성분 이름으로 검색해 고르기. 또는 약 상자·봉투 사진. '하루에 먹는 개수'(필수, 1~20), '한 알 함량'(mg, 선택).
    output: |-
      내 목록에 약과 영양제가 나뉘어 저장된다. 사진은 AI가 글자를 읽고 DB에서 후보를 찾아 준다.
      저장: 고른 항목(약 제품·건강기능식품·성분), 하루에 먹는 개수, 한 알 함량. 사진은 메모리에서만 읽고 저장하지 않는다.
      읽기·바꾸기: 본인만 넣고 지운다. 약·성분 기준 데이터는 팀만 바꾼다(저장소 시드 파일).
    done: |-
      '비맥스'를 검색해 비맥스제트정을 하루 1개로 등록하면 목록에 생긴다. '삭제' → '삭제할까요?' 창에서 '삭제'를 누르면 사라진다.
      실패하면: 개수가 비었거나 1~20이 아니면, 함량이 숫자가 아니면 등록되지 않고 이유가 보인다. 이미 있는 항목은 다시 넣지 않고 알려 준다. 찾는 제품이 없으면 "찾는 제품이 없어요. 성분 이름(예 칼슘)으로 검색해 보세요"가 보인다.
      사진: '동의하고 찍기'를 누르기 전엔 보내지 않는다. 흐린 사진에는 "사진이 흐려서 읽지 못했어요. 다시 찍어 주세요"가 뜬다. 후보는 사람이 골라야 등록된다. AI 키가 없으면 사진 대신 검색으로 등록하라고 안내한다.
  - id: F3
    name: 더할 때 자동 점검 — 약×영양제, 영양제×영양제 (근거 — 영양제는 괜찮다고 여겨 묻지 않는다 R2·E2·E4, 경고를 보고도 판단하지 못했다 E3, AI 답은 애매하다 E1, 이름이 달라 같은 성분이 겹쳐도 모른다 E30·E33)
    input: 새로 등록하려는 약·영양제와 지금 내 목록
    output: |-
      첫 검진 뒤부터는 '등록'을 누를 때마다 목록 전체와 맞춰 본다. 걸리면 목록에 넣기 전에 경고 창이 뜬다.
      경고 창에는 할 일("함께 먹지 마세요", "시간을 띄워 드세요" 등), 원문 문장, 출처, 약사에게 물을 질문, '자세히'·'그래도 추가'·'취소'가 있다.
      처음 등록할 때는 경고 없이 넣고, 점검은 '검진하기'에서 한 번에 한다.
      판정: 제품에 든 성분까지 풀어서 DB의 조합 규칙(약×영양제, 영양제×영양제)과 맞춘다. AI는 쓰지 않는다.
      저장: 경고 결과는 저장하지 않고 등록할 때마다 다시 계산한다. '그래도 추가'를 누르면 항목만 저장된다.
    done: |-
      칼슘이 있는 목록에 비맥스제트정을 더하면 "함께 먹지 마세요"와 식약처 원문이 출처와 함께 뜬다. '취소'하면 목록에 안 들어간다.
      레보티록신이 있는 목록에 철분을 더하면 "레보티록신과 최소 4시간 띄워 드세요"가 뜬다.
      같은 두 항목의 근거가 여럿이면 경고 하나로 합치고 출처를 모은다. 같은 목록은 몇 번을 점검해도 결과가 같다.
      규칙이 없으면: "확인한 자료에서는 보고된 문제가 없어요. 걱정되면 약사에게 확인하세요"가 뜨고, 괜찮다고 단정하지 않는다.
  - id: F4
    name: 검진하기와 리포트 — 과다 섭취·근거 보기 포함 (근거 — 환자 70.3%가 영양제를 말하지 않는다 R2, 약국은 바빠서 다 봐 주지 못한다 E6, 어떻게 먹으면 되는지 묻는다 E7, 제품마다 권장량만 지킨다 E35, 출처를 밝히지 않는 AI·앱 대신 직접 확인할 수 있어야 한다 R9·E3, 약사 상담은 복용 중인 약과 보충제를 하나씩 확인하는 데서 시작한다 R21)
    input: 홈이나 아래 탭에서 '검진하기' → '검진 시작'
    output: |-
      목록 전체를 점검한 리포트가 나온다. 주의할 항목 수, 조합별 경고와 할 일, 하루 기준량을 넘는 성분, 먹는 약·영양제 표, 약사에게 물을 질문, 출처 모음이 있다. '자세히'를 누르면 원문, 링크, DB 확인 날짜가 보인다.
      저장: 첫 검진 시각만 남긴다(이때부터 F3 자동 점검이 켜진다). 리포트는 저장하지 않고 열 때마다 지금 목록으로 다시 만든다.
      읽기: 본인만. 약국에서 화면을 그대로 보여 주는 용도다.
    done: |-
      레보티록신과 칼슘이 있는 목록을 검진하면 "주의할 항목 1개"와 "레보티록신과 최소 4시간 띄워 드세요"가 보인다. '자세히'에서 논문과 MedlinePlus 링크가 열린다.
      칼슘을 하루 2알, 한 알 1500mg으로 넣으면 "하루 기준량을 넘어요"와 출처의 기준량이 보인다.
      처방·진단이 아니라는 안내와 약사 상담 안내가 같이 보인다. 목록이 비어 있으면 먼저 등록하라고 안내한다.
  - id: F5
    name: 영양제 추천 (근거 — 약을 먹는 사람이 같이 먹어도 되는 영양제를 추천해 달라고 묻는다 E13·E14, 영양제를 새로 챙길 때 내 약과 괜찮은지부터 묻는다 E12, 광고가 많아 고를 수가 없다 E16, 자녀는 부모님 약과 같이 드셔도 되는 영양제를 추천받으려고 약국에 간다 E17, 일반 AI 답은 내 약을 모르고 출처가 없다 E1·E3)
    input: 좋아지고 싶은 부분(피로·눈·뼈·피부·면역 중 하나 이상), 하루에 먹을 알 수(1~3알)
    output: |-
      알 수만큼 비타민을 추천하고, 이유와 식약처 기능성 출처를 붙인다. 후보는 출처 있는 DB 안에서만 고른다. 내 목록과 부딪히는 성분은 빼고 '주의' 칸에 경고로 보여 준다. 제품명과 구매 링크는 없다.
      AI: 설문을 읽고 DB 후보 안에서만 고른다. AI 키가 없거나 호출이 실패하면 설문과 기능성 내용이 맞는 후보로 고른다.
      저장: 설문과 추천 결과(본인만 볼 수 있다).
    done: |-
      레보티록신과 칼슘을 먹는 사람이 '피로'와 '1알'을 고르면 비타민 1개가 이유·출처와 함께 나온다. 철분은 '주의' 칸에 경고로 나온다.
      "이 추천은 진단이나 처방이 아니에요. 새로 드시기 전에 약사·의사와 상담하세요"가 보인다.
      실패하면: 부분을 고르지 않으면 "좋아지고 싶은 부분을 하나 이상 골라 주세요"가 보인다. 부딪히지 않는 후보가 없으면 약사와 상의하라고 안내한다.
  - id: F6
    name: 약·영양제 알아보기 (근거 — 문제가 있다는 것 자체를 모른 채 먹는다 R1·R2·E2, 자녀는 사 드리기 전에 약과 맞는지 찾아보지 않는다 E24·P2)
    input: 로그인 없이 성분이나 약 이름으로 찾기(두 글자 이상)
    output: |-
      그 성분이나 약에 DB로 기록된 조합 주의사항과 출처가 보인다.
      저장: 없다. 읽기: 누구나. 바꾸기: 팀만(저장소 시드 파일).
    done: |-
      로그인하지 않아도 상단 메뉴의 '약·영양제 알아보기'가 열린다. 칼슘을 찾으면 칼슘이 걸리는 조합과 출처 링크가 보인다. 처방·진단이 아니라는 안내가 보인다.
      기록이 없으면 "확인한 자료에서는 보고된 문제가 없어요. 걱정되면 약사에게 확인하세요"가 보인다.
