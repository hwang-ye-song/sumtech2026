# 종이 문제정의 캔버스(2026-10-29, 팀 늘크크)와 팀 대화·멘토링 내용을 옮긴 기록입니다.
# 외부 수치는 sources에 적은, 실제로 연 자료의 표현과 표본을 그대로 옮겼습니다.
# 2026-10-29 학생 답(화면 구성, 사진 등록, 분석 보고서, AI는 사진 인식에만, 복용량 직접 입력)을 반영했습니다.
# 2026-10-29 팀 기획서(해법 경로·기능 명세·사용자 흐름)를 합쳤습니다: 검토한 해법 경로, 추가할 때 점검, 판정·문구 규칙, 근거 보기, 예외 처리.
# 2026-10-29 출처를 확인할 수 없는 친구 사례를 빼고, 실제로 열어 확인한 공개 질문 글(E1~E5)과 국내 기사(R9, R10)로 바꿨습니다.
# 괄호 안의 E·R 번호는 그 내용의 근거가 되는 experiences·sources 항목입니다.

# 한 문장: (② 고객)은 (① 상황)에서 (③ 근본 문제) 때문에 (④ 영향)을 겪는다. 지금은 (⑤ 현재 대안)으로 버티지만 (⑥ 단점)이 남는다.
statement: 건강해지려고 영양제를 챙겨 먹으면서 약도 함께 먹는 사람은, 매일 영양제와 약을 함께 먹을 때, 둘을 한자리에서 점검해 주는 사람도 도구도 없고 본인도 해로운 조합을 알기 어렵기 때문에, 약효가 떨어지거나 몸에 해로운 조합을 모른 채 먹거나, 같이 먹어도 되는지 몰라 온라인에 하나하나 묻고 답을 기다린다. 지금은 SNS·약사·생성형 AI에 물어 버티지만, 잘못된 정보를 믿을 수 있고, 매번 묻기 번거롭고, 답이 부정확하거나 매번 달라지는 문제가 남는다.
canvas:
  context: 매일 영양제와 약을 함께 먹을 때. 영양제를 새로 시작하거나, 감기약·진통제를 사 먹거나, 병원에서 약을 새로 받을 때.
  customer: 건강해지려고 영양제를 챙겨 먹으면서 약(처방약·일반의약품)도 함께 먹는 사람.
  root_problem: 약과 영양제를 한자리에서 보는 사람이 없다. 의사·약사는 환자가 먹는 영양제를 모르고(R2), 약 점검 제도(DUR)에는 건강기능식품이 없다(R4). 복용자도 성분과 해로운 조합을 알기 어렵다(R1, E1).
  impact:
    feeling: 같이 먹어도 괜찮은지 몰라 걱정돼 묻고, 답을 듣고도 괜찮은지 몰라 찜찜하다(E6). 가족은 "머 괜찮지 않을까?" 하고 확인 없이 먹는다(E7). "씬지로이드빼고 다같이 먹어도 된다고해서 먹는데 괜찮나요??"(E5), "밥먹고 이약들을 다먹으면 흡수율이라던지 떨어지나요?"(E1). 건강해지려고 먹었는데 더 나빠지면 당혹스럽다.
    measurable: 공개 질문 글의 질문자들은 처방약 3~5개에 영양제 3~9개를 함께 먹거나 먹으려 하면서 그 조합을 따로 물어야 했다(E2~E4). 영양제를 먹는 사람은 86.1%지만 효능·부작용을 모두 안다는 응답은 15.3%뿐이다(R1). 일본 조사에서 약과 영양제를 함께 먹는 환자의 70.3%는 의사·약사에게 알리지 않았다(R2).
  alternatives:
    - how_used: 유튜브·SNS에서 찾아본다.
      shortcoming: 비전문가 의견이라 잘못된 정보를 믿을 수 있다.
      why_ours: 모든 판정에 공식 자료·논문 출처 링크와 연구 조건이 붙고, 출처 없는 조합은 DB에 들어가지 못한다.
    - how_used: 약사에게 하나하나 물어본다.
      shortcoming: 영양제를 살 때마다 물어보기 번거롭다.
      why_ours: 한 번 등록해 두면 새로 추가할 때마다 자동으로 점검되고, 집에서 바로 분석 보고서로 확인된다. 약사에게 보여 줄 근거 화면도 있다.
    - how_used: 생성형 AI에게 물어본다. 공개 질문 글 5건 중 4건(닥터나우)은 의사·약사가 아니라 AI가 답했다(E1~E4). 팀원도 AI에게 물었다(E6).
      shortcoming: 틀린 정보를 사실처럼 말하고, 물을 때마다 답이 달라진다.
      why_ours: 팀이 만든 DB로만 판정해 같은 조합에는 항상 같은 답과 출처가 나온다.
