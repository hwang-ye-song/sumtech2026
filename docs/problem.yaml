# 팀 늘크크의 문제정의입니다. 종이 문제정의 캔버스(2026-10-29)에서 시작해서, 2026-10-30 지금 앱(TwoPills) 기준으로 다시 정리했습니다.
# 괄호 안 번호는 근거입니다. E는 experiences, R은 sources, P는 personas, F는 features 항목입니다.

# 한 문장: (② 고객)은 (① 상황)에서 (③ 근본 문제) 때문에 (④ 영향)을 겪는다. 지금은 (⑤ 현재 대안)으로 버티지만 (⑥ 단점)이 남는다.
statement: |-
  약과 영양제를 같이 먹는 사람과 부모님께 영양제를 사 드리는 자녀는, 밥 먹고 약과 영양제를 한꺼번에 먹는 일이 매일 반복되는데도 둘을 같이 봐 주는 곳이 없어서 괜찮은지 모른 채 넘어간다.
  지금은 유튜브·생성형 AI·약사에게 물어 가며 버티지만, 답의 근거를 알 수 없거나 새로 하나 더할 때마다 다시 물어야 한다.

canvas:
  context: |-
    밥 먹고 약과 영양제를 한꺼번에 먹을 때. 매일 먹는 거라 매일 반복된다.
    어머니는 아침 식사 뒤 병원 약과 종합비타민·칼슘을 한꺼번에 드시고(E18), 아버지는 알레르기약과 비타민B·마그네슘·유산균을 밥 먹고 다 같이 드신다(E2).
    조합은 어느 날 슬쩍 바뀐다. 영양제를 먹다가 감기약이 생기기도 하고(E1), 자녀가 영양제를 사 드리면서 새 조합이 생기기도 한다(E17). 한 번 잘못 섞이면 알아챌 때까지 매일 그대로 먹게 된다.
  customer: |-
    약과 영양제를 같이 먹는 사람, 그리고 부모님 영양제를 챙기는 자녀다. 직접 들은 이야기로 보면 세 부류로 나뉜다.
    - 20~30대 직장인·대학생(P1): 유튜브나 광고를 보고 영양제를 사 먹는다. 감기약이나 처방약이 생기면 AI에게 물어보고, 답이 애매해도 “큰일이야 나겠어” 하고 먹는다(E1, E16).
    - 부모님께 영양제를 사 드리는 30~40대 자녀(P2): 부모님이 무슨 약을 드시는지 모르고 사 드린다. 사 드린 뒤에야 “이거 근데 같이 먹어도 되나?” 하고 걱정한다(E17).
    - 약을 매일 드시는 50~60대 부모님(P3): 혈압·갑상선·알레르기 약을 드시면서 영양제도 같이 드신다. 성분표를 봐도 약과 맞는지 알기 어렵고, 제품 이름을 기억 못 하시기도 한다(E2, E15, E20).
  root_problem: |-
    약과 영양제가 따로 들어온다. 약은 병원에서 받고, 영양제는 인터넷·마트·해외 직구로 산다(E15, E16, R4). 병원과 약국에서도 먹는 약만 묻고 영양제는 잘 묻지 않는다(E15). 먹는 사람도 영양제는 약이 아니라고 생각해서 굳이 말하지 않는다(E19, R2).
    같이 먹지 말라는 말은 약 설명서 안에만 있다. 비맥스제트정 설명서에는 칼슘염과 함께 먹지 말라고 적혀 있지만(R7), 내가 먹는 칼슘 영양제가 거기 해당하는지는 직접 맞춰 봐야 한다(E3). 약끼리는 DUR이 걸러 주지만 영양제는 대상이 아니다(R5).
    그래서 새 약이나 영양제가 생길 때마다 이 확인을 처음부터 다시 해야 하고, 결국 확인 없이 그냥 먹는 사람이 많다(R2, R4).
  impact:
    feeling: |-
      괜찮은지 몰라서 찜찜하다. AI에게 물어봐도 시간을 좀 띄워서 먹으면 문제없을 것 같다는 정도라 마음이 놓이지 않는다(E1). 온라인에도 “씬지로이드빼고 다같이 먹어도 된다고해서 먹는데 괜찮나요??” 같은 질문이 올라온다(E11).
      어머니는 “이게 다 뭘까…” 하면서 유튜브나 AI에게 묻는다(E15). 자녀는 사 드린 영양제를 약이랑 잘못 드셔서 더 안 좋아지실까 봐 걱정한다(E17).
    measurable: |-
      영양제를 먹는 사람은 많은데 제대로 아는 사람은 적다. 인크루트 설문(944명)에서 86.1%가 영양제를 1종 이상 먹었지만, 효능과 부작용까지 모두 안다는 응답은 15.3%였다(R1). 일본 조사에서는 약과 영양제를 같이 먹는 환자 1,508명 중 70.3%가 같이 먹어도 안전하다고 여겨 의사·약사에게 말하지 않았다(R2).
      조합에 따라 흡수가 실제로 줄어든다. 갑상선약(레보티록신)을 칼슘제와 같이 먹었더니 흡수가 약 20~25% 줄었고(R3, 건강한 성인 8명), 칼슘 300~600mg은 철분 흡수를 약 50~60% 줄였다(R10, 126명 식사 실험). 미국 국립의학도서관도 칼슘제·철분제는 레보티록신과 최소 4시간 띄워 먹으라고 안내한다(R12). 자주 쓰는 일반의약품 원문 36개 중 13개에는 칼슘염·철염 같은 영양제 성분과 같이 먹지 말라는 문구가 있었다(R22).
      다만 우리가 들은 사례에서 실제로 몸이 나빠졌는지까지는 확인하지 못했다.
  alternatives:
    - how_used: 유튜브·블로그·SNS에서 찾아본다. 영양제도 추천 영상이나 광고를 보고 산다(E15, E16).
      shortcoming: 비전문가 의견이나 광고가 섞여 있어서 잘못된 정보를 믿을 수 있다. 영상은 내가 먹는 약을 모른다(E1, E16).
      why_ours: 내 복용 목록에 있는 약과 바로 맞춰 보고, 식약처 원문과 논문 출처를 그대로 보여 준다(F3, F4).
    - how_used: 생성형 AI에게 지금 먹는 약과 영양제를 적고 같이 먹어도 되는지 물어본다(E1, E16).
      shortcoming: 부정확한 정보를 사실처럼 말할 수 있고, 답이 애매해서 결국 찜찜한 채로 먹는다(E1). 물어볼 때마다 먹는 걸 다시 적어야 하고, 묻는 방식에 따라 답이 달라질 수 있다.
      why_ours: 조합 판정에 AI를 쓰지 않는다. 사람이 원문을 확인해 넣은 DB로만 판정해서 같은 조합에는 늘 같은 답이 나온다. 한 번 등록해 두면 다시 적을 필요도 없다(F2, F3).
    - how_used: 약국에 가서 약사에게 하나하나 물어본다(E17).
      shortcoming: 매번 직접 가서 묻기 번거롭다. 먹는 제품 이름을 다 챙겨 가야 하는데 부모님은 이름을 기억 못 하시기도 하고(E20), 약국이 바쁘면 다 봐 주지 못한다(E6).
      why_ours: 검진 리포트에 먹는 약·영양제와 주의할 조합, 약사에게 물을 질문이 정리돼 있어서 약국에서 그대로 보여 주면 된다(F4).
    - how_used: 약 설명서나 식약처 e약은요에서 같이 먹으면 안 되는 성분을 직접 찾아본다(R7).
      shortcoming: 설명서에는 칼슘염처럼 성분 이름으로만 적혀 있어서, 내 영양제가 해당하는지 일일이 맞춰 봐야 한다(E3). e약은요는 일반의약품만 다뤄서 처방약은 따로 찾아야 한다(R6).
      why_ours: 제품 이름이나 '갑상선약' 같은 흔히 부르는 이름으로 등록하면, 제품에 든 성분까지 풀어서 내 목록 전체와 맞춰 본다(F2, F3).
    - how_used: 필라이즈 같은 영양제 관리 앱에 먹는 약과 영양제를 등록한다(R9).
      shortcoming: 위험 성분을 알려 준다고 하지만, 무슨 자료를 보고 판단했는지는 앱 소개에 나오지 않는다(R9).
      why_ours: 경고마다 근거가 된 원문 문장과 출처 링크, DB 확인 날짜를 붙인다(F3, F4).

personas:
  - id: P1
    description: |-
      영양제를 챙겨 먹는 20~30대 직장인·대학생.
      비타민B·마그네슘·오메가3 같은 영양제를 먹다가 감기약이나 처방약이 생긴다. 같이 먹어도 되는지 AI에게 물어보지만 답을 확신하지 못하고, 약국까지 가기는 번거로워서 그냥 먹는다.
    source: E1(팀원 본인), E3(닥터나우 공개 질문), E16(20대 팀원 인터뷰)
  - id: P2
    description: |-
      부모님께 영양제를 사 드리는 30~40대 자녀.
      유튜브에서 보고 영양제를 사 드리지만, 부모님이 무슨 약을 드시는지는 모른다. 사 드린 뒤에야 걱정이 돼서 약국에 가서 물어본다.
    source: E17(30대 자녀 인터뷰)
  - id: P3
    description: |-
      약을 매일 드시는 50~60대 부모님.
      혈압·갑상선·알레르기 약을 드시면서 직접 사거나 선물받은 영양제를 같이 드신다. 밥 먹고 한꺼번에 드시고, 성분표를 봐도 약과 맞는지 알기 어렵다. 먹는 제품 이름을 기억 못 하시기도 한다.
    source: E2(팀원 아버지), E15(팀원 어머니 인터뷰), E18·E19·E20(팀원 가족)

experiences:
  # E1·E2·E15~E20은 팀원 본인과 가족, 직접 인터뷰한 사람의 실제 경험이다(기록 동의 받음).
  # E3·E6·E10·E11은 공개 Q&A에서 실제로 열어 본 다른 사람의 질문 글이다. 인용은 원문 그대로 옮겼다.
  - id: E1
    when: 2026년 여름 시작할 때
    what_happened: 팀원이 감기약을 먹으면서 비타민B군과 마그네슘도 같이 먹었다. 같이 먹어도 되는지 궁금해서 생성형 AI에게 물었더니, 시간을 좀 띄워서 먹으면 문제없을 것 같다고 했다. 영양제는 유튜브 추천을 보고 샀는데, 영상은 약이랑 같이 먹어도 되는지는 알려 주지 않았다.
    workaround: AI 답대로 시간을 좀 띄워서 그냥 먹었다.
    feeling: 괜찮은지 몰라서 찜찜했다.
    quote: “감기약이랑 비타민B이랑 마그네슘 같이 먹어도 돼?”
    source: 팀원 본인 경험(2026-10-29 인터뷰)
  - id: E2
    when: 2026년
    what_happened: 팀원의 아버지가 알레르기약과 비타민B군·마그네슘·유산균을 매번 밥 먹고 한꺼번에 다 드신다. 팀원이 다 같이 먹어도 되냐고 물었지만, 아버지도 팀원도 확인해 보지 않았다.
    workaround: 확인하지 않고 그대로 드신다.
    feeling: 모름
    quote: 머 괜찮지 않을까?
    source: 팀원 가족(아버지) 경험, 팀원이 직접 보고 들음(2026-10-29 인터뷰)
  - id: E3
    when: 2026-10-07
    what_happened: 직장인이 포텐비정·오메가3(EPA·DHA 900mg)·칼슘·마그네슘·비타민K2&D 제품을 하루 한 알씩 같이 먹으려다, 포텐비정 주의사항의 칼슘염 병용 금지 문구와 세 제품의 비타민D 총량을 짚으며 같이 먹어도 되는지 물었다.
    workaround: 닥터나우 Q&A에 질문했다. AI 답변은 그 문구를 허가사항에서 확인하지 못했다며 첨부문서를 다시 보고 약사와 상담하라고 했다.
    feeling: 의아함
    quote: 포텐비정과 칼슘·오메가3 제품 동시 복용 가능할까요?
    source: https://doctornow.co.kr/content/qna/417f698127734632bb49611f15bc3bdc
  - id: E6
    when: 2024-05-28
    what_happened: 신경정신과 약·혈압약·고지혈증약·위장약 등 여러 약과 오메가3·비타민D·마그네슘·간·눈·부신 영양제를 같이 먹는 사람이, 약국은 바빠서 이걸 다 봐 주지 않는다며 같이 먹어도 되는지 물었다.
    workaround: 약국 상담을 제대로 받지 못해서 닥터나우 Q&A에 질문했다.
    feeling: null
    quote: 약국가서 이렇게 만을걸 상당 안해줘요 너무바빠서요
    source: https://doctornow.co.kr/content/qna/751ea9049dc5459a8037476cfdc55ef2
  - id: E10
    when: 2026-02-21
    what_happened: 처방약 3개와 영양제 9개를 먹는 사람이 조합에 문제가 없는지 물었다.
    workaround: 닥터나우 Q&A에 질문했다.
    feeling: 제대로 해소되지 않음
    quote: 복용 중인 약과 영양제 조합에 문제 없나요?
    source: https://doctornow.co.kr/content/qna/d7784efca716475882bc2f2ea7a32a6d
  - id: E11
    when: 2026-06-14
    what_happened: 갑상선약(씬지로이드)을 공복에 먹고 1시간 뒤 다른 약들을 같이 먹는 사람이 괜찮은지 물었다. 전문의 2명이 갑상선약은 공복에 단독으로 먹고 다른 약과 간격을 두라고 답했다.
    workaround: 하이닥 건강Q&A에 질문했다.
    feeling: 제대로 해소되지 않음
    quote: 씬지로이드빼고 다같이 먹어도 된다고해서 먹는데 괜찮나요??
    source: https://mobile.hidoc.co.kr/healthqna/view/C0001049485
  - id: E15
    when: 2026-10-29 인터뷰
    what_happened: 팀원의 50대 어머니는 오메가3·글루타치온·칼슘-마그네슘 영양제를 해외 직구로 사서 드신다. 병원과 약국은 먹는 약만 묻고 영양제는 묻지 않는다. 성분표는 읽어 보고, 영양제를 고르기 전에 인터넷에서 효능과 복용법을 찾아본다.
    workaround: 먹는 약과 같이 먹어도 되는지, 어떤 제품이 제일 좋은지는 유튜브의 약사·의사나 AI에게 묻는다.
    feeling: 모르겠음
    quote: “이게 다 뭘까…”
    source: 팀원 가족(어머니, 50대) 인터뷰(2026-10-29)
  - id: E16
    when: 2026-10-29 인터뷰
    what_happened: 20대 팀원은 비타민·밀크씨슬·오메가3 종합영양제를 광고를 보고 골라 매달 구독으로 산다. 약과 영양제를 같이 먹은 적이 있는데, 생성형 AI에게 묻고 그 답대로 먹었다. AI를 믿어서라기보다 큰일은 없겠다는 마음이었다.
    workaround: 생성형 AI에게 묻고 그대로 먹었다.
    feeling: 비타민만 해도 브랜드가 너무 많고 함량이 달라 뭐가 좋은지 모르겠고, 광고마다 다 좋다고 해서 고르기 어렵다.
    quote: 이 두 개를 같이 먹는다고 해서 큰일이야 나겠어
    source: 팀원 본인(20대) 인터뷰(2026-10-29)
  - id: E17
    when: 2026년 9월(인터뷰 2026-10-29)
    what_happened: 30대 자녀가 부모님이 기운이 없다고 하셔서 유튜브에서 찾아보고 비타민을 사 드렸다. 부모님이 무슨 약을 드시는지는 그때도 몰랐고 지금도 모른다. 영양제면 다 괜찮은 줄 알고 같이 드셔도 되는지 확인하지 않았는데, 사 드린 뒤에야 걱정이 됐다.
    workaround: 부모님 약과 같이 드셔도 되는 영양제를 추천받으려고 약국에 직접 가서 물어봤다.
    feeling: 나이 드셔서 몸이 안 좋으신데, 약이랑 영양제를 잘못 드셔서 더 안 좋아지실까 봐 걱정했다.
    quote: 이거 근데 같이 먹어도 되나?
    source: 30대 자녀 인터뷰(2026-10-29, 기록 동의 받음)
  - id: E18
    when: 2026년
    what_happened: 어머니가 아침 식사 뒤 병원에서 받은 약과 종합비타민, 칼슘을 한꺼번에 드신다. 같이 먹어도 되는지 확인해 본 적은 없다.
    workaround: 확인하지 않고 한꺼번에 드신다.
    feeling: 모르심
    quote: null
    source: 팀원 가족(어머니) 경험(팀 메모 T1, 2026-10-29 팀원 확인)
  - id: E19
    when: 2026년
    what_happened: 아버지는 병원에 가면 처방약 이야기만 하고, 집에서 먹는 영양제는 말하지 않는다. 영양제는 약이 아니라고 생각한다.
    workaround: 영양제는 말하지 않는다.
    feeling: 모르심
    quote: “아잇! 이게 무슨 약이야..! 상관없다니까”
    source: 팀원 가족(아버지) 경험(팀 메모 T2, 2026-10-29 팀원 확인)
  - id: E20
    when: 2026년
    what_happened: 부모님이 약과 영양제를 요일별 약통에 같이 담아 두셨다. 자녀가 물어봐도 제품 이름을 기억하지 못하신다.
    workaround: 자녀가 영양제 이름을 물어도 답하지 못하신다.
    feeling: 답답함
    quote: “뭐더라…그….”
    source: 팀원 가족(부모님) 경험(팀 메모 T3, 2026-10-29 팀원 확인)

sources:
  # 실제로 열어 확인한 자료만 적었다. 숫자와 인용은 원문 그대로다.
  - id: R1
    url: https://www.etoday.co.kr/news/view/2237180
    title: 영양제 복용하는 10명 중 8명 "효능‧부작용 잘 몰라" (이투데이, 2023, 인크루트 944명 설문)
    claim: 인크루트가 944명에게 한 설문(2023-04-04 발표)에서 1종 이상 영양제를 먹는 응답자는 86.1%였고, '효능과 부작용까지 모두 알고 있다'는 응답자는 15.3%였다. 조사 기간·방법·응답자 연령 구성은 기사에 나오지 않는다.
  - id: R2
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4425182/
    title: Concomitant Use of Dietary Supplements and Medicines in Patients due to Miscommunication with Physicians in Japan (Nutrients, 2015)
    claim: 일본 국립건강영양연구소가 2014년 7월 18~28일 온라인 패널(Macromill)로 조사했다. 예비조사 응답자 40,170명 중 19.6%가 약과 영양제를 같이 먹었고, 본조사 2,109명 중 환자 1,508명의 70.3%가 같이 먹어도 안전하다고 여겨 의사·약사에게 영양제 복용을 알리지 않았다.
  - id: R3
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3092723/
    title: Absorption of Levothyroxine When Coadministered with Various Calcium Formulations (Thyroid, 2011)
    claim: 갑상선 기능이 정상인 건강한 성인 8명이 레보티록신을 칼슘제(칼슘 500mg)와 한 번 같이 먹었을 때 흡수가 약 20~25% 줄었고, 저자들은 칼슘제와 충분히 띄워 먹으라고 권했다.
  - id: R4
    url: https://www.dailypharm.com/user/news/11889
    title: 참약사 "만성질환자 72%, 건기식 약국에서 안 사" (데일리팜, 2024-10-31, 처방약 복용 만성질환자 146명 조사)
    claim: 처방약을 먹는 만성질환자 146명 설문에서 건강기능식품을 약국이 아닌 곳에서 산 비율이 약 72%였고, 처방약과의 섭취 시간·용량 검토 없이 먹는 경우가 대부분이었다. 조사 시기는 기사에 나오지 않는다.
  - id: R5
    url: https://www.data.go.kr/data/15059486/openapi.do
    title: 식품의약품안전처_의약품안전사용서비스(DUR)품목정보 (공공데이터포털)
    claim: 의약품의 병용금기·노인주의·특정연령대금기·용량주의 등 9가지 항목을 제공하며, 공개된 항목에 건강기능식품은 없다(팀 확인).
  - id: R6
    url: https://www.data.go.kr/data/15075057/openapi.do
    title: 식품의약품안전처_의약품개요정보(e약은요) (공공데이터포털)
    claim: 일반의약품 중 공급실적이 있는 제품의 '이 약을 사용하는 동안 주의해야 할 약 또는 음식' 항목을 공식 문장으로 제공한다. 전문의약품(처방약)은 대상이 아니다.
  - id: R7
    url: https://nedrug.mfds.go.kr/searchEasyDrug/easyDetail?itemSeq=202300436
    title: 비맥스제트정 e약은요 (식약처 의약품안전나라)
    claim: 상호작용 항목에 "인산염, 칼슘염, 경구용 테트라사이클린계 제제, 제산제, 레보도파와 함께 복용하지 마십시오."라고 적혀 있다.
  - id: R9
    url: https://apps.apple.com/kr/app/id1595472563
    title: 필라이즈 (App Store 소개)
    claim: 내가 먹는 약·기저질환·알러지·건강 상태를 분석해 부작용 위험 성분을 미리 알려 준다고 소개하지만, 판단 근거가 된 자료 출처는 소개에 밝히지 않는다(팀 확인).
  - id: R10
    url: https://agris.fao.org/search/en/records/65de38d263b8185d9ca7afd3
    title: "Calcium: effect of different amounts on nonheme- and heme-iron absorption in humans (American Journal of Clinical Nutrition, 1991, Hallberg 외)"
    claim: 126명에게 칼슘을 넣은 빵을 먹인 한 끼 식사 실험에서, 칼슘은 300mg까지 양에 비례해 철분 흡수를 막았고 300~600mg에서는 흡수가 약 50~60% 줄었다.
  - id: R12
    url: https://medlineplus.gov/druginfo/meds/a682461.html
    title: Levothyroxine (MedlinePlus, 미국 국립의학도서관)
    claim: 탄산칼슘이나 황산제일철(철분 보충제)을 먹는다면 레보티록신보다 최소 4시간 전이나 4시간 뒤에 먹으라고 안내한다.
  - id: R18
    url: https://mfds.go.kr/webzine/202503/sub05.html
    title: 식약처 웹진 열린마루 2025년 3월호 (맞춤형건강기능식품 제도)
    claim: 건강기능식품끼리 중복 섭취하지 않도록 주의하고, 의약품과 함께 먹을 때도 위험이 있을 수 있다(예 알로에 + 일부 이뇨제 → 저칼륨혈증, 밀크씨슬 → 약 분해 속도 저하). 중복·병용 섭취 정보는 식품안전나라 '건강기능식품 섭취 주의사항'에서 확인할 수 있다.
  - id: R22
    url: https://nedrug.mfds.go.kr/searchEasyDrug/easyDetail?itemSeq=202300436
    title: 식약처 의약품안전나라 e약은요 — 자주 쓰는 일반의약품의 '주의해야 할 약 또는 음식' 항목 팀 조사(2026-10-29)
    claim: 해열진통제·감기약·소화제·제산제·비타민제·철분제 등 41개 품목을 찾아 원문이 있는 36개를 열어 보니 13개에 칼슘염·철염 등 영양제 성분과 함께 복용하지 말라는 문구가 있었다. 품목별 원문 주소와 문장은 database/eyak_supplement_warnings.csv에 있다(대표 원문 R7).

five_whys:
  symptom: 약과 영양제를 밥 먹고 한꺼번에 먹는다. 같이 먹어도 되는지는 아무도 확인하지 않는다(E2, E18).
  whys:
    - 왜 확인하지 않나? 영양제는 약이 아니라고 생각해서, 병원에 가도 영양제 이야기는 꺼내지 않는다(E19, R2).
    - 왜 병원·약국에서도 안 걸러지나? 병원과 약국은 먹는 약만 묻는다(E15). 약끼리 부딪히는지 보는 DUR에는 영양제가 없다(R5).
    - 왜 가족도 못 챙기나? 영양제는 본인이나 자녀가 인터넷·마트·직구로 따로 사는데(E15, R4), 자녀는 부모님이 무슨 약을 드시는지 모른다(E17).
    - 왜 직접 찾아봐도 모르나? 같이 먹지 말라는 말은 약 설명서에 성분 이름으로만 적혀 있어서, 내 영양제가 거기 해당하는지 직접 맞춰 봐야 한다(E3, R7).
    - 왜 계속 반복되나? 약과 영양제가 서로 다른 때, 다른 곳에서 더해지는데 그때마다 점검하는 단계가 없다. 결국 둘을 한곳에 모아 맞춰 볼 곳이 없다는 게 근본 문제다.

solution_paths:
  - path: |-
      먹는 약과 영양제를 한 목록에 모아 두고, 새로 더할 때마다 목록 전체와 맞춰 본다.
      약×영양제, 영양제×영양제 조합과 하루 기준량을 보고, 걸리면 원문 문장과 출처를 같이 보여 준다. 판정은 사람이 원문을 확인해 넣은 DB로만 한다. 제품 이름을 모르면 약 상자나 봉투 사진으로 찾을 수 있다.
    status: chosen
    reason: |-
      제품이 하나 늘 때마다 설명서를 찾아 맞춰 보는 수고를 덜고 싶었다(E3). 처음엔 두 제품만 넣어 비교하는 방식도 생각했지만, 처방약 3개에 영양제 9개를 먹는 사람도 있어서(E10) 목록을 저장해 두는 쪽으로 정했다.
      부모님은 제품 이름을 기억 못 하시기도 해서(E20) 사진 등록을 넣었다. 식약처도 건강기능식품끼리 겹쳐 먹지 않게 조심하라고 해서(R18) 영양제끼리도 본다.
  - path: 설문으로 비타민을 추천한다. 후보는 출처가 있는 DB 안에서만 고르고, 내 목록과 부딪히는 성분은 추천하지 않고 경고로 보여 준다.
    status: chosen
    reason: 광고마다 다 좋다고 해서 뭘 골라야 할지 모르겠다는 이야기가 있었다(E16). 다만 근거 없는 추천은 하지 않으려고, AI는 DB 후보 안에서 고르는 일만 한다.
  - path: 생성형 AI가 약과 영양제 조합을 직접 판정한다.
    status: rejected
    reason: 답이 애매하거나 물을 때마다 달라질 수 있다(E1, E16). 조합 판정은 DB로만 하고, AI는 사진 글자 읽기와 추천 후보 고르기에만 쓴다.
  - path: 약끼리 조합까지 점검한다.
    status: rejected
    reason: 약끼리는 병원·약국의 DUR이 이미 본다(R5). 우리는 DUR이 보지 않는 영양제 쪽에 집중한다.
  - path: 특정 영양제 제품을 골라 추천한다.
    status: deferred
    reason: 추천할 만큼 제품 데이터가 넉넉하지 않고, 어떤 제품을 먼저 추천할지 정할 기준도 아직 없다. 잘못된 구매로 이어질 수 있어서 지금은 성분 추천까지만 한다.
  - path: 부모님과 자녀가 한 목록을 같이 보는 가족 그룹을 만든다.
    status: deferred
    reason: 누가 누구 목록을 보고 고칠지, 개인정보를 어떻게 다룰지 먼저 정해야 해서 다음 버전으로 미뤘다. 지금은 자녀가 부모님 약과 영양제를 자기 목록에 넣어 점검한다.

insight:
  claim: |-
    약과 영양제를 같이 먹는 사람들은 둘을 따로 사고 따로 챙긴다. 그래서 같이 확인해 볼 계기가 없고, 확인하려 해도 근거 있는 답을 얻기 어렵다. 새 약이나 영양제가 생기면 이걸 처음부터 다시 해야 한다.
  evidence: |-
    아버지는 병원에서 영양제 이야기를 꺼내지 않고(E19), 어머니는 확인 없이 아침에 약과 영양제를 한꺼번에 드신다(E18). 자녀는 부모님 약을 모른 채 영양제를 사 드리고 나중에 걱정했다(E17).
    확인해 본 사람도 AI의 애매한 답에서 멈추거나(E1, E16), 설명서의 칼슘염 문구가 내 영양제에 해당하는지 판단하지 못했다(E3, R7). 일본 조사에서도 약과 영양제를 같이 먹는 환자의 70.3%가 의사·약사에게 말하지 않았다(R2).
  design_decision: |-
    한 번 등록해 두면 새로 더할 때마다 알아서 점검해 주는 복용 목록을 만든다. 경고에는 원문 문장과 출처 링크를 그대로 붙이고, 판정은 출처를 확인한 DB로만 한다. AI는 사진 글자 읽기와 추천 후보 고르기에만 쓴다. 확인한 자료에 없다고 해서 "안전하다"고 말하지 않는다.
    만들지 않는 것: 약끼리 조합 점검(DUR이 이미 본다), 처방이나 복용 지시, 특정 제품 추천, 가족 그룹(다음 버전).

features:
  - id: F1
    name: 회원가입·로그인
    input: 이메일, 비밀번호(8자 이상), 비밀번호 확인
    output: 계정이 생기고 홈으로 간다. 홈에는 '복용 목록'·'검진하기' 두 칸과 '영양제 추천받기' 버튼이 있다. 복용 목록은 계정마다 따로 저장된다. 로그인 화면에서 가상 페르소나 시연 계정으로 바로 들어갈 수도 있다.
    done: 가입하면 홈에 '복용 목록'·'검진하기'와 '영양제 추천받기'가 보인다. 로그아웃했다가 다시 로그인해도 목록이 그대로 있고, 다른 사람 목록은 볼 수 없다. 이메일 형식이 틀리거나 비밀번호가 8자보다 짧거나 확인이 다르면 가입되지 않고 이유를 보여 준다.
  - id: F2
    name: 약·영양제 등록(검색·사진)
    input: 제품 이름, '갑상선약' 같은 흔히 부르는 이름, 칼슘 같은 성분 이름으로 검색해서 고르기. 또는 약 상자·봉투 사진. 그리고 '하루에 먹는 개수'(필수)와 '한 알 함량'(mg, 선택).
    output: 내 복용 목록에 약과 영양제가 나뉘어 저장된다. 사진은 AI가 글자를 읽고 우리 DB에서 후보를 찾아 주며, 읽은 뒤 바로 지우고 저장하지 않는다.
    done: 검색창에 '비맥스'를 넣고 비맥스제트정을 골라 하루 1개로 등록하면 목록에 생긴다. '삭제'를 누르고 '삭제할까요?' 창에서 '삭제'를 누르면 목록에서 사라진다. 이미 있는 항목은 다시 넣지 않고 알려 준다. 찾는 제품이 없으면 성분 이름으로 찾아보라고 안내한다. 사진은 '동의하고 찍기'를 누르기 전에는 보내지 않고, 흐린 사진에는 "사진이 흐려서 읽지 못했어요. 다시 찍어 주세요"를 보여 준다. 사진에서 찾은 후보는 사람이 골라야 등록된다.
  - id: F3
    name: 더할 때 자동 점검
    input: 새로 등록하려는 약·영양제와 지금 내 복용 목록
    output: 첫 검진을 마친 뒤부터는 '등록'을 누를 때마다 목록 전체와 맞춰 본다. 걸리는 조합이 있으면 목록에 넣기 전에 경고 창을 띄운다. 경고 창에는 할 일("함께 먹지 마세요", "시간을 띄워 드세요" 등), 원문 문장, 출처, 약사에게 물을 질문과 '자세히'·'그래도 추가'·'취소'가 있다. 처음 등록할 때는 경고 없이 넣고, 점검은 '검진하기'에서 한 번에 한다.
    done: 칼슘이 있는 목록에 비맥스제트정을 더하면 "함께 먹지 마세요"와 식약처 원문 문장이 출처와 함께 뜨고, '취소'하면 목록에 들어가지 않는다. 레보티록신이 있는 목록에 철분을 더하면 "레보티록신과 최소 4시간 띄워 드세요"가 뜬다. 같은 두 항목에 근거가 여럿이면 경고 하나로 합치고 출처를 모아 보여 준다. 걸리는 조합이 없으면 "확인한 자료에서는 보고된 문제가 없어요. 걱정되면 약사에게 확인하세요"를 보여 주고, 안전하다고 말하지 않는다. 같은 목록은 몇 번을 점검해도 같은 결과가 나온다.
  - id: F4
    name: 검진하기와 리포트
    input: 홈이나 아래 탭에서 '검진하기'를 누르고 '검진 시작'
    output: 내 목록 전체를 한 번에 점검한 리포트. 주의할 항목 수, 조합별 경고와 할 일, 하루 기준량을 넘는 성분, 먹고 있는 약·영양제 표, 약사에게 물을 질문, 출처 모음이 나온다. 경고의 '자세히'를 누르면 출처별 원문과 링크, DB 확인 날짜가 보인다.
    done: 레보티록신과 칼슘이 있는 목록을 검진하면 "주의할 항목 1개"와 "레보티록신과 최소 4시간 띄워 드세요"가 보이고, '자세히'에서 논문과 MedlinePlus 출처 링크가 열린다. 칼슘을 하루 2알, 한 알 1500mg으로 넣으면 "하루 기준량을 넘어요"와 출처의 하루 기준량이 보인다. 리포트에 처방이나 진단이 아니라는 안내와 약사 상담 안내가 같이 보인다.
  - id: F5
    name: 영양제 추천
    input: 좋아지고 싶은 부분(피로·눈·뼈·피부·면역 중 하나 이상), 하루에 먹을 수 있는 알 수(1~3알)
    output: 하루 알 수만큼 비타민을 추천하고, 추천 이유와 식약처 기능성 내용 출처를 붙인다. 후보는 출처가 있는 DB 안에서만 고르고, 내 목록과 부딪히는 성분은 추천에서 빼서 '주의' 칸에 경고로 보여 준다. 제품명과 구매 링크는 없다. AI 키가 없으면 설문과 기능성 내용이 맞는 후보로 고른다.
    done: 레보티록신과 칼슘을 먹는 사람이 '피로'와 '1알'을 고르면 비타민 1개가 이유·출처와 함께 나오고, 철분은 추천이 아니라 '주의' 칸에 경고로 나온다. "이 추천은 진단이나 처방이 아니에요. 새로 드시기 전에 약사·의사와 상담하세요"가 보인다.
  - id: F6
    name: 약·영양제 알아보기
    input: 로그인 없이 성분이나 약 이름으로 찾기
    output: 그 성분이나 약에 DB로 기록된 조합 주의사항과 출처
    done: 로그인하지 않아도 상단 메뉴의 '약·영양제 알아보기'가 열린다. 칼슘을 찾으면 칼슘이 걸리는 조합과 출처 링크가 보인다. 처방이나 진단이 아니라는 안내가 보인다.
