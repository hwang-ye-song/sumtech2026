five_whys:
  symptom: 약과 영양제를 함께 복용하는 사람들은 상호작용을 확인하려고 해도 정확한 정보를 얻거나 자신이 복용하는 조합의 안전성을 판단하는 데 어려움을 겪는다.
  whys:
    - 왜 사람들은 약과 영양제의 상호작용을 확인하려고 해도 안전성을 판단하기 어려울까?
    - 왜 여러 방법을 이용해도 복용 중인 모든 제품의 상호작용을 확인하기 어려울까?
    - 왜 사용자가 복용 정보를 직접 준비하고 성분별 주의사항을 비교해야 할까?
    - 왜 약과 영양제의 정보가 분리되어 있을까?
    - 그렇다면 왜 이러한 정보의 분리가 사용자에게 지속적인 불편함으로 이어질까?
  # five whys로 파악한 근본 원인: 약과 영양제의 구매·관리 경로와 상호작용 정보가 분리되어 있어, 사용자가 복용 중인 전체 제품의 성분과 주의사항을 직접 연결하고 반복적으로 확인해야 하는 구조적 어려움이 있다.
solution_paths:
  - path: |-
      약 & 영양제 상호작용 자동 점검. 사용자가 현재 복용 중인 약과 영양제를 제품명으로 등록하면, 각 제품에 포함된 성분을 분석하여 주의가 필요한 조합을 확인한다. 이후 새로운 약이나 영양제를 추가할 때마다 기존 복용 목록 전체와 비교하여 상호작용 여부를 자동으로 점검한다.
      상호작용이 확인된 경우에는 문제가 되는 성분 조합과 구체적인 주의사항, 판단 근거 및 출처를 함께 제공한다. 약사 상담용 리포트도 구상했으나 현재 F1~F7에는 별도 기능으로 정의되지 않아 구현 범위를 추가로 결정해야 한다.
      초기에는 사용자가 두 제품을 입력하면 상호작용을 확인하는 단순 비교 방식도 고려했다. 그러나 실제 사례를 살펴보면 여러 약과 영양제를 동시에 복용하는 사람들이 있었고(E8, E10), 새로운 제품을 추가할 때마다 기존 제품과의 상호작용을 다시 확인해야 하는 문제가 있었다.
      또한 의약품의 칼슘염 관련 주의 문구를 두고 질문한 사례가 있었으며(E3), 다른 제품의 공식 안내에서도 칼슘염 병용 주의가 확인되었다(R7), 약사 상담을 받으려면 복용 중인 제품의 정보를 별도로 준비해야 하는 불편함도 있었다(E17).
      이에 따라 단순히 두 제품을 비교하는 방식보다 복용 목록을 저장하고, 새로운 제품이 추가될 때마다 전체 조합을 자동으로 점검하는 방식이 문제 해결에 더 적합하다고 판단했다.
      상호작용 판정은 생성형 AI에 직접 맡기지 않고, 식약처 공식 자료와 관련 학술논문 등을 사람이 검토하여 구축한 데이터베이스를 기준으로 수행하기로 했다. 이는 생성형 AI의 부정확하거나 일관되지 않은 답변에 대한 사용자의 불안감을 줄이고, 판단 근거를 직접 확인할 수 있도록 하기 위한 결정이다
    status: chosen
    reason: 사용자가 여러 제품의 성분과 주의사항을 직접 비교해야 하는 부담을 줄이고, 새로운 약이나 영양제를 추가할 때마다 반복적으로 발생하는 확인 과정을 간소화할 수 있기 때문이다. 또한 판단 근거와 출처를 제공하여 사용자가 주의사항을 이해하고 필요한 경우 전문가와 상담할 수 있도록 돕는다.
  - path: |-
      사진 촬영 기반 약·영양제 인식 및 복용 목록 등록
      사용자가 복용 중인 약이나 영양제의 제품명을 직접 검색하는 대신, 제품 또는 포장지의 사진을 촬영하여 복용 목록에 등록할 수 있도록 한다.
      사용자가 사진을 촬영하면 AI가 이미지에서 제품명과 식별 가능한 정보를 추출하고, 이를 의약품·영양제 데이터베이스와 대조하여 일치하는 제품 후보를 제시한다. 사용자는 인식된 제품명과 성분 정보를 확인하고, 필요한 경우 수정하거나 다시 촬영한 후 복용 목록에 등록한다.
      사진만으로 제품을 정확하게 식별할 수 없는 경우에는 인식 실패 또는 확인 필요 상태를 안내하고, 제품명 직접 검색으로 전환할 수 있도록 한다.
      등록이 완료되면 기존 복용 목록과 비교하여 성분 기반 상호작용 점검을 자동으로 실행한다. 사진 인식은 제품 등록을 보조하는 기능이며, 상호작용 판정은 별도의 검토된 데이터베이스를 기준으로 수행한다.

    status: chosen
    reason: |-
      실제 사용자 경험에서는 부모님이 복용하는 약의 이름을 정확히 알지 못하거나(E17), 약과 영양제를 약통에 옮겨 담은 뒤 제품명을 기억하지 못하는 사례(E20)가 확인되었다.
      이에 따라 제품명을 직접 검색하는 방식만 제공하면 사용자가 복용 정보를 등록하는 과정에서 어려움을 겪을 수 있다고 판단했다.
      사진 촬영을 통한 제품 인식은 제품명 입력 부담을 줄이고 복용 목록 등록을 보조할 수 있는 대안이다. 다만 사진 인식이 실제 등록 성공률을 높이는지는 사용자 테스트를 통해 검증해야 한다.
  - path: |-
      사용자가 원하는 건강관리 목적을 입력하면, AI가 검토된 근거 자료를 바탕으로 해당 목적과 관련된 영양제 성분 후보를 제시한다.
그러나 사용자가 원하는 것은 단순히 특정 영양제 성분을 추천받는 것이 아니라, 건강관리 목적에 맞는 성분을 선택하고 기존에 복용 중인 약이나 영양제와의 상호작용으로 발생할 수 있는 불필요한 위험을 줄이는 것이다.
실제로 사용자 인터뷰에서는 영양제를 구매할 때 유튜브나 광고를 참고하지만, 제품마다 성분과 함량이 달라 무엇을 선택해야 할지 어려움을 겪는 사례가 있었다(E16). 또한 영양제를 새롭게 복용하려는 사용자가 기존 처방약과 함께 복용해도 괜찮은지 확인하려는 사례도 나타났다(E8, E12).
이에 따라 사용자의 건강관리 목적에 적합한 성분 정보를 제공하는 것에서 그치지 않고, 이미 등록된 약과 영양제의 성분·함량을 함께 비교하여 주의가 필요한 상호작용이나 중복 섭취 가능성을 확인하도록 설계했다.
AI는 근거가 확보된 성분 정보를 탐색하고 추천 이유를 설명하는 데 활용하며, 상호작용 여부는 별도로 검토된 데이터베이스를 기준으로 점검한다. 이를 통해 사용자가 영양제의 기대 효과뿐 아니라 복용 과정에서 고려해야 할 위험도 함께 확인하고, 보다 신중하게 선택할 수 있도록 돕는다.
    status: chosen
    reason: **reason:**

사용자는 단순히 영양제 성분을 추천받는 것이 아니라, 자신의 건강관리 목적에 도움이 되는 성분을 선택하고, 기존에 복용하는 약이나 영양제와 함께 섭취할 때 발생할 수 있는 위험을 줄이고자 한다.

실제로 영양제를 구매할 때 다양한 제품의 성분과 함량 때문에 선택에 어려움을 겪는 사례가 있었으며(E16), 새로운 영양제를 복용하기 전에 기존 처방약과의 병용 가능성을 확인하려는 사례도 나타났다(E8, E12).

따라서 건강관리 목적에 맞는 성분을 추천하는 것만으로는 충분하지 않다고 판단했다. 추천된 성분이 기존 복용 제품과 상호작용을 일으키거나 중복·과다 섭취로 이어질 가능성도 함께 고려해야 하기 때문이다.

이에 따라 **근거 기반 성분 추천과 기존 복용 목록에 대한 상호작용·중복 섭취 점검을 연결하여**, 사용자가 영양제의 기대 효과와 복용 시 주의사항을 함께 확인하고 보다 신중하게 선택할 수 있도록 이 해결방안을 채택했다.
  - path: |-
      사용자의 건강관리 목적과 현재 복용 중인 약·영양제를 고려하여, 시중에서 판매되는 구체적인 영양제 제품을 추천하는 기능이다. 제품별 성분과 함량을 비교하고, 기존 복용 목록과의 상호작용도 함께 확인하는 방식을 구상했다.
      사용자 인터뷰에서는 영양제를 구매할 때 브랜드와 제품 종류가 많고, 같은 성분이라도 함량이 달라 어떤 제품을 선택해야 할지 모르겠다는 불편함이 나타났다(E16).
      이에 따라 단순한 성분 추천을 넘어 실제 구매할 수 있는 영양제 제품까지 추천하는 방안을 검토했다.
      그러나 이를 구현하기 위해서는 시중 영양제의 제품명, 제조사, 성분 구성, 성분별 함량 등 정확한 제품 데이터베이스가 필요하다. 현재는 추천에 활용할 만큼 충분한 제품 데이터를 확보하지 못했다.
      또한 어떤 기준으로 특정 제품을 다른 제품보다 우선 추천할 것인지 명확하게 결정하지 못했다. 성분의 종류와 함량뿐 아니라 사용자의 복용 목적, 기존 복용 제품과의 중복 여부 등을 어떤 방식으로 평가할지 추가적인 검토가 필요했다.
      제품 데이터가 불완전하거나 추천 기준이 명확하지 않은 상태에서 특정 제품을 추천하면, 사용자에게 적절하지 않은 선택을 유도할 가능성도 있다고 판단했다.
    status: deferred
    reason: |-
      영양제 제품 데이터베이스를 충분히 확보하지 못했고, 제품 간 우선순위를 결정할 객관적이고 일관된 추천 기준도 확립하지 못했기 때문이다.
      따라서 초기에는 근거를 확인할 수 있는 성분 정보와 상호작용 점검에 집중하고, 향후 제품 데이터 확보와 추천 기준 검증이 이루어진 후 구체적인 제품 추천 기능을 검토하기로 했다.
insight:
  claim: |-
    약과 영양제를 함께 복용하는 사람들은 여러 제품의 성분과 주의사항을 직접 비교하기 어렵고, 새로운 제품을 추가할 때마다 상호작용을 반복해서 확인해야 한다. 유튜브·SNS·생성형 AI를 이용하더라도 정보의 정확성을 확신하기 어렵고, 약사 상담을 위해서는 복용 정보를 별도로 준비해야 하는 불편함이 있다. 또한 영양제를 새로 구매할 때 어떤 성분과 제품을 선택해야 할지 판단하는 데에도 어려움을 겪는다.
  evidence: 생성형 AI에 약과 영양제의 병용 가능성을 질문하고도 불확실한 답변 때문에 불안감을 느낀 사례가 있었으며(E1), 포텐비정의 칼슘염 관련 주의 문구를 두고 질문한 사례가 있었으며(E3), 별도 제품인 비맥스제트정의 공식 안내에서도 칼슘염 병용 주의 문구가 확인된다(R7). 여러 약과 영양제를 동시에 복용하는 사례(E8, E10), 부모님의 복용 약을 정확히 알지 못해 영양제를 구매한 뒤 약사에게 상담한 사례(E17)도 있었다. 또한 광고를 참고해 영양제를 구매하지만 다양한 브랜드와 함량 때문에 선택에 어려움을 겪는 사례가 확인되었다(E16). 한편 팀 내부 검토에서는 구체적인 영양제 제품 추천에 필요한 제품 데이터베이스와 객관적인 추천 기준을 충분히 확보하지 못했다.
  design_decision: |-
    이에 따라 회원가입·로그인 기능을 통해 사용자가 복용 중인 약과 영양제를 등록하고 지속적으로 관리할 수 있도록 하며, 새로운 제품을 추가하면 기존 복용 목록과 비교하여 성분 간 상호작용을 자동으로 점검하는 기능을 선택했다. 상호작용 판단에는 검토된 공식 자료와 학술논문 기반 데이터베이스를 활용하고, 주의사항과 출처를 함께 제공하기로 했다. 또한 영양제 선택의 어려움을 줄이기 위해 AI를 활용하여 건강관리 목적에 맞는 영양제 성분 후보를 추천하되, 추천 성분과 기존 복용 제품의 상호작용은 별도로 점검하도록 결정했다. 반면 특정 영양제 제품을 직접 추천하는 기능은 충분한 제품 데이터베이스를 확보하지 못했고 제품별 추천 기준도 명확하게 정립하지 못했으므로 보류했다. 생성형 AI가 근거 없이 상호작용의 안전성을 직접 판정하는 방식도 채택하지 않기로 했다.
