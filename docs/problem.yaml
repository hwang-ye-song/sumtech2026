    what_happened: 20대 팀원은 광고를 보고 종합영양제를 골라 매달 구독한다. 약과 같이 먹을 때 AI에게 묻고 그대로 먹었다. AI를 믿어서가 아니라 큰일은 없겠다는 마음이었다.
