# 부모님 중심 기획서. 본문은 핵심 논리, experiences·sources는 상세 근거, features는 기능 명세입니다.
statement: |-
  약과 영양제를 함께 먹는 부모님은 제품이 바뀔 때마다 전체 복용 목록을 확인하기 어렵다. 성분표와 검색 결과를 직접 비교하거나 약사에게 물어야 해서, 확인하지 않은 채 함께 먹기도 한다(E2, E15, E25).
canvas:
  context: |-
    부모님은 병원에서 받은 약에 직접 사거나 선물받은 영양제를 더해 드신다(E18, E21). 새 약을 받아도 기존 영양제를 계속 먹고(E25), 이미 먹는 제품과 비슷한 영양제를 선물받기도 한다(E23). 제품은 하나씩 늘지만, 함께 먹는 목록을 확인하는 과정은 빠져 있다.
  customer: |-
    첫 고객은 약과 영양제를 함께 먹는 부모님이다(P3). 자녀는 제품 확인과 등록을 도울 수 있는 고객(P2), 영양제 선택에 어려움을 겪는 직장인·대학생은 확장 고객(P1)으로 둔다.
  root_problem: |-
    함께 먹는 제품을 한 목록으로 모으고, 성분을 비교하는 과정이 어렵다(E2, E19). 부모님은 영양제도 확인해야 한다고 생각하지 않거나, 성분표를 읽어도 약과의 관계를 판단하지 못한다(E15). 자녀도 부모님이 먹는 제품을 정확히 몰라 대신 확인하기 어렵다(E22, E24).
  impact:
    feeling: |-
      확인할 필요를 느끼지 않아 그대로 먹는 부모님도 있고(E2), 찾아봐도 확신이 없어 찜찜해하는 분도 있다(E15). 자녀는 영양제를 사 드린 뒤에야 함께 먹어도 되는지 걱정하기도 한다(E17).
    measurable: |-
      직접 확인한 경험에서는 복용 조합을 확인하지 않는 행동이 나타났다(E2, E18, E25). 실제 부작용 발생 여부는 확인하지 않았다.
      한국 만성질환자 146명 조사에서 약 72%는 영양제를 약국 밖에서 구매했다(R4, 2024년 학회 포스터·영양제 소분 업체 연구센터 조사). 이 수치만으로 전체 부모님의 행동을 일반화하지 않는다.
      팀이 확인한 일반의약품 36개 중 12개에는 영양제 성분과 "함께 복용하지 마십시오" 문구가, 1개(개비스콘)에는 "의사 또는 약사와 상의하십시오" 문구가 있었다(R22). 대부분 비타민·철분제인 편의 표본이며, 전체 의약품의 위험 비율은 아니다. 나머지 조사·연구의 수치와 조건은 sources에 남긴다.
  alternatives:
    - how_used: |-
        부모님은 평소 먹던 약과 영양제를 식사 뒤 함께 드신다(E2, E18). 새 약을 받거나 영양제를 선물받아도 기존 목록과 맞춰 보지 않고 추가하기도 한다(E21, E25).
        병원에 갈 때는 약만 이야기하고 영양제는 말하지 않는 경우도 있다(E19). 다만 확인이 필요한지 몰랐던 행동과, 실제로 해로운 조합을 먹었다는 사실은 구분한다.
      shortcoming: |-
        새 제품이 들어와도 다시 확인하는 계기가 없다. 가족이 물어도 "머 괜찮지 않을까?" 하고 기존대로 먹을 수 있다(E2).
      why_ours: |-
        먹는 목록을 한 번 모아 두고, 이후 새 약이나 영양제를 추가하면 기존 목록과 자동으로 비교한다(F3·F4). 처음 등록을 마칠 수 있는지와 이후 목록을 갱신하는지는 별도로 검증해야 한다.
    - how_used: 걱정이 될 때는 유튜브·블로그·SNS에서 "OO이랑 같이 먹어도 되나"를 검색해 본다(E15). 영양제도 유튜브 추천이나 광고를 보고 산다(E1, E16).
      shortcoming: |-
        제품을 고를 때 참고할 수는 있지만, 영상이나 글이 부모님이 먹는 약까지 아는 것은 아니다(E1, E15). 광고마다 설명이 달라 무엇을 골라야 할지 어려웠다는 경험도 있다(E16).
      why_ours: 경고에 식약처 원문·논문과 출처 링크를 붙인다. 출처를 확인한 조합만 DB에 넣는다(F6, F7).
    - how_used: 약국에 갈 일이 있을 때 약사에게 "이거 같이 먹어도 돼요?" 하고 묻는다.
      shortcoming: |-
        먹는 약과 영양제를 모두 알려 주면 상담할 수 있다. 하지만 살 때마다 약국에 가기 번거롭고, 상담을 충분히 받지 못한 경험도 있다(E6, E17). 복용 목록을 말하지 않으면 집에서 먹는 영양제까지 알기 어렵다(E19).
      why_ours: |-
        약사에게 보여 줄 목록과 질문을 미리 정리한다(F5). 앱은 확인한 근거를 보여 주고, 실제 복용 변경은 약사·의사와 상의하도록 돕는다(R21). 약사 상담을 대신하는 서비스로 설명하지 않는다.
    - how_used: 챗GPT 같은 생성형 AI나 온라인 상담의 AI에게 먹는 약과 영양제 이름을 적고 같이 먹어도 되는지 묻는다(E1, E3, E15, E16). 공개 질문 글 12건 중 9건은 의사·약사가 아니라 AI가 답했다(E3~E14).
      shortcoming: 틀린 말도 사실처럼 하고, 설명서 문구를 확인하지 못한 채 답하며(E3), "띄워 먹으면 문제없을 것 같다"처럼 애매해 듣고도 찜찜하거나(E1), 믿어서가 아니라 "큰일이야 나겠어" 하고 넘기게 된다(E16).
      why_ours: 식약처 원문과 논문에서 뽑아 사람이 확인한 DB로만 판정해, 같은 조합에는 항상 같은 답과 같은 출처가 나온다(F4).
    - how_used: 필라이즈 같은 건강 앱에 먹는 약과 영양제를 넣어 부작용 위험 성분을 확인한다(R9).
      shortcoming: 위험 성분을 알려 준다고 하지만, 그 판단이 어떤 공식 자료에서 왔는지 앱 소개에 밝히지 않는다(R9).
      why_ours: 경고마다 근거가 된 원문 문장과 출처 링크를 보여 줘, 사용자와 약사가 직접 확인할 수 있다(F6).
    - how_used: 심평원 '내가 먹는 약 한눈에'(카카오톡 인증)에서 최근 1년 동안 병원·약국에서 처방받은 약 이력을 본다(R17).
      shortcoming: 처방받은 약의 이력을 보여 주는 서비스라(R17), 약국 밖에서 산 영양제(R4)와 맞춰 보거나 "같이 먹지 마세요" 경고를 알려 주지는 않는다. 영양제를 사 드리는 자녀는 부모님 인증이 없으면 볼 수 없다.
      why_ours: 처방 이력을 보고 복용 목록을 채울 수 있다. 여기서 본 약 이름을 그대로 검색해 넣으면 영양제와 함께 점검된다(F3).
    - how_used: 약 상자나 설명서의 주의사항을 직접 읽어 보거나, 식약처 e약은요에서 약 이름을 검색한다.
      shortcoming: 약 하나씩의 긴 설명이라 내 영양제와 맞춰 보는 건 스스로 해야 하고, "칼슘염"처럼 성분 이름으로만 적혀 있어 내 영양제가 해당하는지 알기 어렵다(R7, E3). 병원 약(처방약)은 e약은요에 나오지 않는다(R6).
      why_ours: 내 약과 영양제를 한 목록에 두고 더하는 순간 서로 맞춰 보며, 처방약도 약 봉투에 적힌 제품명(예 씬지로이드정)이나 흔히 부르는 이름(예 갑상선약)으로 등록한다(F3).
personas:
  - id: P1
    description: |-
      확장 고객. 영양제 선택과 병용 여부를 확인하려는 직장인·대학생이다. AI에 묻거나 광고를 참고해도 선택이 어렵다(E1, E16, E26~E29).
    source: E1(팀원 본인), E3(닥터나우 공개 질문, 2026-10-07), E12(하이닥 공개 질문, 31세), E16(20대 팀원 인터뷰)
  - id: P2
    description: |-
      등록을 도울 수 있는 고객. 부모님께 영양제를 사 드리는 자녀다. 부모님의 약과 영양제를 정확히 몰라 선물한 뒤 병용 여부를 걱정하기도 한다(E17, E22, E23).
    source: E17(30대 자녀 인터뷰), E4(닥터나우 공개 질문, 2024-11-05), 팀 논의
  - id: P3
    description: |-
      첫 고객. 약과 영양제를 함께 먹는 부모님이다. 새 제품이 생겨도 기존 목록과 비교하지 않거나, 성분표를 읽어도 판단하기 어렵다(E15, E18, E25).
    source: 팀 논의(종이 캔버스 P1을 고객에 맞춰 좁힘), E2(팀원 아버지), E15(팀원 어머니 인터뷰, 50대), R3, R4
experiences:
  # E1·E2는 팀원 인터뷰(2026-10-29)에서 들은 실제 경험이다. AI 답과 아버지 말은 기억에 의한 인용이다.
  - id: E1
    when: 2026년 여름 시작할 때
    what_happened: 팀원이 감기약을 먹으면서 비타민B군과 마그네슘도 함께 먹었다. 같이 먹어도 되는지 궁금해 생성형 AI에게 물었고, AI는 시간을 좀 띄워서 먹으면 문제없을 것 같다고 답했다. 영양제는 유튜브 추천을 보고 샀는데, 영상은 약과 같이 먹어도 되는지는 알려 주지 않았다.
    workaround: AI 답을 믿고 시간을 좀 띄워서 그냥 먹었다.
    feeling: 괜찮은지 몰라서 찜찜했다.
    quote: null
    source: 팀원 본인 경험(2026-10-29 인터뷰)
  - id: E2
    when: null
    what_happened: 팀원의 아버지가 알레르기약과 비타민B군·마그네슘·유산균을 매번 밥 먹고 한꺼번에 다 드신다. 팀원이 다 같이 한 번에 먹어도 되냐고 물었지만, 아버지도 팀원도 확인해 보지 않았다.
    workaround: 확인하지 않고 그대로 드신다.
    feeling: null
    quote: 머 괜찮지 않을까?
    source: 팀원 가족(아버지) 경험, 팀원이 직접 보고 들음(2026-10-29 인터뷰)
  # E3~E14(E12~E14 포함)는 공개 Q&A에서 실제로 열어 확인한 다른 사람의 질문 글이다(팀원 경험 아님). 인용은 원문 그대로.
  - id: E3
    when: 2026-10-07
    what_happened: 직장인이 포텐비정·오메가3(EPA·DHA 900mg)·칼슘·마그네슘·비타민K2&D 제품을 하루 한 알씩 함께 먹으려다, 포텐비정 주의사항의 칼슘염 병용 금지 문구와 세 제품의 비타민D 총량을 짚으며 같이 먹어도 되는지 물었다.
    workaround: 닥터나우 Q&A에 질문했고 닥터나우 AI의 참고용 답변을 받았다. 답변은 그 문구를 허가사항에서 확인하지 못했다며 첨부문서를 다시 보고 약사와 상담하라고 했다.
    feeling: null
    quote: 포텐비정과 칼슘·오메가3 제품 동시 복용 가능할까요?
    source: https://doctornow.co.kr/content/qna/417f698127734632bb49611f15bc3bdc
  - id: E4
    when: 2024-11-05
    what_happened: 부모님께 뇌영양제·관절영양제·비타민·오메가3를 사 드리는 자녀가 언제 드시게 하면 좋은지 복용 시간만 물었다. 부모님이 드시는 약이 있는지, 그 약과 같이 드셔도 되는지는 묻지 않았다.
    workaround: 닥터나우 Q&A에 질문했고 닥터나우 AI의 참고용 답변을 받았다.
    feeling: null
    quote: 부모님 건강보조제를 사드리는데 복용시간 등 방법이 궁금합니다.
    source: https://doctornow.co.kr/content/qna/c07f22e0cd4a4f7e8d9e21c63472c6a0
  - id: E5
    when: 2025-05-13
    what_happened: 병원에서 기넥신(은행잎 추출물 약)과 아로나민씨플러스를 처방받은 사람이, 원래 먹던 멀티비타민·오메가3+비타민D·히알루론산·유산균·밀크씨슬·바나바잎 캡슐을 다 같이 먹어도 되는지 물었다.
    workaround: 닥터나우 Q&A에 질문했다. 닥터나우 의료진은 오메가3가 기넥신과 함께 먹으면 출혈 위험이 약간 늘 수 있고, 아로나민씨플러스와 멀티비타민은 하나만 고르는 게 안전하다고 답했다.
    feeling: null
    quote: null
    source: https://doctornow.co.kr/content/qna/8374b50cd5944989b243d9b642efadaf
  - id: E6
    when: 2024-05-28
    what_happened: 신경정신과 약·혈압약·고지혈증약·위장약 등 여러 약과 오메가3·비타민D·마그네슘·간·눈·부신 영양제를 함께 먹는 사람이, 약국에서는 바빠서 이걸 다 봐 주지 않는다며 같이 먹어도 되는지 물었다.
    workaround: 약국 상담을 제대로 받지 못해 닥터나우 Q&A에 질문했고 닥터나우 AI의 참고용 답변을 받았다.
    feeling: null
    quote: 약국가서 이렇게 만을걸 상당 안해줘요 너무바빠서요
    source: https://doctornow.co.kr/content/qna/751ea9049dc5459a8037476cfdc55ef2
  - id: E7
    when: 2025-02-16
    what_happened: 갑상선호르몬 영양제와 아르기닌, 비타민D·철분·아연·마그네슘을 먹는 사람이 식후에 한꺼번에 먹으면 흡수가 떨어지는지, 간격을 얼마나 둬야 하는지 물었다.
    workaround: 닥터나우 Q&A에 질문했고 닥터나우 AI가 답했다.
    feeling: null
    quote: 밥먹고 이약들을 다먹으면 흡수율이라던지 떨어지나요? / 그러면 몇 분 동안 텀을 둬서 3가지 약을 먹어야할까요
    source: https://doctornow.co.kr/content/qna/85480e192cc04724a634692b7dc12520
  - id: E8
    when: 2026-06-20
    what_happened: 피부과 처방약 5개를 1년 넘게 먹는 사람이 오메가3·비타민B·C·D+K2·유산균·마그네슘·커큐민·밀크시슬 8가지를 함께 먹어도 되는지 물었다.
